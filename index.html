async function saveOwned_(id, data){
  const ref_ = doc(db, 'stores', activeStoreCode_, 'ownedGames', id);
  try{
    if (data === null){ await deleteDoc(ref_); ownedGamesMap_.delete(id); }
    else { await setDoc(ref_, { ...data, updatedAt: Date.now() }); ownedGamesMap_.set(id, { ...data }); }
    return true;
  }catch(e){ console.error(e); alert('저장하지 못했습니다. 잠시 후 다시 시도해주세요.'); return false; }
}
/** 저장용 보유 문서: 예전 colors 배열은 stickers로 옮겨 적고, 수량을 함께 둡니다.
 *  수량을 0으로 해도 정해 둔 스티커는 지우지 않고 "미보유"로만 표시합니다 (다시 보유하면 그대로 살아남). */
function ownedDocWith_(id, patch){
  const o = { ...(ownedGamesMap_.get(String(id)) || {}) };
  const stickers = Array.isArray(o.stickers) ? o.stickers : (Array.isArray(o.colors) ? o.colors.map((name, i)=>({ code:String(i+1), label:name })) : []);
  delete o.colors; delete o.updatedAt;
  const used = stickers.map(st=>Number(st.code)||0);
  return { ...o, stickers, lastStickerCode: Math.max(Number(o.lastStickerCode)||0, 0, ...used), qty: ownedQty_(id), owned: ownedQty_(id) > 0, ...patch };
}
async function setOwnedQty_(id, v){
  const n = Math.max(0, Math.min(99, parseInt(v, 10) || 0));
  if (!n) ownedPickerFor_ = null;
  await saveOwned_(String(id), ownedDocWith_(id, { qty: n, owned: n > 0 }));
  renderOwnedList_();
}
function toggleOwnedPicker_(id){
  ownedPickerFor_ = ownedPickerFor_ === id ? null : id;
  renderOwnedList_();
  if (ownedPickerFor_) document.getElementById(`stickerInput_${id}`)?.focus();
}
/** 식별 스티커 값을 추가합니다. 값은 매장이 자유롭게 정하는 글자이고, 각각 바뀌지 않는 숫자 코드를 받아
 *  QR에 들어갑니다 (나중에 글자를 지우거나 바꿔도 이미 붙인 QR의 코드는 그대로 유지). */
async function addOwnedColor_(id, label){
  label = String(label||'').trim();
  if (!label){ document.getElementById(`stickerInput_${id}`)?.focus(); return; }
  const base = ownedDocWith_(id, {});
  if (base.stickers.some(st=>st.label === label)){ alert(`"${label}"은(는) 이미 등록된 식별 스티커입니다.`); return; }
  const code = String(base.lastStickerCode + 1);
  const stickers = [...base.stickers, { code, label }];
  // 스티커는 박스마다 하나씩이므로, 스티커가 수량보다 많아지면 수량도 함께 늘립니다.
  const qty = Math.max(base.qty, stickers.length);
  // 수량만큼 다 정할 때까지 입력칸을 열어 둡니다 (연달아 입력하기 편하게).
  ownedPickerFor_ = stickers.length < qty ? String(id) : null;
  await saveOwned_(String(id), { ...base, stickers, lastStickerCode: Number(code), qty, owned: true });
  renderOwnedList_();
  if (ownedPickerFor_) document.getElementById(`stickerInput_${id}`)?.focus();
}
async function removeOwnedColor_(id, code){
  const st = getOwnedStickers_(id).find(x=>x.code===String(code));
  if (!st || !confirm(`식별 스티커 "${st.label}"을(를) 삭제할까요?\n이미 붙인 QR은 스캔하면 "#${st.code}"로 표시됩니다.`)) return;
  const base = ownedDocWith_(id, {});
  await saveOwned_(String(id), { ...base, stickers: base.stickers.filter(x=>x.code!==String(code)) });
  renderOwnedList_();
}

// ---- 보유 수량 엑셀 (양식 받기 → C열 수량 입력 → 업로드) ----
async function downloadOwnedXlsx_(){
  try{
    const X = await loadXlsx_();
    const storeName = (storeList_.find(s=>s.code===activeStoreCode_)||{}).name || activeStoreCode_;
    const rows = [['게임ID', '게임 이름', '보유 수량', '식별 스티커 (참고용 · 수정해도 반영 안 됨)']];
    games.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''), 'ko')).forEach(g=>{
      const q = ownedQty_(g.id);
      rows.push([String(g.id), g.name || '', q || '', getOwnedStickers_(g.id).map(st=>st.label).join(', ')]);
    });
    const ws = X.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 12 }, { wch: 30 }, { wch: 10 }, { wch: 34 }];
    const guide = X.utils.aoa_to_sheet([
      ['보유 게임 엑셀 작성 방법'],
      ['1. "보유 게임" 시트의 C열(보유 수량)만 숫자로 채워주세요. 빈 칸이나 0은 미보유입니다.'],
      ['2. A열(게임ID)은 바꾸지 마세요. 줄 순서는 바꿔도 되고, 필요 없는 줄은 지워도 됩니다 (지운 게임은 지금 수량 그대로 유지).'],
      ['3. 같은 게임이 2개 이상이면 업로드 후 사이트의 "보유 게임 관리 → ⚠ 스티커 지정 필요"에서 박스별 식별 스티커 값을 정해주세요.'],
    ]);
    guide['!cols'] = [{ wch: 110 }];
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, '보유 게임');
    X.utils.book_append_sheet(wb, guide, '작성 방법');
    X.writeFile(wb, `보유게임_${storeName}_${dayKey_(Date.now())}.xlsx`);
  }catch(e){ alert(e.message); }
}

async function parseOwnedXlsx_(file){
  if (!file) return;
  ownedXlsxParsed_ = { loading: true };
  renderOwnedXlsxPanel_();
  try{
    const X = await loadXlsx_();
    const wb = X.read(await file.arrayBuffer(), { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = X.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' });
    const rows = [], seen = new Set();
    aoa.forEach((r, idx)=>{
      if (idx === 0) return; // 제목 행
      const id = String(r[0]==null?'':r[0]).trim();
      const qtyRaw = String(r[2]==null?'':r[2]).trim();
      if (!id) return;
      const row = { rowNo: idx+1, id, name: '', msgs: [] };
      const g = games.find(x=>String(x.id)===id);
      if (!g) row.msgs.push(`등록되지 않은 게임 ID "${id}"`);
      else row.name = g.name || '';
      if (seen.has(id)) row.msgs.push(`파일 안에서 ID "${id}"가 중복됩니다`);
      seen.add(id);
      const n = qtyRaw === '' ? 0 : Number(qtyRaw.replace(/[,개\s]/g, ''));
      if (!Number.isInteger(n) || n < 0 || n > 99) row.msgs.push(`보유 수량 "${qtyRaw}"은(는) 0~99 사이 정수여야 합니다`);
      row.qty = Number.isInteger(n) ? n : 0;
      row.prev = g ? ownedQty_(g.id) : 0;
      row.status = row.msgs.length ? 'error' : row.qty === row.prev ? 'same' : !row.prev ? 'add' : !row.qty ? 'remove' : 'change';
      rows.push(row);
    });
    ownedXlsxParsed_ = { rows };
  }catch(e){
    console.error(e);
    ownedXlsxParsed_ = { error: e.message || '파일을 읽지 못했습니다' };
  }
  renderOwnedXlsxPanel_();
}

function ownedXlsxPreviewHtml_(){
  const P = ownedXlsxParsed_;
  if (!P) return '';
  if (P.loading) return '<p>파일을 읽는 중...</p>';
  if (P.error) return `<p style="color:var(--danger);">파일을 읽지 못했습니다. ${escHtml_(P.error)}</p>`;
  const by = k => P.rows.filter(r=>r.status===k);
  const errs = by('error'), changes = P.rows.filter(r=>['add','change','remove'].includes(r.status));
  const willNeed = changes.filter(r=>r.qty >= 2 && getOwnedStickers_(r.id).length < r.qty).length;
  const label = { add:'보유 추가', change:'수량 변경', remove:'보유 해제' };
  return `
    <div class="st-bar" style="margin-top:6px;">
      <span class="xl-ok">보유 추가 ${by('add').length}</span>
      <span class="xl-warn">수량 변경 ${by('change').length}</span>
      <span class="xl-err">보유 해제 ${by('remove').length}</span>
      <span class="row-sub">변경 없음 ${by('same').length}</span>
      ${errs.length ? `<span class="xl-err">오류 ${errs.length}</span>` : ''}
    </div>
    ${errs.length ? `<div style="background:#fff8f7; border:1px solid #f4cfcd; border-radius:9px; padding:8px 10px; font-size:12px; color:var(--accent); line-height:1.7; margin-bottom:10px; max-height:140px; overflow-y:auto;">${errs.map(r=>`${r.rowNo}행 · ${escHtml_(r.msgs.join(' / '))}`).join('<br>')}</div>` : ''}
    ${changes.length ? `
    <div style="max-height:220px; overflow:auto; margin-bottom:10px;">
      <table class="xl-table"><thead><tr><th>게임</th><th>지금</th><th>→ 업로드</th><th>구분</th></tr></thead>
      <tbody>${changes.slice(0, 300).map(r=>`<tr><td>${escHtml_(r.name)}</td><td>${r.prev}</td><td><b>${r.qty}</b></td><td class="${r.status==='add'?'xl-ok':r.status==='remove'?'xl-err':'xl-warn'}">${label[r.status]}</td></tr>`).join('')}</tbody></table>
    </div>` : '<p style="font-size:12.5px;">바뀌는 내용이 없습니다.</p>'}
    ${willNeed ? `<p style="font-size:12.5px; color:var(--accent); margin-bottom:8px;">⚠ 반영 후 ${willNeed}개 게임은 보유 수량이 2개 이상이라 식별 스티커를 정해야 합니다.</p>` : ''}
    <button class="btn btn-primary2 btn-sm" ${changes.length?'':'disabled'} onclick="applyOwnedXlsx_()">${changes.length}건 반영 (오류 행은 제외)</button>
    <button class="btn btn-ghost2 btn-sm" onclick="ownedXlsxCancel_()">취소</button>
    <div id="ownedXlsxStatus" style="margin-top:8px; font-size:12.5px; color:var(--ink-soft);"></div>`;
}
function ownedXlsxCancel_(){ ownedXlsxParsed_ = null; renderOwnedXlsxPanel_(); }

async function applyOwnedXlsx_(){
  const P = ownedXlsxParsed_;
  const targets = (P && P.rows || []).filter(r=>['add','change','remove'].includes(r.status));
  if (!targets.length) return;
  const removes = targets.filter(r=>r.status==='remove').length;
  if (!confirm(`${targets.length}건을 반영할까요?${removes ? `\n(보유 해제 ${removes}건 포함 — 정해 둔 식별 스티커는 지우지 않고 남겨 둡니다)` : ''}`)) return;
  const status = document.getElementById('ownedXlsxStatus');
  let done = 0, failed = 0;
  for (let i=0; i<targets.length; i+=10){
    await Promise.all(targets.slice(i, i+10).map(async r=>{
      const data = ownedDocWith_(r.id, { qty: r.qty, owned: r.qty > 0 });
      try{
        await setDoc(doc(db, 'stores', activeStoreCode_, 'ownedGames', r.id), { ...data, updatedAt: Date.now() });
        ownedGamesMap_.set(r.id, data);
        done++;
      }catch(e){ console.error(e); failed++; }
    }));
    if (status) status.textContent = `진행 중... ${done + failed} / ${targets.length}`;
  }
  ownedXlsxParsed_ = null;
  renderOwnedXlsxPanel_();
  const need = games.filter(g=>needsSticker_(g.id)).length;
  if (need) ownedFilter_ = 'need';
  renderOwnedList_();
  alert(`반영 완료: 성공 ${done}건${failed?`, 실패 ${failed}건`:''}${need ? `\n\n식별 스티커를 정해야 하는 게임 ${need}개를 모아 보여드립니다.` : ''}`);
}

let xlsxLoadPromise_ = null;
function loadXlsx_(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxLoadPromise_) return xlsxLoadPromise_;
  xlsxLoadPromise_ = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=>resolve(window.XLSX);
    s.onerror = ()=>{ xlsxLoadPromise_ = null; reject(new Error('엑셀 라이브러리를 불러오지 못했습니다 (네트워크 문제일 수 있습니다)')); };
    document.head.appendChild(s);
  });
  return xlsxLoadPromise_;
}

async function addSingleGame_(){

  if (isGameIdTaken_(id)){ alert(`ID "${id}"는 이미 사용 중입니다${trashedGames_.some(x=>String(x.id)===id) ? ' (휴지통에 있는 게임)' : ''}.`); return; }

    name, cases: [], guideDone: false, completedBy: [], note: '', updatedAt: Date.now(),

async function downloadGameXlsxTemplate_(){
  try{
    const X = await loadXlsx_();
    const ws = X.utils.aoa_to_sheet([
      ['게임ID', '게임 이름', '도입 분류', '난이도', '진열 등급'],
      ['G-0013', '13클루', '필수', 'Normal', 'A'],
      ['G-0014', '루미큐브', '필수', 'Easy', 'A+'],
    ]);
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, '게임');
    X.writeFile(wb, '게임DB_업로드_양식.xlsx');
  }catch(e){ alert(e.message); }
}

function normalizeOpt_(val, opts){
  const t = String(val==null?'':val).trim();
  if (!t) return { ok:true, v:'' };
  const hit = opts.find(o=>o.toLowerCase().replace(/[\s_]/g,'') === t.toLowerCase().replace(/[\s_]/g,''));
  return hit ? { ok:true, v:hit } : { ok:false, v:t };
}

async function parseGameXlsx_(file){
  const box = document.getElementById('gdbPreview');
  if (!file || !box) return;
  box.innerHTML = '<p>파일을 읽는 중...</p>';
  try{
    const X = await loadXlsx_();
    const wb = X.read(await file.arrayBuffer(), { type:'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = X.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' });
    const rows = [];
    const seen = new Set();
    aoa.forEach((r, idx)=>{
      if (idx === 0) return; // 제목 행
      const cells = [0,1,2,3,4].map(i=>String(r[i]==null?'':r[i]).trim());
      if (cells.every(c=>!c)) return; // 완전히 빈 줄
      const [id, name, introRaw, diffRaw, gradeRaw] = cells;
      const row = { rowNo: idx+1, id, name, status:'new', msgs:[] };
      const intro = normalizeOpt_(introRaw, INTRO_OPTS_), diff = normalizeOpt_(diffRaw, DIFF_OPTS_), grade = normalizeOpt_(gradeRaw.toUpperCase(), GRADE_OPTS_);
      row.intro = intro.v; row.difficulty = diff.v; row.displayGrade = grade.v;
      if (!id) row.msgs.push('게임 ID가 비어 있습니다');
      else if (!isValidGameId_(id)) row.msgs.push('게임 ID에 공백이나 따옴표, /, #, ?, % 같은 특수문자를 쓸 수 없습니다');
      else if (seen.has(id)) row.msgs.push(`파일 안에서 ID "${id}"가 중복됩니다`);
      else if (trashedGames_.some(g=>String(g.id)===id)) row.msgs.push(`ID "${id}"는 휴지통에 있는 게임입니다 (먼저 복구하거나 영구 삭제해주세요)`);
      if (!name) row.msgs.push('게임 이름이 비어 있습니다');
      if (!intro.ok) row.msgs.push(`도입 분류 "${intro.v}"는 허용값이 아닙니다 (필수/권장/선택)`);
      if (!diff.ok) row.msgs.push(`난이도 "${diff.v}"는 허용값이 아닙니다 (${DIFF_OPTS_.join(', ')})`);
      if (!grade.ok) row.msgs.push(`진열 등급 "${grade.v}"는 허용값이 아닙니다 (S+ ~ F-)`);
      if (id) seen.add(id);
      if (row.msgs.length) row.status = 'error';
      else if (games.some(g=>String(g.id)===id)) row.status = 'update';
      rows.push(row);
    });
    gdbParsed_ = rows;
    renderGdbPreview_();
  }catch(e){
    console.error(e);
    box.innerHTML = `<p style="color:var(--danger);">파일을 읽지 못했습니다. ${escHtml_(e.message||'')}</p>`;
  }
}

function renderGdbPreview_(){
  const box = document.getElementById('gdbPreview');
  if (!box || !gdbParsed_) return;
  const nNew = gdbParsed_.filter(r=>r.status==='new').length;
  const nUpd = gdbParsed_.filter(r=>r.status==='update').length;
  const errs = gdbParsed_.filter(r=>r.status==='error');
  box.innerHTML = `
    <div class="st-bar" style="margin-top:6px;">
      <span class="xl-ok">신규 ${nNew}건</span><span class="xl-warn">기존 ID 갱신 ${nUpd}건</span><span class="xl-err">오류 ${errs.length}건</span>
    </div>
    ${errs.length ? `<div style="background:#fff8f7; border:1px solid #f4cfcd; border-radius:9px; padding:8px 10px; font-size:12px; color:var(--accent); line-height:1.7; margin-bottom:10px; max-height:160px; overflow-y:auto;">${errs.map(r=>`${r.rowNo}행 · ${escHtml_(r.msgs.join(' / '))}`).join('<br>')}</div>` : ''}
    <div style="max-height:240px; overflow:auto; margin-bottom:10px;">
      <table class="xl-table"><thead><tr><th>행</th><th>ID</th><th>이름</th><th>도입</th><th>난이도</th><th>진열</th><th>상태</th></tr></thead>
      <tbody>${gdbParsed_.slice(0,200).map(r=>`<tr><td>${r.rowNo}</td><td>${escHtml_(r.id)}</td><td>${escHtml_(r.name)}</td><td>${escHtml_(r.intro)}</td><td>${escHtml_(r.difficulty)}</td><td>${escHtml_(r.displayGrade)}</td><td class="${r.status==='error'?'xl-err':r.status==='update'?'xl-warn':'xl-ok'}">${r.status==='error'?'오류':r.status==='update'?'갱신':'신규'}</td></tr>`).join('')}</tbody></table>
    </div>
    <button class="btn btn-primary2 btn-sm" ${nNew+nUpd?'':'disabled'} onclick="applyGameXlsx_()">${nNew+nUpd}건 반영 (오류 행은 제외)</button>
    <div id="gdbApplyStatus" style="margin-top:8px; font-size:12.5px; color:var(--ink-soft);"></div>`;
}

async function applyGameXlsx_(){
  const targets = (gdbParsed_||[]).filter(r=>r.status!=='error');
  if (!targets.length) return;
  if (!confirm(`${targets.length}건을 게임 DB에 반영할까요?`)) return;
  const status = document.getElementById('gdbApplyStatus');
  let done = 0, failed = 0;
  for (let i=0; i<targets.length; i+=10){
    const chunk = targets.slice(i, i+10);
    await Promise.all(chunk.map(async r=>{
      try{
        const meta = { name:r.name, intro:r.intro, difficulty:r.difficulty, displayGrade:r.displayGrade, updatedAt:Date.now() };
        if (r.status === 'update'){
          ['intro','difficulty','displayGrade'].forEach(k=>{ if (!meta[k]) delete meta[k]; }); // 빈 칸은 기존 값을 지우지 않음
          await setDoc(doc(db, 'games', r.id), meta, { merge:true });
        }
        else await setDoc(doc(db, 'games', r.id), { ...meta, cases:[], guideDone:false, completedBy:[], note:'' });
        done++;
      }catch(e){ console.error(e); failed++; }
    }));
    if (status) status.textContent = `진행 중... ${done + failed} / ${targets.length}`;
  }
  await loadGames();
  alert(`반영 완료: 성공 ${done}건${failed?`, 실패 ${failed}건`:''}`);
  openGameDbAdmin_();
}
