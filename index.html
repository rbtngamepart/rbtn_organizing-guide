<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레드버튼 오거나이징 가이드</title>
<style>
  :root{
    --bg: #F6F6F3;
    --surface: #FFFFFF;
    --ink: #1B1C1A;
    --ink-soft: #63645F;
    --ink-mid: #46473F;
    --line: #E3E3DE;
    --line-strong: #C7C7BE;
    --accent: #E4141B;
    --accent-soft: #FCE9E8;
    --danger: #B3492B;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', 'Malgun Gothic', sans-serif;
    --mono: 'SFMono-Regular', Menlo, Consolas, 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.5;}

  .login-gate{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
  .login-gate-box{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:36px 32px; max-width:360px; width:100%; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.08);}
  .brand{font-weight:900; font-size:22px; letter-spacing:-0.03em; text-transform:uppercase; color:var(--accent); margin-bottom:16px; display:inline-flex; align-items:baseline; gap:1px;}
  .brand .r-mark{font-size:10px; vertical-align:super; margin-left:1px;}
  p{font-size:13px; color:var(--ink-soft); line-height:1.6; margin:0;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:8px; padding:11px 18px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:var(--sans); width:100%; margin-top:16px; transition:background .15s, border-color .15s, color .15s;}
  .btn-google{background:#fff; color:#3c4043; border:1px solid #dadce0;}
  .btn-google:hover{background:#f8f8f8;}
  .btn-ghost{background:none; color:var(--ink-soft); text-decoration:underline;}
  .field{margin-bottom:12px; text-align:left;}
  .field label{display:block; font-size:12px; font-weight:700; margin-bottom:4px; color:var(--ink-soft);}
  .field input, .field select{width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; font-size:13.5px; font-family:var(--sans); background:var(--bg); color:var(--ink);}
  .field input:focus, .field select:focus{border-color:var(--accent); outline:none; background:var(--surface);}
  .error-box{display:none; color:var(--danger); font-size:12.5px; margin-top:10px; text-align:center;}
  code{background:var(--bg); padding:1px 5px; border-radius:4px; font-size:12px; font-family:var(--mono);}

  /* ---- 앱 화면 (로그인 이후) ---- */
  .topbar{position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); padding:12px 24px; display:flex; align-items:center; gap:10px;}
  .topbar .brand{font-size:19px; margin-bottom:0; flex-shrink:0;}
  .topbar-spacer{flex:1;}
  .topbar-user{display:flex; align-items:center; gap:10px; padding-left:10px; margin-left:4px; border-left:1px solid var(--line); flex-shrink:0;}
  .nav-dropdown{position:relative; display:inline-block;}
  .nav-caret{font-size:9px; opacity:.7; margin-left:1px;}
  .nav-dropdown-menu{position:absolute; top:calc(100% + 8px); right:0; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 28px rgba(0,0,0,.14); padding:6px; min-width:210px; display:none; flex-direction:column; gap:1px; z-index:30;}
  .nav-dropdown-menu.open{display:flex;}
  .nav-dropdown-menu button{all:unset; box-sizing:border-box; width:100%; padding:9px 11px; border-radius:8px; font-size:13px; font-family:var(--sans); font-weight:600; cursor:pointer; color:var(--ink-mid); display:flex; align-items:center; gap:9px;}
  .nav-dropdown-menu button:hover{background:var(--bg); color:var(--ink);}
  .nav-dropdown-menu .nav-menu-label{padding:6px 11px 4px; font-size:10.5px; font-weight:800; letter-spacing:.03em; color:var(--ink-soft); text-transform:uppercase;}
  .nav-dropdown-menu .nav-menu-divider{height:1px; background:var(--line); margin:5px 2px;}
  @media (max-width:960px){
    .topbar{flex-wrap:wrap; row-gap:8px;}
    .topbar-spacer{flex-basis:100%; height:0; flex:0 0 0;}
    .topbar-user{margin-left:auto;}
  }
  .btn-ghost2, .btn-primary2{width:auto; margin:0; padding:9px 14px; border-radius:8px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; font-size:13px; font-family:var(--sans); transition:background .15s, border-color .15s, color .15s, box-shadow .15s;}
  .btn-ghost2{background:var(--surface); border:1.5px solid var(--line-strong); color:var(--ink-mid); box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .btn-ghost2:hover{color:var(--ink); border-color:var(--ink-soft); background:var(--bg);}
  .btn-ghost2:disabled{opacity:.45; cursor:not-allowed;}
  .btn-primary2{background:var(--accent); color:#fff; border:1.5px solid var(--accent);}
  .btn-primary2:hover{background:#B80F15; border-color:#B80F15;}
  .btn-primary2:disabled{opacity:.45; cursor:not-allowed;}
  #roleToggle{display:flex; align-items:center; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:3px;}
  #roleToggle button{border:none; background:transparent; padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-soft); font-family:var(--sans);}
  #roleToggle button.active{background:var(--ink); color:#fff;}
  @keyframes qrScanPulse{ 0%,100%{opacity:1;} 50%{opacity:.72;} }

  .app{max-width:1080px; margin:0 auto; padding:20px 24px 60px;}
  .viewer-head{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .viewer-back{background:var(--surface); border:1.5px solid var(--line-strong); color:var(--ink-mid); border-radius:8px; width:34px; height:34px; flex-shrink:0; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .viewer-back:hover{background:var(--bg); color:var(--ink);}
  .est-badge{flex:0 0 auto; background:#fdeceb; color:var(--accent); font-weight:800; font-size:15px; padding:5px 12px; border-radius:999px; white-space:nowrap;}
  .viewer-title-wrap{flex:1; min-width:120px; display:flex; align-items:center; gap:8px;}
  .viewer-title{margin:0; font-size:16px; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .viewer-title-wrap .scan-chips{flex:0 0 auto;}
  .viewer-title-wrap .sc-sticker{font-size:14px; padding:3px 12px;}
  .sc-sticker.unknown{border-style:dashed; color:var(--ink-soft);}
  .app > h2{font-size:19px; letter-spacing:-0.01em;}

  .game-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px;}
  .game-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; cursor:pointer; transition:border-color .15s, transform .15s;}
  .game-card:hover{border-color:var(--accent); transform:translateY(-2px);}
  .game-card .name{font-weight:800; font-size:16px; letter-spacing:-0.01em; margin:0 0 6px;}
  .game-card .meta{font-size:11.5px; color:var(--ink-mid); font-family:var(--sans); font-weight:600;}
  .game-card.no-guide{opacity:.6;}
  .game-card.no-guide:hover{opacity:.85;}
  .game-card.no-guide .name{color:var(--ink-soft); font-weight:700;}
  .game-card.work-done{background:#EAF6EC; border-color:#B9DFC0;}
  .game-card.work-done:hover{border-color:#7FBE8B;}

  .empty{text-align:center; padding:60px 20px; color:var(--ink-soft); border:1px dashed var(--line); border-radius:12px; font-size:14px;}

  .back{background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; padding:0; margin-bottom:14px; font-family:var(--sans);}
  .back:hover{color:var(--ink);}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .case-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .case-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:8px 10px; border-bottom:2px solid var(--ink);}
  .case-table td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .case-table tr:last-child td{border-bottom:none;}
  .case-table tr.case-end td{border-bottom:2px solid var(--ink);}
  .case-table tr.case-end:last-child td{border-bottom:none;}
  .case-table input, .case-table select{width:100%; border:1px solid transparent; background:transparent; padding:6px 8px; border-radius:6px; font-size:13.5px; font-family:var(--sans); color:var(--ink);}
  .case-table input:focus, .case-table select:focus{border-color:var(--accent); background:var(--bg); outline:none;}

  .case-A{--c:#C1440E;} .case-B{--c:#B08900;} .case-C{--c:#4C7A1F;} .case-D{--c:#1F7A5C;}
  .case-E{--c:#1F7A8C;} .case-F{--c:#2A5CA6;} .case-G{--c:#5B3FA6;} .case-H{--c:#9C2E8C;}
  .case-I{--c:#B32E5C;} .case-J{--c:#8C3A2E;} .case-K{--c:#5C5C1F;} .case-L{--c:#3A5C3A;}
  .case-ZIP{--c:#3A6EA5;}
  .case-ITEM{--c:#D98A1D;}
  .case-badge{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-weight:800; font-size:14px; padding:6px 12px 6px 9px; border-radius:7px; border:2.2px solid var(--c); color:var(--c); background:color-mix(in srgb, var(--c) 10%, white); line-height:1;}
  .case-badge::before{content:''; width:9px; height:9px; border-radius:50%; background:var(--c); flex-shrink:0;}
  /* 플라스틱 케이스 없이 구성품 자체를 가리키는 마커: 원 대신 화살표 모양 (연결선과 정확히 이어지도록
     회전각과 뾰족한 끝 위치는 JS에서 연결선과 같은 방식으로 계산해 매번 맞춰줍니다) */
  .marker.marker-item{
    width:28px; height:22px; background:var(--c, #D98A1D); border-radius:0; box-shadow:none;
    border:none;
    clip-path: polygon(100% 50%, 0% 0%, 0% 100%);
    filter: drop-shadow(0 0 0.75px rgba(0,0,0,.9)) drop-shadow(0 0 0.75px rgba(0,0,0,.9)) drop-shadow(0 1.5px 2px rgba(0,0,0,.35));
    transform-origin:100% 50%;
  }

  .tabs{display:flex; gap:4px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:3px; margin-bottom:14px; width:fit-content;}
  .tabs button{border:none; background:transparent; padding:8px 16px; border-radius:7px; font-size:13px; font-weight:700; cursor:pointer; color:var(--ink-soft); font-family:var(--sans);}
  .tabs button.active{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08);}

  .photo-stage{position:relative; width:100%; aspect-ratio:4/3; background-color:#EDEDE8; background-size:contain; background-position:center; background-repeat:no-repeat; border-radius:10px; overflow:hidden; border:1px solid var(--line); transition:outline .1s;}
  .photo-stage.dragover{outline:3px dashed var(--accent); outline-offset:-3px;}
  .nav-zone{position:absolute; top:0; bottom:0; width:40%; z-index:2; cursor:pointer; display:flex; align-items:center; font-size:30px; font-weight:700; color:#fff; text-shadow:0 1px 5px rgba(0,0,0,.6); opacity:0; transition:opacity .15s, background .15s;}
  .nav-zone:hover{opacity:1;}
  .nav-zone-left{left:0; justify-content:flex-start; padding-left:12px; background:linear-gradient(to right, rgba(0,0,0,.16), transparent);}
  .nav-zone-right{right:0; justify-content:flex-end; padding-right:12px; background:linear-gradient(to left, rgba(0,0,0,.16), transparent);}
  .photo-nav{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .toolbar-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px;}
  .toolbar-group{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .toolbar-divider{width:1px; align-self:stretch; min-height:24px; background:var(--line);}
  @media (max-width:640px){ .toolbar-divider{display:none; width:100%; height:1px; min-height:0;} }
  .marker-size-control{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-soft);}
  .marker-size-control label{min-width:60px;}
  .marker-size-control input[type=range]{width:110px;}
  .marker{position:absolute; width:var(--marker-size,24px); height:var(--marker-size,24px); border-radius:50%; background:var(--c,var(--accent)); border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); transform:translate(-50%,-50%); cursor:grab; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--mono); font-weight:700; font-size:calc(var(--marker-size,24px) * 0.46); z-index:5;}
  .line-layer{position:absolute; inset:0; pointer-events:none; z-index:1; overflow:visible;}
  .conn-line{position:absolute; height:0; border-top-style:solid; border-top-color:rgba(80,80,75,.85); border-top-width:var(--conn-line-width, 2.2px); transform-origin:0 0; pointer-events:none;}
  .marker:active{cursor:grabbing;}
  .anno-box{position:absolute; z-index:4; background:rgba(255,255,255,.98); border:1px solid var(--line); border-left:0.35em solid var(--c, var(--line)); border-radius:0.7em; padding:0.7em 0.87em; min-width:13em; max-width:19.1em; box-shadow:0 3px 12px rgba(0,0,0,.2); font-size:calc(11.5px * var(--anno-scale, 1)); cursor:grab;}
  .anno-box.readonly{cursor:default;}
  .anno-box.collapsed{cursor:pointer;}
  .anno-box.selected{box-shadow:0 0 0 2px var(--accent), 0 3px 12px rgba(0,0,0,.25);}
  .anno-box:active{cursor:grabbing;}
  .anno-head{display:flex; align-items:center; gap:0.5em; margin-bottom:0.5em; flex-wrap:wrap;}
  .anno-head select{font-family:var(--mono); font-weight:800; font-size:1.04em; padding:0.17em 0.35em; border:1px solid var(--line); border-radius:0.4em; background:var(--bg);}
  .anno-del{margin-left:auto; background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:1.13em; padding:0 0.17em;}
  .anno-del:hover{color:var(--danger);}
  .anno-item{display:flex; gap:0.35em; margin-bottom:0.26em; align-items:center;}
  .anno-item input[type=text]{flex:1; min-width:0; padding:0.26em 0.43em; font-size:0.96em; border:1px solid var(--line); border-radius:0.35em; font-family:var(--sans);}
  .anno-item input[type=number]{width:3.65em; padding:0.26em 0.35em; font-size:0.96em; border:1px solid var(--line); border-radius:0.35em; font-family:var(--sans);}
  .anno-item button{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:0.96em; padding:0 0.17em;}
  .anno-additem{font-size:0.91em; color:var(--accent); background:none; border:none; cursor:pointer; padding:0.17em 0; font-weight:700; font-family:var(--sans);}
  .anno-label-btn{background:#000; color:#fff; border:none; border-radius:0.35em; font-size:0.87em; padding:0.26em 0.7em; cursor:pointer; font-weight:700; margin-top:0.35em;}
  .anno-label-btn:hover{background:#2a2a2a;}
  .checkerboard-bg{background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%); background-size:12px 12px; background-position:0 0,0 6px,6px -6px,-6px 0px; background-color:#fff;}
  .case-photo-wrap{position:relative; display:inline-block; width:4.5em; height:4.5em; border-radius:0.5em; overflow:hidden; border:1px solid var(--line); margin-bottom:0.4em;}
  .case-photo-wrap.mini{width:3.4em; height:3.4em; border-radius:0.4em; margin-bottom:0; flex-shrink:0;}
  .case-photo-thumb{width:100%; height:100%; object-fit:contain; display:block; cursor:zoom-in;}
  .case-photo-remove{position:absolute; top:1px; right:1px; width:16px; height:16px; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; border:none; font-size:10px; line-height:16px; cursor:pointer; padding:0; z-index:2;}
  .anno-item-row{margin-bottom:0.35em;}
  .anno-item-photo-row{display:flex; align-items:center; margin:0.17em 0 0.26em;}
  .anno-item-photo-btn{font-size:0.83em; color:var(--ink-soft); background:none; border:1px dashed var(--line); border-radius:0.35em; padding:0.17em 0.52em; cursor:pointer; font-family:var(--sans);}
  .anno-item-photo-btn:hover{color:var(--ink); border-color:var(--ink-soft);}
  .rg-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .rg-row input[type=text], .rg-row textarea{padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; font-family:var(--sans);}
  .rg-row textarea{resize:vertical; min-height:2.4em;}
  .rg-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:720px){ .rg-grid{grid-template-columns:1fr;} }
  .rg-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 13px;}
  .rg-card h3{margin:0 0 7px; font-size:13px; display:flex; align-items:center; gap:7px;}
  .rg-view-row{display:flex; align-items:center; gap:9px; padding:5px 0; border-bottom:1px solid var(--line);}
  .rg-view-row:last-child{border-bottom:none;}
  .rg-notice{margin-top:12px; padding:10px 13px; background:var(--bg); border-radius:10px; font-size:12px; color:var(--ink-soft); border:1px solid var(--line);}
  .rg-notice ul{margin:5px 0 0; padding-left:18px;}
  .rg-photo-grid{display:grid; gap:8px; margin-bottom:12px;}
  .rg-photo-grid.rg-photo-large{grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); max-width:460px;}
  .rg-photo-grid.rg-photo-compact{grid-template-columns:repeat(auto-fill, minmax(110px,1fr));}
  .rg-photo-cell{position:relative; aspect-ratio:4/3; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:#EDEDE8; display:flex; align-items:center; justify-content:center; cursor:zoom-in;}
  .rg-photo-cell img{width:100%; height:100%; object-fit:contain; display:block;}
  .rg-photo-cell .rg-photo-loading{font-size:11px; color:var(--ink-soft);}
  .rg-photo-hotspot{position:absolute; cursor:pointer; border-radius:6px; transition:background .1s;}
  .rg-photo-hotspot:hover{background:rgba(59,130,246,.18); outline:2px solid rgba(59,130,246,.55); outline-offset:-2px;}
  .rg-tag{font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer; font-family:var(--sans);}
  .rg-tag.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .rg-item-clickable{cursor:pointer;}
  .rg-item-clickable:hover .rg-item-name{text-decoration:underline;}
  .rg-standard-badge{display:inline-flex; align-items:center; gap:3px; font-size:10.5px; color:var(--accent); font-weight:700; margin-left:4px;}

  /* ---- 사진 자르기/회전 모달 ---- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(20,20,18,.45); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:var(--surface); border-radius:14px; padding:22px; max-width:520px; width:100%; max-height:90vh; overflow-y:auto;}
  .modal h3{margin:0 0 14px; font-size:16px;}
  .crop-toolbar{display:flex; gap:8px; margin-bottom:10px;}
  .crop-toolbar button{border:1.5px solid var(--line-strong); background:var(--surface); border-radius:7px; padding:6px 12px; font-size:12.5px; cursor:pointer; font-family:var(--sans); color:var(--ink-mid); box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .crop-toolbar button:hover{border-color:var(--ink-soft); color:var(--ink);}
  .crop-canvas-wrap{position:relative; width:100%; background:#111; border-radius:10px; overflow:hidden; border:1px solid var(--line);}
  .crop-canvas-wrap canvas{position:absolute; inset:0; width:100%; height:100%;}
  .crop-box{position:absolute; border:2px solid #fff; box-shadow:0 0 0 2000px rgba(0,0,0,.55); cursor:move;}
  .crop-handle{position:absolute; width:14px; height:14px; background:#fff; border:2px solid var(--ink); border-radius:3px;}
  .crop-handle.corner-nw{left:-7px; top:-7px; cursor:nwse-resize;}
  .crop-handle.corner-ne{right:-7px; top:-7px; cursor:nesw-resize;}
  .crop-handle.corner-sw{left:-7px; bottom:-7px; cursor:nesw-resize;}
  .crop-handle.corner-se{right:-7px; bottom:-7px; cursor:nwse-resize;}
  .crop-handle.edge-n{left:50%; top:-7px; transform:translateX(-50%); cursor:ns-resize;}
  .crop-handle.edge-s{left:50%; bottom:-7px; transform:translateX(-50%); cursor:ns-resize;}
  .crop-handle.edge-w{left:-7px; top:50%; transform:translateY(-50%); cursor:ew-resize;}
  .crop-handle.edge-e{right:-7px; top:50%; transform:translateY(-50%); cursor:ew-resize;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap;}
  .modal-actions button{border:none; border-radius:7px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; font-family:var(--sans);}
  .modal-actions .btn-cancel{background:var(--surface); color:var(--ink-mid); border:1.5px solid var(--line-strong);}
  .modal-actions .btn-cancel:hover{color:var(--ink); border-color:var(--ink-soft); background:var(--bg);}
  .modal-actions .btn-apply{background:var(--accent); color:#fff; border:1.5px solid var(--accent);}
  .modal-actions .btn-apply:hover{background:#B80F15; border-color:#B80F15;}
  .presence-banner{background:#FFF6DE; border:1px solid #F0DFA8; color:#7a5b12; font-size:12.5px; font-weight:600; padding:9px 14px; border-radius:8px; margin-bottom:14px;}

  .pg-body{display:grid; grid-template-columns:1fr 1.3fr; gap:20px; align-items:start;}
  @media (max-width:800px){ .pg-body{grid-template-columns:1fr;} }
  .pg-panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .pg-panel h3{font-size:14px; margin:0 0 12px;}
  .pg-game-list{max-height:480px; overflow-y:auto; display:flex; flex-direction:column; gap:2px;}
  .pg-game-row{display:flex; align-items:center; gap:8px; padding:8px 6px; border-radius:6px; font-size:13px; cursor:pointer;}
  .pg-game-row:hover{background:var(--bg);}
  .pg-game-name{flex:1;}
  .pg-game-id{font-family:var(--sans); font-weight:600; font-size:11px; color:var(--ink-mid);}
  .pg-top50-badge{font-size:10px; font-weight:800; color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, white); border-radius:4px; padding:2px 6px; flex-shrink:0;}
  .pg-search{width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; font-family:var(--sans); margin-bottom:10px;}
  .pg-search:focus{outline:none; border-color:var(--accent);}
  .pg-table{width:100%; border-collapse:collapse; font-size:13px;}
  .pg-table th{text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:0 8px 8px; border-bottom:1px solid var(--line);}
  .pg-table td{padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .pg-size{font-family:var(--sans); font-weight:600; font-size:12px; color:var(--ink-mid);}
  .pg-qty{font-weight:700;}
  .pg-option{font-size:12px; color:var(--ink-soft);}
  .pg-note{font-size:11.5px; color:var(--ink-soft); margin-top:14px; line-height:1.5;}
  .pg-head{margin-bottom:16px;}
  .pg-head h2{font-size:19px; margin:0 0 6px;}
  .pg-desc{font-size:12.5px; color:var(--ink-soft); max-width:640px; line-height:1.5; margin:0 0 12px;}
  .pg-actions{display:flex; gap:8px;}

  /* ---- 도움말 모달 ---- */
  .help-modal{max-width:560px; max-height:85vh; overflow-y:auto;}
  .help-list{margin:0; padding-left:18px; font-size:13.5px; line-height:1.6;}
  .help-list li{margin-bottom:10px;}
  .help-list ul{margin-top:6px; padding-left:16px;}
  .help-list ul li{margin-bottom:6px; font-size:13px; color:var(--ink-soft);}

  /* ---- 진행 현황(대시보드) ---- */
  .dash-progress-card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px;}
  .dash-progress-bar-track{position:relative; width:100%; height:28px; background:var(--bg); border-radius:999px; overflow:hidden; border:1px solid var(--line);}
  .dash-progress-bar-fill{position:absolute; top:0; left:0; bottom:0; background:var(--accent); border-radius:999px; transition:width .3s;}
  .dash-progress-bar-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--ink); font-family:var(--sans); text-shadow:0 0 4px #fff, 0 0 8px #fff, 0 0 2px #fff;}
  .dash-count{font-family:var(--sans); font-size:12px; font-weight:700; color:var(--accent);}

  /* ---- 권한 관리 ---- */
  .access-section{margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .access-section:last-of-type{border-bottom:none; margin-bottom:8px;}
  .access-section-title{font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px;}
  .access-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; font-size:13px; flex-wrap:wrap; border-bottom:1px solid var(--line);}
  .access-row:last-child{border-bottom:none;}
  .access-row-pending{flex-direction:column; align-items:stretch; padding:10px 0; border-bottom:1px dashed var(--line);}
  .access-row-pending:last-child{border-bottom:none;}
  .access-person{display:flex; align-items:center; gap:6px; flex:1; min-width:0;}
  .access-empty{font-size:12.5px; color:var(--ink-soft); padding:6px 0;}
  .access-store{padding:4px 6px; border:1px solid var(--line); border-radius:6px; font-size:12px; font-family:var(--sans); max-width:150px;}
  .access-email-only{font-family:var(--sans); font-weight:600; font-size:12.5px; word-break:break-all; color:var(--ink-mid);}
  .access-email-sub{font-family:var(--sans); font-size:11.5px; color:var(--ink-mid); margin-top:1px;}
  .access-actions{display:flex; gap:6px; flex-shrink:0; flex-wrap:wrap; align-items:center;}

  /* ---- 이전 버전(이력) ---- */
  .history-list{max-height:340px; overflow-y:auto; margin-top:6px;}
  .history-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .history-row:last-child{border-bottom:none;}
  .history-time{font-family:var(--sans); font-size:12.5px; font-weight:700; color:var(--ink);}
  .history-meta{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .history-actions{display:flex; gap:6px; flex-shrink:0;}

  .label-wrap{position:absolute; z-index:6;}
  .label-rotate-group{position:relative; display:inline-block; transform-origin:center center;}
  .photo-label{background:#000; color:#fff; font-family:var(--sans); font-weight:600; white-space:pre-wrap; padding:0.5em 0.7em; border-radius:0.25em; line-height:1.35; box-shadow:0 2px 8px rgba(0,0,0,.35); outline:none; min-width:1.4em; text-align:center; transform-origin:center center; display:flex; align-items:center; justify-content:center; box-sizing:border-box; cursor:text;}
  .label-wrap.collapsed .photo-label{cursor:pointer;}
  .label-wrap.selected .photo-label{box-shadow:0 0 0 2px var(--accent), 0 2px 8px rgba(0,0,0,.35);}
  .photo-label:focus{box-shadow:0 0 0 2px var(--accent);}
  .label-resize{position:absolute; width:13px; height:13px; background:#fff; border:2px solid #000; border-radius:2px; cursor:nwse-resize; z-index:10;}
  .label-toolbar{position:absolute; display:flex; align-items:center; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:2px; box-shadow:0 2px 6px rgba(0,0,0,.15); white-space:nowrap; z-index:10;}
  .label-toolbar button{border:none; background:none; color:var(--ink); font-size:11px; padding:3px 6px; cursor:pointer; border-radius:4px; font-family:var(--sans);}
  .label-toolbar button:hover{background:var(--bg);}
  .label-drag{cursor:grab; padding:3px 5px; color:var(--ink-soft); font-size:11px; user-select:none;}
  .label-drag:active{cursor:grabbing;}
  .align-guide{position:absolute; background:#ff4444; pointer-events:none; z-index:9;}
  .upload-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}

  /* ---------- 모바일 반응형 ---------- */
  @media (max-width: 640px){
    .topbar{flex-wrap:wrap; padding:10px 14px; gap:10px;}
    .topbar .brand{font-size:15px;}
    .app{padding:16px 14px 60px;}
    .game-list{grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px;}
    .game-card{padding:12px;}
    .game-card .name{font-size:14px;}
    .tabs{width:100%;}
    .tabs button{flex:1; padding:8px 10px; font-size:12.5px;}
    .modal{max-width:none; width:100%;}
  }

  /* ---- 하단 내비게이션 ---- */
  .app{padding-bottom:96px;}
  .bottom-nav{position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(5,1fr); padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px)); box-shadow:0 -2px 12px rgba(0,0,0,.05);}
  .bn-item, .bn-scan{all:unset; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 2px; border-radius:10px; cursor:pointer; min-height:52px; font-family:var(--sans);}
  .bn-item:hover, .bn-scan:hover{background:var(--bg);}
  .bn-ic{font-size:20px; line-height:1; position:relative;}
  .bn-lb, .bn-scan-lb{font-size:11px; font-weight:700; color:var(--ink-soft);}
  .bn-item.active .bn-lb{color:var(--accent);}
  .bn-badge{position:absolute; top:-9px; right:-16px; background:var(--accent); color:#fff; font-size:11.5px; font-weight:800; min-width:21px; height:21px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 5px; font-family:var(--sans); box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--accent); line-height:1;}
  .bn-pill{width:40px; height:23px; border-radius:999px; background:#d6d6d0; position:relative; transition:background .15s;}
  .bn-knob{position:absolute; top:2.5px; left:2.5px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .15s;}
  .bn-scan.qr-scan-active .bn-pill{background:#1F7A5C;}
  .bn-scan.qr-scan-active .bn-knob{left:19.5px;}
  .bn-scan.qr-scan-active .bn-scan-lb{color:#1F7A5C;}
  /* ---- 반납대 가이드 뷰어 모드: 헤더·탭·뒤로가기 등 불필요한 요소 제거 ---- */
  body.rv-mode .topbar{display:none;}
  body.rv-mode .viewer-back, body.rv-mode .viewer-head .tabs{display:none;}
  body.rv-mode .app{padding-top:10px; padding-bottom:84px;}
  body.rv-mode .viewer-head{margin-bottom:8px;}
  .bn-scan.rv-on .bn-ic{filter:none;}
  .bn-scan.rv-on .bn-scan-lb{color:#1F7A5C;}
  .bn-scan.rv-on{background:#e8f4ee;}
  .rv-standby{max-width:420px; margin:12vh auto 0; text-align:center; color:var(--ink-mid);}
  .rv-standby .big{font-size:56px; margin-bottom:12px;}
  .rv-standby h2{font-size:22px; margin:0 0 8px; color:var(--ink);}
  .rv-standby p{font-size:14px; margin:0;}
  .more-menu{position:fixed; right:10px; bottom:calc(72px + env(safe-area-inset-bottom,0px)); z-index:45; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 28px rgba(0,0,0,.16); padding:6px; min-width:240px; display:none; flex-direction:column;}
  .more-menu.open{display:flex;}
  .more-menu button{all:unset; box-sizing:border-box; padding:12px 12px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-mid); font-family:var(--sans);}
  .more-menu button:hover{background:var(--bg);}
  .more-adm{font-size:10px; font-weight:700; background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:999px; margin-left:4px;}

  /* ---- 스캔 색상 칩 / 매장 영역 / 공통 페이지 요소 ---- */
  .scan-chips{display:flex; align-items:center; gap:8px; flex-wrap:nowrap; overflow-x:auto; max-width:100%;}
  .sc-sticker{display:inline-flex; align-items:center; gap:2px; border:1.5px solid var(--ink); border-radius:999px; padding:2px 10px; font-size:12.5px; font-weight:800; color:var(--ink); background:var(--surface); white-space:nowrap;}
  .scan-chips .sc-lb{font-size:11px; font-weight:700; color:var(--ink-soft); white-space:nowrap;}
  .sc-chip{width:44px; height:44px; flex:0 0 44px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1.5px var(--line-strong); cursor:pointer; display:flex; align-items:center; justify-content:center; color:#fff; font-size:19px; font-weight:800; padding:0; font-family:var(--sans);}
  .sc-chip.sel{box-shadow:0 0 0 3px var(--ink);}
  .sc-chip.light{color:#333;}
  .st-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .st-bar:empty{display:none;}
  .st-bar select, .st-bar input[type=date]{padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; font-family:var(--sans); background:var(--surface);}
  .chip-btn{border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:999px; cursor:pointer; font-family:var(--sans);}
  .chip-btn.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .owned-units{margin-top:8px; display:flex; flex-direction:column; gap:5px;}
  .owned-unit{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .owned-unit .chip-btn{padding:5px 10px; font-size:12px;}
  .mc-tag.rep{background:var(--bg); color:var(--ink-mid); border:1px solid var(--line-strong);}
  .mc-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .mc-wd{font-size:11px; font-weight:700; color:var(--ink-soft); text-align:center; padding:2px 0;}
  .mc-day{all:unset; box-sizing:border-box; min-height:58px; border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:4px 5px; cursor:pointer; display:flex; flex-direction:column; gap:2px; font-family:var(--sans);}
  .mc-day.out{visibility:hidden;}
  .mc-day.today .mc-n{background:var(--ink); color:var(--surface); border-radius:999px; padding:0 5px;}
  .mc-day.sel{border-color:var(--accent); box-shadow:0 0 0 1.5px var(--accent);}
  .mc-n{font-size:11.5px; font-weight:700; color:var(--ink-soft); align-self:flex-start;}
  .mc-tag{font-size:10.5px; font-weight:800; border-radius:5px; padding:1px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mc-tag.ok{background:var(--done-bg); color:var(--ink); border:1px solid var(--done-line);}
  .mc-tag.warn{background:var(--accent-soft); color:var(--accent);}
  @media (max-width:520px){ .mc-day{min-height:50px; padding:3px;} .mc-tag{font-size:9.5px; padding:0 3px;} }
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:14px;}
  .stat-box{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 13px;}
  .stat-box .n{font-size:20px; font-weight:800; color:var(--accent);}
  .stat-box .l{font-size:11.5px; color:var(--ink-soft);}
  .row-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 13px; margin-bottom:8px;}
  .row-card.clickable{cursor:pointer;}
  .row-top{display:flex; align-items:center; gap:10px;}
  .row-name{font-size:14px; font-weight:700;}
  .row-sub{font-size:11.5px; color:var(--ink-soft);}
  .mini-bar{height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:5px;}
  .mini-bar > i{display:block; height:100%; background:var(--accent);}
  .day-title{font-size:12.5px; font-weight:800; color:var(--ink-soft); margin:14px 2px 7px;}
  .cdot{display:inline-block; width:14px; height:14px; border-radius:50%; border:1.5px solid rgba(0,0,0,.18); vertical-align:middle;}
  .trend{display:flex; align-items:flex-end; gap:3px; height:110px; margin-top:10px; padding-top:6px;}
  .trend .tb{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:3px;}
  .trend .tb i{display:block; width:100%; background:#f2c9c7; border-radius:3px 3px 0 0; min-height:2px;}
  .trend .tb i.hi{background:var(--accent);}
  .trend .tb span{font-size:9.5px; color:var(--ink-soft); height:12px; white-space:nowrap;}
  .btn-sm{width:auto; margin:0; padding:7px 12px; font-size:12.5px;}
  .xl-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .xl-table th, .xl-table td{border:1px solid var(--line); padding:6px 8px; text-align:left;}
  .xl-table th{background:var(--bg);}
  .xl-ok{color:#1F7A5C; font-weight:700;} .xl-err{color:var(--accent); font-weight:700;} .xl-warn{color:#b45309; font-weight:700;}

  /* ---- 반납대 가이드: 좌(구성품)/우(정리된 사진) 독립 스크롤 ---- */
  .rg-split{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:12px; align-items:stretch;}
  .rg-split.no-photos{grid-template-columns:minmax(0,1fr);}
  .rg-pane{background:var(--surface); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; min-height:0; overflow:hidden;}
  .rg-pane-head{padding:10px 13px; border-bottom:1px solid var(--line); font-size:13.5px; font-weight:800; display:flex; align-items:center; gap:7px; flex:0 0 auto;}
  .rg-pane-body{padding:11px 13px 14px; overflow-y:auto; flex:1; min-height:0; -webkit-overflow-scrolling:touch;}
  .rg-items{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-flow:dense; gap:8px;}
  .rg-item-card{display:flex; gap:9px; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:7px 9px; min-width:0;}
  .rg-item-card.wide{grid-column:span 2;}
  .rg-item-card .case-photo-wrap.mini{width:64px; height:64px; flex:0 0 64px; margin-bottom:0; border-radius:8px;}
  .rg-item-photo-empty{width:64px; height:64px; flex:0 0 64px; border-radius:8px; background:#EDEDE8; border:1px dashed var(--line-strong);}
  .rg-item-main{min-width:0; flex:1;}
  .rg-item-qty{font-weight:800; color:var(--accent); font-family:var(--mono); font-size:15px; white-space:nowrap;}
  .rg-photo-stack{display:flex; flex-direction:column; gap:12px;}
  .rg-photo-full{position:relative; border-radius:8px; overflow:hidden; border:1px solid var(--line); background:#EDEDE8; min-height:60px; display:flex; align-items:center; justify-content:center; cursor:zoom-in;}
  .rg-photo-full img{width:100%; height:auto; display:block;}
  .rg-stack{display:flex; flex-direction:column; gap:10px;}
  .rg-pane .rg-card h3{font-size:14px;}
  .rg-pane .rg-view-row{font-size:16px;}
  .rg-pane .case-photo-wrap{background:#fff;}
  /* ①②③ 모두 같은 글자 크기: 이름/제목 16px 굵게, 설명·비고 14px */
  .rg-pane .rg-item-main, .rg-pane .rg-view-row{font-size:16px; line-height:1.4;}
  .rg-pane .rg-item-main > div:first-child, .rg-pane .rg-view-row > div > div:first-child, .rg-pane .rg-item-name{font-size:16px; font-weight:700; color:var(--ink);}
  .rg-pane .rg-item-main > div:not(:first-child), .rg-pane .rg-view-row > div > div:not(:first-child){font-size:14px; font-weight:400; color:var(--ink-soft);}
  @media (max-width:480px){
    .rg-item-card .case-photo-wrap.mini, .rg-item-photo-empty{width:52px; height:52px; flex-basis:52px;}
  }
  @media (max-width:720px){
    .rg-split{grid-template-columns:1fr; height:auto !important;}
    .rg-pane{overflow:visible;}
    .rg-pane-body{overflow:visible;}
  }

  /* ---- 정기 점검 인쇄 ---- */
  #printArea{display:none;}
  @media print{
    @page{size:A4; margin:12mm;}
    body.printing-maint #appRoot, body.printing-maint #loginGate{display:none !important;}
    body.printing-maint{background:#fff;}
    body.printing-maint #printArea{display:block;}
    .print-title{font-size:18px; font-weight:800; margin:0 0 4px;}
    .print-sub{font-size:11px; color:#555; margin:0 0 10px;}
    .print-table{width:100%; border-collapse:collapse; font-size:12px;}
    .print-table th, .print-table td{border:1px solid #444; padding:7px 8px; text-align:left; vertical-align:top;}
    .print-table th{background:#eee;}
    .print-table tr{page-break-inside:avoid;}
    .pt-memo{height:42px;}
  }

  /* ============================================================
     추가 상태 색상 토큰 (다크 모드에서 함께 바뀜)
     ============================================================ */
  :root{
    --done-bg:#EAF6EC; --done-line:#B9DFC0; --done-line-strong:#7FBE8B;
    --warn-bg:#FFF6DE; --warn-line:#F0DFA8; --warn-ink:#7a5b12;
    --stage-bg:#EDEDE8;
  }
  .game-card.work-done{background:var(--done-bg); border-color:var(--done-line);}
  .game-card.work-done:hover{border-color:var(--done-line-strong);}

      --line:#33342F; --line-strong:#4A4B45; --accent:#F0383E; --accent-soft:#3A1E1E; --danger:#E0795A;

const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosung(str){
  let out='';
  for (const ch of str){
    const code = ch.charCodeAt(0) - 0xAC00;
    out += (code>=0 && code<=11171) ? CHO[Math.floor(code/588)] : ch;
  }
  return out;
}
/** 검색어가 순수하게 초성(자음)만으로 이루어져 있는지 확인합니다. 완성된 글자(모음 포함)가
 *  하나라도 섞여 있으면 초성 검색이 아니라 일반 텍스트 검색으로 취급합니다. */
function isChosungOnly(str){
  return str.length > 0 && [...str].every(ch => CHO.includes(ch));
}
/** 게임 ID에는 따옴표·슬래시 등 화면 버튼이나 저장 경로를 깨뜨리는 문자를 쓸 수 없게 합니다. */
function isValidGameId_(id){ return /^[^\s'"`\\/<>&#?%]+$/.test(id); }

/** 이 기기(브라우저)에만 저장하는 개인 설정 (즐겨찾기, 최근 본 게임, 테마 등).
 *  시크릿 창처럼 저장소를 못 쓰는 환경에서도 앱이 멈추지 않도록 실패는 조용히 무시합니다. */
function lsGet_(key, fallback){
  try{ const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }catch(e){ return fallback; }
}
function lsSet_(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

// ---- 화면 테마 (자동 → 밝게 → 어둡게) ----
function applyTheme_(){
  let t = 'auto';
  try{ t = localStorage.getItem('rbtn_theme') || 'auto'; }catch(e){}
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  const btn = document.getElementById('themeToggleBtn');
  if (btn){
    btn.textContent = t === 'dark' ? '🌙' : t === 'light' ? '☀️' : '🌓';
    btn.title = `화면 테마: ${t === 'dark' ? '어둡게' : t === 'light' ? '밝게' : '자동(기기 설정)'} — 눌러서 바꾸기`;
  }
}
function cycleTheme_(){
  let t = 'auto';
  try{ t = localStorage.getItem('rbtn_theme') || 'auto'; }catch(e){}
  const next = t === 'auto' ? 'light' : t === 'light' ? 'dark' : 'auto';
  try{ localStorage.setItem('rbtn_theme', next); }catch(e){}
  applyTheme_();
}
applyTheme_();

async function enterApp(email, role){
  currentRole = role;

  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('roleLabel').textContent = email;
  document.getElementById('newGameBtn').style.display = role === 'editor' ? 'inline-flex' : 'none';
  if (myApprovedRole === 'editor'){
    document.getElementById('roleToggle').style.display = 'flex';
  }
  updateRoleToggleUI_();
  try{
    await Promise.all([loadGames(), loadConditionStandards_(), loadReturnGuideCommonNotice_(), loadStoreContext_()]);
  }catch(e){
    console.error('게임 목록을 불러오지 못했습니다', e);
    renderGuideAccessError_('가이드를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.');
    return;
  }

  // QR코드를 스캔해서 들어온 경우(주소에 ?game=아이디 가 붙어 있는 경우), 목록을 거치지 않고
  // 바로 그 게임의 화면(기본은 반납대 가이드)으로 이동합니다.
  const qParams = new URLSearchParams(location.search);
  const qGame = qParams.get('game');
  if (qGame){
    openGameFromQr_(qGame, qParams.get('mode'));
  } else {
    renderHome_();
  }
}

/** QR을 스캔해서(또는 QR이 담긴 링크로 직접) 들어왔을 때, 그 게임 가이드로 바로 이동합니다.
 *  없는 게임이거나 비공개 가이드면 목록으로 가는 대신 안내 화면을 보여줍니다. */
function openGameFromQr_(gameId, mode){
  const target = games.find(x=>String(x.id)===String(gameId));
  if (!target){
    renderGuideAccessError_('등록된 게임 가이드를 찾을 수 없습니다.');
    return;
  }
  const wantsReturnGuide = isStoreAccount_() || (mode !== 'photo' && mode !== 'table');
  const isPublished = !!(target.returnGuide && target.returnGuide.published === true);
  if (wantsReturnGuide && !isPublished){
    renderGuideAccessError_('현재 사용할 수 없는 가이드입니다.');
    return;
  }
  logQrScan_(target);
  openGame(target.id, wantsReturnGuide ? 'return' : mode);
}

/** QR 접근 관련 오류(등록되지 않은 QR, 비공개 가이드, 네트워크 오류 등)를 안내하는 화면입니다. */

      ${rvMode_
        ? `<p style="font-size:13px; color:var(--ink-soft);">다른 게임의 QR코드를 스캔해주세요.</p>`
        : `<button class="btn btn-primary2" style="width:auto; padding:9px 22px;" onclick="renderList()">← 게임 목록으로</button>`}
    </div>
  `;
}

  document.querySelectorAll('.nav-dropdown-menu').forEach(m=>{
    if (m.id !== id) m.classList.remove('open');
  });
  const menu = document.getElementById(id);
  if (menu) menu.classList.toggle('open');

/** 뷰어 ↔ 편집자 전환 버튼. 편집자로 전환하면서 지금 보고 있는 게임의 편집 잠금도 함께 확인합니다. */
async function setRole(r){
  if (r === 'editor' && myApprovedRole !== 'editor') return; // 애초에 편집 권한이 없는 계정
  if (r === 'viewer' && currentRole === 'editor' && !confirmLeaveDetail_()) return; // 저장 안 한 변경사항 확인
  currentRole = r;
  updateRoleToggleUI_();

  if (currentGameId){
    if (r === 'editor'){
      const gotLock = await ensureEditLockForGame_(currentGameId);
      if (!gotLock){
        currentRole = 'viewer';
        updateRoleToggleUI_();
      } else {
        enterPresence_(currentGameId);
      }
    } else {
      leavePresence_();
    }
    resetChangeTracking_();
    renderDetail();
  }
}

// 게임 목록 / 상세 (핵심 CRUD) - 이번 단계에서는 사진 없이 케이스만
// ============================================================
let trashedGames_ = []; // 휴지통으로 옮긴(삭제 표시된) 게임들 — 목록·구매 가이드 등에서는 빠지고, 편집자가 복구할 수 있습니다

async function loadGames(){
  const snap = await getDocs(collection(db, 'games'));
  games = [];
  trashedGames_ = [];
  snap.forEach(d => {
    const g = { id: d.id, ...d.data() };
    (g.deleted ? trashedGames_ : games).push(g);
  });
  games.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'ko'));
  trashedGames_.sort((a,b)=> (b.deletedAt||0) - (a.deletedAt||0));
}

/** 게임 ID가 이미 쓰이고 있는지 (휴지통에 있는 게임 포함) */
function isGameIdTaken_(id){
  return games.some(x => String(x.id) === id) || trashedGames_.some(x => String(x.id) === id);
}

/** 구성품 상태(A/B/C) 판정 기준 목록을 불러옵니다. 게임과 무관하게 공통으로 관리되는
 *  데이터라, 여기서 하나만 고치면 그 기준을 쓰는 모든 게임의 반납대 가이드에 바로 반영됩니다. */
async function loadConditionStandards_(){
  const snap = await getDocs(collection(db, 'conditionStandards'));
  conditionStandards = [];
  snap.forEach(d => conditionStandards.push({ id: d.id, ...d.data() }));
  conditionStandards.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'ko'));
}

/** 반납대 가이드 맨 아래 "공통 안내" 문구를 불러옵니다. 게임과 무관하게 전체 공통으로
 *  관리되며, 저장된 값이 없으면 기본 문구(RETURN_GUIDE_COMMON_NOTICE)를 그대로 씁니다. */
async function loadReturnGuideCommonNotice_(){
  try{
    const snap = await getDoc(doc(db, 'appSettings', 'returnGuideCommonNotice'));
    if (snap.exists() && typeof snap.data().text === 'string'){
      returnGuideCommonNotice_ = snap.data().text;
    }
  }catch(e){
    console.error('공통 안내 문구를 불러오지 못했습니다', e);
  }
}

/** 편집자가 "공통 안내" 문구를 고치면, 모든 게임의 반납대 가이드에 바로 반영되도록
 *  즉시 저장합니다 (게임 저장 버튼과 별개로, 전역 설정이라 바로 저장됩니다). */
async function updateReturnGuideCommonNotice_(text){
  returnGuideCommonNotice_ = text;
  if (document.getElementById('tabBody')) renderReturnGuideTab();
  try{
    await setDoc(doc(db, 'appSettings', 'returnGuideCommonNotice'), { text });
  }catch(e){
    alert('공통 안내 저장에 실패했습니다: ' + e.message);
  }
}

/** 공통 안내를 줄 단위 목록으로 돌려줍니다 (빈 줄은 건너뜁니다). */
function getReturnGuideCommonNoticeLines_(){
  return String(returnGuideCommonNotice_ || '').split('\n').map(s=>s.trim()).filter(Boolean);
}

async function setAccountStore_(email, col, code){
  try{
    await updateDoc(doc(db, col, email), { storeCode: code || '' });

async function approveRequest(email, role){
  const pendingSnap = await getDoc(doc(db, 'pending', email));
  const profile = pendingSnap.data() || {};
  await setDoc(doc(db, role === 'editor' ? 'editors' : 'viewers', email), { ...profile, approvedAt: Date.now() });
  await deleteDoc(doc(db, 'pending', email));
  renderAccessManagement();
}

async function rejectRequest(email){
  if (!confirm(`${email} 요청을 거절할까요?`)) return;
  await deleteDoc(doc(db, 'pending', email));
  renderAccessManagement();
}

async function addDirectAccess(role){
  const input = document.getElementById('directEmailInput');
  const email = input.value.trim().toLowerCase();
  if (!email || !email.includes('@')){ alert('올바른 이메일을 입력해주세요.'); return; }
  await setDoc(doc(db, role === 'editor' ? 'editors' : 'viewers', email), { addedAt: Date.now() });
  renderAccessManagement();
}

async function removeAccess(email, collectionName){
  if (!confirm(`${email}님의 권한을 제거할까요?`)) return;
  await deleteDoc(doc(db, collectionName, email));
  renderAccessManagement();
}

async function addStore(){
  const code = document.getElementById('storeCodeInput').value.trim();
  const name = document.getElementById('storeNameInput').value.trim();
  if (!code || !name){ alert('매장 코드와 이름을 모두 입력해주세요.'); return; }
  await setDoc(doc(db, 'stores', code), { name });
  renderAccessManagement();
}

async function removeStore(code){
  if (!confirm('이 매장을 삭제할까요?')) return;
  await deleteDoc(doc(db, 'stores', code));
  renderAccessManagement();
}

/**
 * ============================================================
 * 게임별 JSON 파일로 개별 교체 (game_535.json 처럼 ID가 담긴 파일들을
 * 각각 읽어서, 그 게임 하나씩만 Firestore에 덮어씁니다)
 * ============================================================
 */
let gameReplaceParsed_ = []; // [{ fileName, guessedId, gameData, parseError }]

/** 파일명에서 게임 ID로 보이는 숫자를 하나 뽑아냅니다. (예: game_535.json -> "535") */
function guessGameIdFromFileName_(fileName){
  const base = fileName.replace(/\.json$/i, '');
  const m = base.match(/(\d+)/);
  return m ? m[1] : '';
}

/** 파일 하나의 JSON에서 실제 "게임 데이터 객체"를 뽑아냅니다. (여러 포맷을 허용) */
function extractGameObjectFromJson_(data){
  if (!data || typeof data !== 'object') return null;
  if (Array.isArray(data.games) && data.games.length) return data.games[0]; // 마이그레이션 묶음 포맷도 허용
  if (data.name !== undefined || data.cases !== undefined || data.id !== undefined) return data; // 게임 객체 그 자체
  return null;
}

async function previewGameReplaceFiles_(){
  const input = document.getElementById('gameReplaceFileInput');
  const files = Array.from(input.files || []);
  const previewEl = document.getElementById('gameReplacePreview');
  gameReplaceParsed_ = [];
  if (!files.length){ previewEl.innerHTML = ''; return; }

  for (const file of files){
    let entry = { fileName: file.name, guessedId: '', gameData: null, parseError: '' };
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      const gameObj = extractGameObjectFromJson_(data);
      if (!gameObj){
        entry.parseError = '이 파일에서 게임 데이터를 찾지 못했습니다.';
      } else {
        entry.gameData = gameObj;
        entry.guessedId = gameObj.id !== undefined && gameObj.id !== null && String(gameObj.id).trim() !== ''
          ? String(gameObj.id).trim()
          : guessGameIdFromFileName_(file.name);
      }
    }catch(e){
      entry.parseError = 'JSON 파싱 실패: ' + e.message;
    }
    gameReplaceParsed_.push(entry);
  }
  renderGameReplacePreview_();
}

function updateGameReplaceId_(idx, value){
  if (gameReplaceParsed_[idx]) gameReplaceParsed_[idx].guessedId = value.trim();
}

function grLog_(msg){
  const el = document.getElementById('gameReplaceLog');
  if (el) el.textContent += msg + '\n';
  if (el) el.scrollTop = el.scrollHeight;
}

async function startGameReplace_(){
  const includeChecks = Array.from(document.querySelectorAll('.grIncludeCheck'));
  const targets = [];
  for (const chk of includeChecks){
    const idx = Number(chk.dataset.idx);
    const entry = gameReplaceParsed_[idx];
    if (!entry || entry.parseError) continue;
    if (!chk.checked) continue;
    const id = (entry.guessedId || '').trim();
    if (!id){
      grLog_(`❌ "${entry.fileName}" — 게임 ID를 확인할 수 없어 건너뜁니다.`);
      continue;
    }
    targets.push({ id, gameData: entry.gameData, fileName: entry.fileName });
  }

  if (!targets.length){ alert('교체할 게임이 없습니다.'); return; }

  const summary = targets.map(t => `#${t.id} (${t.fileName})`).join(', ');
  if (!confirm(`다음 게임 ${targets.length}개를 교체합니다: ${summary}\n\n현재 내용을 덮어씁니다. 계속할까요?`)) return;

  document.getElementById('gameReplaceLog').textContent = '';
  grLog_(`게임 ${targets.length}개 교체 시작...\n`);

  for (let i=0; i<targets.length; i++){
    const { id, gameData: g, fileName } = targets[i];
    try{
      const photos = [];
      for (const p of (g.photos||[])){
        const newPhoto = { markers: p.markers||[], labels: p.labels||[] };
        if (p.imageUrl && p.imageUrl.startsWith('data:')){
          const blob = dataURLtoBlob_(p.imageUrl);
          const storagePath = `games/${id}/${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
          await uploadBytes(ref(storage, storagePath), blob);
          newPhoto.storagePath = storagePath;
        } else if (p.storagePath){
          newPhoto.storagePath = p.storagePath; // 이미 Storage에 있는 사진은 그대로 참조만 유지
        } else {
          grLog_(`  ⚠ "${fileName}" 사진 하나에 이미지 데이터가 없어 건너뜁니다.`);
          continue;
        }
        photos.push(newPhoto);
      }
      const gameDoc = {
        name: g.name || '',
        cases: g.cases || [],
        photos: photos,
        guideDone: !!g.guideDone,
        completedBy: g.completedBy || [],
        note: g.note || '',
        updatedAt: Date.now()
      };
      await setDoc(doc(db, 'games', String(id)), gameDoc);
      grLog_(`  (${i+1}/${targets.length}) #${id} ${g.name || ''} — 완료`);
    }catch(e){
      grLog_(`  (${i+1}/${targets.length}) #${id} — ❌ 실패: ${e.message}`);
    }
  }

  grLog_('\n목록 새로고침 중...');
  await loadGames();
  grLog_('✅ 교체 완료!');
}

function migLog_(msg){
  const el = document.getElementById('migrationLog');
  if (el) el.textContent += msg + '\n';
  if (el) el.scrollTop = el.scrollHeight;
}

function dataURLtoBlob_(dataUrl){
  const parts = dataUrl.split(',');
  const mimeMatch = parts[0].match(/:(.*?);/);
  const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
  const binary = atob(parts[1]);
  const array = new Uint8Array(binary.length);
  for (let i=0; i<binary.length; i++) array[i] = binary.charCodeAt(i);
  return new Blob([array], { type: mime });
}

async function startMigration_(){
  const input = document.getElementById('migrationFileInput');
  const files = Array.from(input.files || []);
  if (!files.length){ alert('파일을 선택해주세요.'); return; }

  const singleGameMode = document.getElementById('singleGameModeCheck')?.checked;
  const singleGameId = document.getElementById('singleGameIdInput')?.value.trim();
  if (singleGameMode && !singleGameId){ alert('복구할 게임 ID를 입력해주세요.'); return; }

  // 선택된 파일들을 전부 읽어서, "메타(계정/매장)"와 "게임 묶음"들을 하나로 합칩니다.
  let merged = { editors: [], viewers: [], pending: [], stores: [], profiles: {}, games: [] };
  for (const file of files){
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if (data.editors) merged.editors.push(...data.editors);
      if (data.viewers) merged.viewers.push(...data.viewers);
      if (data.pending) merged.pending.push(...data.pending);
      if (data.stores) merged.stores.push(...data.stores);
      if (data.profiles) Object.assign(merged.profiles, data.profiles);
      if (data.games) merged.games.push(...data.games);
    }catch(e){
      migLog_(`❌ 파일을 읽지 못했습니다: ${file.name}`);
      return;
    }
  }

  if (singleGameMode){
    merged.games = merged.games.filter(g => String(g.id) === String(singleGameId));
    merged.editors = []; merged.viewers = []; merged.pending = []; merged.stores = [];
    if (!merged.games.length){
      migLog_(`❌ 선택한 파일들에서 게임 ID "${singleGameId}"를 찾지 못했습니다.`);
      return;
    }
  }

  const data = merged;

  migLog_(singleGameMode
    ? `게임 ID "${singleGameId}" 발견: ${data.games[0].name}`
    : `불러온 파일 ${files.length}개: 게임 ${data.games.length}개, 편집자 ${data.editors.length}명, 뷰어 ${data.viewers.length}명, 매장 ${data.stores.length}개`);
  const confirmMsg = singleGameMode
    ? `"${data.games[0].name}" (ID ${singleGameId})만 다시 가져옵니다. 지금 있는 내용을 덮어씁니다. 계속할까요?`
    : '가져오기를 시작할까요? 시간이 걸릴 수 있습니다.';
  if (!confirm(confirmMsg)) return;

  // ---- 1) 매장 ----
  migLog_('\n[1/4] 매장 정보 등록 중...');
  for (const s of data.stores){
    try{ await setDoc(doc(db, 'stores', s.code), { name: s.name }); }
    catch(e){ migLog_(`  ⚠ 매장 등록 실패: ${s.code} - ${e.message}`); }
  }
  migLog_(`  완료 (${data.stores.length}개)`);

  // ---- 2) 편집자/뷰어/대기 ----
  migLog_('\n[2/4] 편집자·뷰어 계정 등록 중...');
  const profiles = data.profiles;
  for (const email of data.editors){
    try{ await setDoc(doc(db, 'editors', email), { ...(profiles[email]||{}), addedAt: Date.now() }); }
    catch(e){ migLog_(`  ⚠ 편집자 등록 실패: ${email}`); }
  }
  for (const email of data.viewers){
    try{ await setDoc(doc(db, 'viewers', email), { ...(profiles[email]||{}), addedAt: Date.now() }); }
    catch(e){ migLog_(`  ⚠ 뷰어 등록 실패: ${email}`); }
  }
  for (const email of data.pending){
    try{ await setDoc(doc(db, 'pending', email), { ...(profiles[email]||{}), requestedAt: Date.now() }); }
    catch(e){ migLog_(`  ⚠ 대기 등록 실패: ${email}`); }
  }
  migLog_(`  완료 (편집자 ${data.editors.length}명, 뷰어 ${data.viewers.length}명, 대기 ${data.pending.length}명)`);

  // ---- 3) 게임 (사진은 Storage로) ----
  migLog_('\n[3/4] 게임 데이터 가져오는 중...');
  const games_ = data.games;
  for (let i=0; i<games_.length; i++){
    const g = games_[i];
    try{
      const photos = [];
      for (const p of (g.photos||[])){
        const newPhoto = { markers: p.markers||[], labels: p.labels||[] };
        if (p.imageUrl && p.imageUrl.startsWith('data:')){
          const blob = dataURLtoBlob_(p.imageUrl);
          const storagePath = `games/${g.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
          await uploadBytes(ref(storage, storagePath), blob);
          newPhoto.storagePath = storagePath;
        }
        photos.push(newPhoto);
      }
      const gameDoc = {
        name: g.name || '',
        cases: g.cases || [],
        photos: photos,
        guideDone: !!g.guideDone,
        completedBy: g.completedBy || [],
        note: g.note || '',
        updatedAt: Date.now()
      };
      await setDoc(doc(db, 'games', String(g.id)), gameDoc);
      migLog_(`  (${i+1}/${games_.length}) ${g.name} - 완료`);
    }catch(e){
      migLog_(`  (${i+1}/${games_.length}) ${g.name} - ❌ 실패: ${e.message}`);
    }
  }

  // ---- 4) 마무리 ----
  migLog_('\n[4/4] 목록 새로고침 중...');
  await loadGames();
  migLog_('\n✅ 가져오기 완료!');
}

/** 구매가 필요한 케이스 목록을 글자로 복사합니다 (메신저·발주서에 붙여넣기용). */
async function copyPurchaseList_(){
  const counts = {};
  purchaseGuideSelected_.forEach(id=>{
    const g = games.find(x=>String(x.id)===String(id));
    if (g && g.cases) g.cases.forEach(c=>{ counts[c.caseType] = (counts[c.caseType]||0) + 1; });
  });
  const stock = lsGet_('rbtn_pg_stock', {});
  const price = lsGet_('rbtn_pg_price', {});
  let total = 0;
  const lines = PURCHASE_TYPES.filter(t=>counts[t]).map(t=>{
    const buy = Math.max(0, counts[t] - (Number(stock[t])||0));
    if (!buy) return null;
    const p = CASE_PRODUCTS[t] || {};
    const unit = Number(price[t]) || 0;
    total += buy * unit;
    return `${t} (${CASE_SIZES[t]}mm) ${buy}개${p.option && p.option !== '-' ? ` · 옵션 ${p.option}` : ''}${unit ? ` · ${(buy*unit).toLocaleString('ko-KR')}원` : ''}${p.url ? `\n  ${p.url}` : ''}`;
  }).filter(Boolean);
  if (!lines.length){ alert('추가로 구매할 케이스가 없습니다.'); return; }
  const text = `[케이스 구매 목록] 게임 ${purchaseGuideSelected_.size}개 기준\n` + lines.join('\n') + (total ? `\n합계 예상 금액: ${total.toLocaleString('ko-KR')}원` : '');
  try{
    await navigator.clipboard.writeText(text);
    alert('구매 목록을 복사했습니다.');
  }catch(e){
    prompt('아래 내용을 복사해주세요:', text);
  }
}

/**
 * 전체 게임의 "케이스 종류별 수량"을 CSV로 내보냅니다. (엑셀 구매가이드 양식의 게임목록 탭에
 * 그대로 붙여넣을 수 있도록, 게임ID·게임이름·A~L 순서로 열을 맞췄습니다. 지퍼백/구성품은
 * 엑셀 양식에서 다루지 않으므로 포함하지 않습니다.)
 */
function exportGameCaseCountsCsv_(){
  const PLASTIC_CASE_TYPES = CASE_TYPES.filter(t => t !== 'ZIP');
  const top50Ids = new Set(TOP50_CASE_GAMES.map(g=>g.id));
  // 엑셀 양식의 C열(게임ID)부터 붙여넣는 형식과 그대로 맞췄습니다: 게임ID, 게임이름, 특이사항(게임 메모), TOP50(1/0), A~L.
  // "선택"은 엑셀 쪽에서 TOP50 스위치 + 개별설정으로 정하므로 CSV에는 포함하지 않습니다.
  const rows = [['게임ID', '게임이름', '특이사항', 'TOP50', ...PLASTIC_CASE_TYPES]];

  games.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''), 'ko')).forEach(g=>{
    const counts = {};
    (g.cases||[]).forEach(c=>{ if (c.caseType !== 'ZIP' && c.caseType !== NON_CASE_TYPE) counts[c.caseType] = (counts[c.caseType]||0) + 1; });
    const isTop50 = top50Ids.has(String(g.id));
    rows.push([g.id, g.name || '', g.note || '', isTop50 ? 1 : 0, ...PLASTIC_CASE_TYPES.map(t => counts[t] || 0)]);
  });

  const csvEscape = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' }); // BOM 포함: 엑셀에서 한글 깨짐 방지
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `게임별_케이스수량_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

async function uploadStandardPhoto_(standardId, grade, file){
  const cs = conditionStandards.find(x=>x.id===standardId);
  if (!cs) return;
  const oldPath = cs.grades?.[grade]?.photo;
  try{
    // 저장 위치는 기존 games/{id}/... 규칙을 그대로 재사용하도록, 게임과 무관한
    // 공통 데이터도 games/_standards/ 아래에 저장합니다 (Storage 보안 규칙 추가 수정 불필요).
    const storagePath = `games/_standards/${standardId}/${grade}_${Date.now()}.jpg`;
    await uploadBytes(ref(storage, storagePath), file);
    if (!cs.grades) cs.grades = {};
    if (!cs.grades[grade]) cs.grades[grade] = {};
    cs.grades[grade].photo = storagePath;
    await updateDoc(doc(db, 'conditionStandards', standardId), { grades: cs.grades, updatedAt: Date.now() });
    if (oldPath && oldPath !== storagePath) deleteObject(ref(storage, oldPath)).catch(()=>{});
    renderConditionStandardsList_();
  }catch(e){
    alert('사진 업로드 중 문제가 발생했습니다: ' + e.message);
  }
}

async function removeStandardPhoto_(standardId, grade){

  const oldPath = cs.grades?.[grade]?.photo;
  if (cs.grades && cs.grades[grade]) cs.grades[grade].photo = null;
  await updateDoc(doc(db, 'conditionStandards', standardId), { grades: cs.grades, updatedAt: Date.now() });
  if (oldPath) deleteObject(ref(storage, oldPath)).catch(()=>{});
  renderConditionStandardsList_();
}

/** JSZip을 처음 쓸 때만 CDN에서 불러옵니다 (여러 이미지를 zip 하나로 묶기 위함). */
let jszipLoadPromise_ = null;
function loadJSZip_(){
  if (window.JSZip) return Promise.resolve(window.JSZip);
  if (jszipLoadPromise_) return jszipLoadPromise_;
  jszipLoadPromise_ = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = ()=>resolve(window.JSZip);
    s.onerror = ()=>reject(new Error('JSZip 라이브러리를 불러오지 못했습니다 (네트워크 문제일 수 있습니다)'));
    document.head.appendChild(s);
  });
  return jszipLoadPromise_;
}

/** QR코드 생성 라이브러리를 처음 쓸 때만 CDN에서 불러옵니다. */
let qrLibLoadPromise_ = null;
function loadQRCodeLib_(){
  if (window.QRCode) return Promise.resolve(window.QRCode);
  if (qrLibLoadPromise_) return qrLibLoadPromise_;
  qrLibLoadPromise_ = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = ()=>resolve(window.QRCode);
    s.onerror = ()=>reject(new Error('QR코드 라이브러리를 불러오지 못했습니다 (네트워크 문제일 수 있습니다)'));
    document.head.appendChild(s);
  });
  return qrLibLoadPromise_;
}

/** 이 게임을 스캔 즉시 열기 위한 링크를 만듭니다. mode를 지정하지 않으면 반납대 가이드로
 *  바로 열립니다 (매장에서 QR코드로 가장 많이 쓸 화면이기 때문입니다). */
function buildGameDeepLink_(gameId, mode){
  const url = new URL(location.href);
  url.hash = '';
  url.search = '';
  url.searchParams.set('game', gameId);
  if (mode && mode !== 'return') url.searchParams.set('mode', mode);
  return url.toString();
}

/** 게임 상세 화면에서 QR코드 버튼을 누르면, 이 게임의 매장 QR(RB/게임ID)을 보여줍니다.
 *  반납대 뷰어를 켜고 스캐너로 찍으면 반납대 가이드가 열립니다. 직원끼리 바로 여는 링크는 따로 복사할 수 있습니다. */

// ============================================================
// QR 스캐너(USB/블루투스, 키보드 입력 방식) 스캔 모드
// ============================================================
let qrScanActive_ = false;
let qrScanBuffer_ = '';
let qrScanKeyHandler_ = null;

function toggleQrScanMode_(){
  if (qrScanActive_) deactivateQrScan_(); else activateQrScan_();
}

/** 스캔 모드를 켜면, 검색창 등 다른 입력에 포커스가 있어도 스캐너가 보내는 키 입력을
 *  document 레벨에서 직접 가로채 버퍼에 모읍니다 (검색창 입력과 충돌하지 않도록). */
function activateQrScan_(){
  if (qrScanActive_) return;
  qrScanActive_ = true;
  qrScanBuffer_ = '';
  if (document.activeElement && typeof document.activeElement.blur === 'function') document.activeElement.blur();
  qrScanKeyHandler_ = (e)=>{
    if (!qrScanActive_) return;
    if (e.key === 'Enter' || (e.key === 'Tab' && qrScanBuffer_)){ // 스캐너에 따라 끝에 Tab을 보내기도 합니다
      e.preventDefault();
      e.stopPropagation();
      const raw = qrScanBuffer_.trim();
      qrScanBuffer_ = '';
      if (!raw){ return; } // 빈 채로 Enter만 온 경우는 무시 (오작동 방지)
      handleQrScanInput_(raw);
      return;
    }
    // 문자 키만 버퍼에 담고, Shift 같은 제어키는 무시합니다.
    // 한글 입력 상태(IME)이면 스캐너가 보낸 "R"이 "ㄱ"이나 "Process"로 들어오므로, 그때는 눌린 자판 위치(e.code)로
    // 원래 영문·숫자·기호를 되살립니다. (QR 내용은 영문·숫자·기호뿐이라 이렇게 복원할 수 있습니다)
    const ch = scanKeyChar_(e);
    if (ch){
      e.preventDefault();
      e.stopPropagation();
      qrScanBuffer_ += ch;
    }
  };
  document.addEventListener('keydown', qrScanKeyHandler_, true);
  updateQrScanIndicator_();
}

const SCAN_CODE_CHARS_ = {
  Minus:['-','_'], Equal:['=','+'], BracketLeft:['[','{'], BracketRight:[']','}'], Backslash:['\\','|'],
  Semicolon:[';',':'], Quote:["'",'"'], Backquote:['`','~'], Comma:[',','<'], Period:['.','>'], Slash:['/','?'], Space:[' ',' '],
  NumpadDivide:['/','/'], NumpadMultiply:['*','*'], NumpadSubtract:['-','-'], NumpadAdd:['+','+'], NumpadDecimal:['.','.'],
};
const SCAN_DIGIT_SHIFT_ = ')!@#$%^&*(';
function scanKeyChar_(e){
  if (e.key && e.key.length === 1 && e.key.charCodeAt(0) >= 0x20 && e.key.charCodeAt(0) < 0x7F) return e.key; // 보통의 영문·숫자·기호
  const code = e.code || '';
  let m;
  if ((m = code.match(/^Key([A-Z])$/))){
    const upper = !!e.shiftKey !== !!(e.getModifierState && e.getModifierState('CapsLock'));
    return upper ? m[1] : m[1].toLowerCase();
  }
  if ((m = code.match(/^Digit([0-9])$/))) return e.shiftKey ? SCAN_DIGIT_SHIFT_[Number(m[1])] : m[1];
  if ((m = code.match(/^Numpad([0-9])$/))) return m[1];
  if (SCAN_CODE_CHARS_[code]) return SCAN_CODE_CHARS_[code][e.shiftKey ? 1 : 0];
  return '';
}

function deactivateQrScan_(){
  qrScanActive_ = false;
  qrScanBuffer_ = '';
  if (qrScanKeyHandler_) document.removeEventListener('keydown', qrScanKeyHandler_, true);
  qrScanKeyHandler_ = null;
  updateQrScanIndicator_();
}

function updateQrScanIndicator_(){
  const btn = document.getElementById('qrScanToggleBtn');
  if (!btn) return;
  btn.classList.toggle('qr-scan-active', qrScanActive_);
  btn.classList.toggle('rv-on', rvMode_);
  const lb = document.getElementById('qrScanLabel');
  if (lb) lb.textContent = rvMode_ ? '뷰어 ON · 나가기' : '반납대 뷰어';
}

// 반납대 가이드 뷰어 모드 (하단 가운데 버튼): 스캔 자동 ON + 헤더 없는 전용 화면
// ============================================================
let rvMode_ = false;
function toggleReturnViewer_(){

}

    </div>`;

/** 스캐너가 보내온 문자열에서 게임 ID를 뽑아냅니다. QR에 전체 주소가 담겨 있어도,
 *  게임 ID만 담겨 있어도 둘 다 대응합니다. */
/**
 * 매장 QR에 담는 내용. 사이트 주소는 넣지 않고 "RB/게임ID" 또는 "RB/게임ID/스티커코드"만 담습니다.
 * 손님이 휴대폰으로 찍어도 짧은 글자만 보이고 가이드로 들어갈 수 없으며, 반납대 뷰어를 켠 상태에서
 * 스캐너로 찍을 때만 이 앱이 내용을 해석해 해당 가이드를 엽니다. (글자가 짧아 20mm 라벨에서도 QR이 성글고 잘 읽힘)
 */
const QR_PAYLOAD_PREFIX_ = 'RB/';
function buildQrPayload_(gameId, stickerCode){
  // 키보드 방식 스캐너는 한글을 보낼 수 없으므로, 게임ID에 한글 등 영문·숫자 외 글자가 있으면 %XX 형태(영문·숫자만)로 바꿔 담습니다.
  return QR_PAYLOAD_PREFIX_ + encodeURIComponent(String(gameId)) + (stickerCode ? '/' + stickerCode : '');
}

/** 스캐너가 보내온 글자에서 게임ID와 식별 스티커 코드를 꺼냅니다.
 *  새 형식(RB/게임ID/코드), 예전에 인쇄한 주소형 QR(?game=), 게임ID만 담긴 QR을 모두 받습니다. */
function parseScanPayload_(raw){
  raw = String(raw||'').trim();
  if (!raw) return null;
  if (raw.toUpperCase().startsWith(QR_PAYLOAD_PREFIX_)){
    const rest = raw.slice(QR_PAYLOAD_PREFIX_.length);
    const i = rest.indexOf('/'); // 게임ID에는 "/"를 쓸 수 없으므로 첫 "/" 뒤는 스티커 코드입니다
    let gameId = i === -1 ? rest : rest.slice(0, i);
    try{ gameId = decodeURIComponent(gameId); }catch(e){}
    const sticker = i === -1 ? '' : rest.slice(i+1);
    return gameId ? { gameId, sticker } : null;
  }
  try{
    const u = new URL(raw);
    const id = u.searchParams.get('game');
    return id ? { gameId: id, sticker: u.searchParams.get('s') || '' } : null; // URL인데 game이 없으면 우리 QR이 아님
  }catch(e){
    return { gameId: raw, sticker: '' }; // 게임 ID만 담긴 경우
  }
}

/** 스캔한 게임ID로 게임을 찾습니다. 스캐너가 Caps Lock 상태에서 대소문자를 뒤집어 보내는 경우가 있어,
 *  정확히 같은 ID가 없으면 대소문자를 무시하고 하나로 특정될 때만 그 게임으로 봅니다. */
function findGameByScannedId_(gameId){
  const id = String(gameId);
  const exact = games.find(x=>String(x.id)===id);
  if (exact) return exact;
  const ci = games.filter(x=>String(x.id).toLowerCase()===id.toLowerCase());
  return ci.length === 1 ? ci[0] : null;
}

// 아주 짧은 시간 안에 같은 내용이 연속으로 들어오면(스캐너가 흔들려 겹쳐 찍히는 등) 중복 처리하지 않습니다.
let lastQrScanRaw_ = null;
let lastQrScanAt_ = 0;

/** 반납대에서는 게임을 하나 찍고 → 가이드를 보고 → 바로 이어서 다음 게임을 찍는 흐름으로 계속 쓰기
 *  때문에, 스캔에 성공해도 스캔 모드를 자동으로 끄지 않고 계속 켜둔 채로 다음 스캔을 받습니다.
 *  (스캔 모드를 끄는 것은 "QR 스캔" 버튼을 다시 눌러 직접 끌 때뿐입니다.) */
function handleQrScanInput_(raw){
  const now = Date.now();
  if (raw === lastQrScanRaw_ && (now - lastQrScanAt_) < 1500) return; // 중복 스캔 무시
  lastQrScanRaw_ = raw;
  lastQrScanAt_ = now;

  const parsed = parseScanPayload_(raw);
  const gameId = parsed && parsed.gameId;
  if (!gameId){
    renderGuideAccessError_('게임 QR코드를 다시 확인해주세요.', raw);
    return;
  }
  const g = findGameByScannedId_(gameId);
  if (!g){
    renderGuideAccessError_('등록된 게임 가이드를 찾을 수 없습니다.', raw);
    return;
  }
  const isPublished = !!(g.returnGuide && g.returnGuide.published === true);
  if (!isPublished){
    renderGuideAccessError_(`"${g.name || g.id}" 반납대 가이드가 아직 게시되지 않았습니다.`, raw);
    return;
  }
  logQrScan_(g, parsed.sticker);
  openGame(g.id, 'return');
}

          </label>
        </div>
        <p id="qrPrintTotalInfo" style="font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;"></p>
        <button class="btn btn-primary2" style="width:auto;" onclick="generateQrLabelsPdf_()">QR 라벨 PDF 만들기</button>
        <div id="qrPrintStatus" style="margin-top:12px; font-size:12.5px; color:var(--ink-soft); white-space:pre-wrap;"></div>
      </div>
    </div>
  `;

  document.getElementById('qrPrintSearchInput').addEventListener('input', (e)=>{
    qrPrintSearch_ = e.target.value;
    renderQrPrintGameList_();
  });

  renderQrPrintGameList_();
  renderQrPrintSelectedList_();
}

function renderQrPrintGameList_(){
  const listEl = document.getElementById('qrPrintGameList');
  if (!listEl) return;
  const q = qrPrintSearch_.trim();
  const visibleGames = games
    .filter(g => !q || (g.name||'').includes(q) || (isChosungOnly(q) && getChosung(g.name||'').includes(q)))
    .slice()
    .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''), 'ko'));

  listEl.innerHTML = visibleGames.map(g=>{
    const checked = qrPrintSelected_.has(String(g.id));
    const n = getOwnedStickers_(g.id).length;
    return `
      <label class="pg-game-row">
        <input type="checkbox" ${checked?'checked':''} onchange="toggleQrPrintGameSelect_('${jsq_(g.id)}', this.checked)">
        <span class="pg-game-name">${escHtml_(g.name)}${n ? ` <span class="rg-card-hint">🏷️ 스티커 ${n}</span>` : ''}</span>
        <span class="pg-game-id">ID ${escHtml_(g.id)}</span>
      </label>`;
  }).join('') || '<p style="font-size:12.5px; color:var(--ink-soft);">검색 결과가 없습니다.</p>';
}

function toggleQrPrintGameSelect_(id, checked){
  id = String(id);
  if (checked){
    if (!qrPrintSelected_.has(id)) qrPrintSelected_.set(id, 1);
    // 식별 스티커가 있는 게임은 처음엔 모든 스티커를 골라 두고, 필요 없는 것만 해제합니다.
    qrPrintStickerSel_.set(id, new Set(getOwnedStickers_(id).map(st=>st.code)));
  } else {
    qrPrintSelected_.delete(id);
    qrPrintStickerSel_.delete(id);
  }
  renderQrPrintSelectedList_();
}

function toggleQrPrintSticker_(id, code, on){
  id = String(id);
  const set = qrPrintStickerSel_.get(id) || new Set();
  if (on) set.add(String(code)); else set.delete(String(code));
  qrPrintStickerSel_.set(id, set);
  renderQrPrintSelectedList_();
}

function updateQrPrintQty_(id, qty){
  id = String(id);
  const n = Math.max(1, Math.min(999, parseInt(qty, 10) || 1));
  if (qrPrintSelected_.has(id)) qrPrintSelected_.set(id, n);
  renderQrPrintSelectedList_();
}

function removeQrPrintGame_(id){
  id = String(id);
  qrPrintSelected_.delete(id);
  qrPrintStickerSel_.delete(id);
  renderQrPrintGameList_();
  renderQrPrintSelectedList_();
}

/** 이 게임에서 실제로 인쇄할 스티커 코드 목록. 스티커가 없거나 하나도 고르지 않으면 [''](스티커 없는 QR) */
function qrPrintCodesFor_(id){
  const stickers = getOwnedStickers_(id);
  const sel = qrPrintStickerSel_.get(String(id));
  const codes = stickers.filter(st => sel && sel.has(st.code)).map(st=>st.code);
  return codes.length ? codes : [''];
}

                    ${sel.size ? '' : '<span class="rg-card-hint">스티커를 고르지 않으면 스티커 없는 QR로 인쇄</span>'}</div>` : ''}
