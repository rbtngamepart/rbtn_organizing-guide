/** jsPDF를 처음 쓸 때만 CDN에서 불러옵니다 (QR 라벨 PDF 생성용). */
let jspdfLoadPromise_ = null;
function loadJsPDF_(){
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (jspdfLoadPromise_) return jspdfLoadPromise_;
  jspdfLoadPromise_ = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = ()=>resolve(window.jspdf.jsPDF);
    s.onerror = ()=>reject(new Error('PDF 생성 라이브러리를 불러오지 못했습니다 (네트워크 문제일 수 있습니다)'));
    document.head.appendChild(s);
  });
  return jspdfLoadPromise_;
}

/**
 * 라벨지의 칸마다 어떤 게임(과 식별 스티커)의 라벨이 들어가는지 정합니다.
 * cell은 첫 장 왼쪽 위 칸부터 0,1,2… 로 이어지는 번호입니다.
 */
function qrLabelSlots_(){
  const start = Math.max(1, Math.min(QR_LABELS_PER_PAGE, parseInt(document.getElementById('qrPrintStartCell')?.value, 10) || 1)) - 1;
  const newRow = !!document.getElementById('qrPrintNewRow')?.checked;
  const slots = [];
  let cell = start;
  [...qrPrintSelected_.keys()].forEach(id=>{
    const g = games.find(x=>String(x.id)===id);
    if (!g) return;
    const qty = qrPrintSelected_.get(id) || 0;
    if (!qty) return;
    qrPrintCodesFor_(id).forEach(code=>{
      if (newRow && slots.length && cell % QR_LABEL_COLS) cell += QR_LABEL_COLS - (cell % QR_LABEL_COLS);
      const label = stickerLabel_(id, code);
      for (let i=0; i<qty; i++) slots.push({ cell: cell++, game: g, code, label });
    });
  });
  return slots;
}

function qrCellPosMm_(cell){
  const gridW = QR_LABEL_MM * QR_LABEL_COLS, gridH = QR_LABEL_MM * QR_LABEL_ROWS;
  const posInPage = cell % QR_LABELS_PER_PAGE;
  return {
    page: Math.floor(cell / QR_LABELS_PER_PAGE),
    x: (QR_PAGE_W_MM - gridW) / 2 + (posInPage % QR_LABEL_COLS) * QR_LABEL_MM,
    y: (QR_PAGE_H_MM - gridH) / 2 + Math.floor(posInPage / QR_LABEL_COLS) * QR_LABEL_MM,
  };
}

/** 라벨 한 칸(20×20mm)을 그립니다: 위쪽에 QR, 아래쪽에 게임 이름과 식별 스티커.
 *  QR에는 짧은 코드(RB/게임ID/스티커)만 들어가서 작게 인쇄해도 잘 읽힙니다.
 *  jsPDF 기본 글꼴은 한글이 없어서 글자도 캔버스에 그려 이미지로 넣습니다. */
function buildQrLabelImage_(qrDataUrl, gameName, stickerLabel){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const SIZE = 480;                 // 20mm = 480px (1mm = 24px)
      const qrPx = 360;                 // QR 15mm
      const qrTop = 12;                 // 위 여백 0.5mm
      const lineY = (qrTop + qrPx + SIZE) / 2 + 2; // QR 아래 남은 공간의 가운데에 글자 한 줄
      const maxW = SIZE - 24;
      const FONT_PX = 48;               // 약 2mm
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, SIZE, SIZE);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, (SIZE-qrPx)/2, qrTop, qrPx, qrPx);
      ctx.imageSmoothingEnabled = true;
      ctx.font = `800 ${FONT_PX}px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif`;
      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
      const w = (t)=> ctx.measureText(t).width;
      // 주어진 폭에 안 들어가면 뒤를 잘라 "…"를 붙입니다.
      const ellipsize = (text, width)=>{
        text = String(text||'');
        if (w(text) <= width) return text;
        let t = text;
        while (t.length && w(t + '…') > width) t = t.slice(0, -1);
        return t ? t + '…' : '…';
      };

      // 한 줄: [게임 이름] [■ 식별 스티커] — 스티커는 붙일 때 가장 중요한 정보라 검은 바탕으로 눈에 띄게 둡니다.
      const PAD = 10, GAP = 10;
      let name = String(gameName||''), sticker = stickerLabel ? String(stickerLabel) : '';
      if (sticker){
        const pillW = (t)=> w(t) + PAD*2;
        // 둘 다 들어가지 않으면 스티커는 최대 절반까지만 쓰게 줄이고, 남는 폭에 게임 이름을 줄여 넣습니다.
        if (w(name) + GAP + pillW(sticker) > maxW){
          if (pillW(sticker) > maxW/2) sticker = ellipsize(sticker, maxW/2 - PAD*2);
          name = ellipsize(name, maxW - GAP - pillW(sticker));
        }
        const total = (name ? w(name) + GAP : 0) + pillW(sticker);
        let x = (SIZE - total) / 2;
        if (name){ ctx.fillStyle = '#000'; ctx.fillText(name, x, lineY); x += w(name) + GAP; }
        const h = FONT_PX + 10;
        ctx.fillStyle = '#000';
        roundRectPath_(ctx, x, lineY - h/2, pillW(sticker), h, 8); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillText(sticker, x + PAD, lineY + 1);
      } else {
        name = ellipsize(name, maxW);
        ctx.fillStyle = '#000';
        ctx.fillText(name, (SIZE - w(name)) / 2, lineY);
      }
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = ()=>reject(new Error('QR 이미지를 불러오지 못했습니다'));
    img.src = qrDataUrl;
  });
}

function qrPrintStatus_(msg){ const el = document.getElementById('qrPrintStatus'); if (el) el.textContent = msg; }

async function generateQrLabelsPdf_(){
  const slots = qrLabelSlots_();
  if (!slots.length){ alert('인쇄할 게임을 먼저 선택해주세요.'); return; }
  qrPrintStatus_('QR코드를 만드는 중...');
  let jsPDF;
  try{
    [, jsPDF] = await Promise.all([loadQRCodeLib_(), loadJsPDF_()]);
  }catch(e){ qrPrintStatus_('❌ ' + e.message); return; }

  // 같은 게임·스티커의 라벨 이미지는 한 번만 만들어서 필요한 수량만큼 재사용합니다.
  const imgByUnit = {};
  for (const sl of slots){
    const key = unitKey_(sl.game.id, sl.code);
    if (key in imgByUnit) continue;
    imgByUnit[key] = null;
    try{
      const qrSrc = await makeQrDataUrl_(buildQrPayload_(sl.game.id, sl.code), 480);
      if (qrSrc) imgByUnit[key] = await buildQrLabelImage_(qrSrc, sl.game.name, sl.label);
    }catch(e){ /* 실패하면 이 칸은 비워 둡니다 */ }
  }
  const failed = Object.keys(imgByUnit).filter(k=>!imgByUnit[k]);

  qrPrintStatus_(`PDF를 만드는 중... (라벨 ${slots.length}개)`);
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  let curPage = 0;
  slots.forEach(sl=>{
    const pos = qrCellPosMm_(sl.cell);
    while (curPage < pos.page){ doc.addPage(); curPage++; }
    const img = imgByUnit[unitKey_(sl.game.id, sl.code)];
    if (img) doc.addImage(img, 'PNG', pos.x, pos.y, QR_LABEL_MM, QR_LABEL_MM);
  });
  doc.save(`QR라벨_${new Date().toISOString().slice(0,10)}.pdf`);
  qrPrintStatus_(`✅ 라벨 ${slots.length}개 · ${curPage+1}장짜리 PDF를 다운로드했습니다.` +
    (failed.length ? `\n⚠ QR을 만들지 못한 ${failed.length}종은 빈 칸으로 남겼습니다.` : ''));
}

/** 칸이 좁아서 띄어쓰기 없는 긴 이름도 글자 단위로 줄을 나눕니다 (띄어쓰기가 있으면 그 자리를 우선). */
function wrapCanvasTextByChar_(ctx, text, maxWidth){
  const lines = [];
  wrapCanvasText_(ctx, text, maxWidth).forEach(line=>{
    let cur = '';
    for (const ch of line){
      if (cur && ctx.measureText(cur + ch).width > maxWidth){ lines.push(cur.trimEnd()); cur = ch.trimStart(); }
      else cur += ch;
    }
    if (cur) lines.push(cur);
  });
  return lines.length ? lines : [''];
}

async function startBulkDownload_(){
  const selected = games.filter(g => bulkDownloadSelected_.has(String(g.id)) && (g.photos||[]).length);
  if (!selected.length){ alert('사진이 있는 게임을 하나 이상 선택해주세요.'); return; }

  document.getElementById('bulkDownloadLog').textContent = '';
  bulkLog_('준비 중...');

  let JSZip;
  try{
    JSZip = await loadJSZip_();
  }catch(e){
    bulkLog_('⚠ zip 압축 도구를 불러오지 못해, 파일을 하나씩 개별 다운로드합니다.\n');
    await startBulkDownloadIndividually_(selected);
    return;
  }

  const zip = new JSZip();
  const totalPhotos = selected.reduce((sum,g)=>sum + (g.photos||[]).length, 0);
  let done = 0;
  bulkLog_(`게임 ${selected.length}개, 사진 ${totalPhotos}장을 이미지로 만드는 중...\n`);

  for (const g of selected){
    const usedNames = {};
    for (let i=0; i<g.photos.length; i++){
      try{
        const { canvas } = await renderPhotoToCanvas_(g, g.photos[i], GUIDE_EXPORT_DEFAULT_REF_WIDTH);
        const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
        let baseName = (g.name || `game_${g.id}`).replace(/[\\/:*?"<>|]/g, '_');
        let fileName = g.photos.length > 1 ? `${baseName}_사진${i+1}.png` : `${baseName}.png`;
        if (usedNames[fileName]){ fileName = `${baseName}_사진${i+1}_${g.id}.png`; }
        usedNames[fileName] = true;
        zip.file(fileName, blob);
        done++;
        bulkLog_(`  (${done}/${totalPhotos}) ${g.name} - 사진 ${i+1} 완료`);
      }catch(e){
        bulkLog_(`  ❌ ${g.name} - 사진 ${i+1} 실패: ${e.message}`);
      }
    }
  }

  bulkLog_('\nzip 파일 압축 중...');
  try{
    const zipBlob = await zip.generateAsync({ type:'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `가이드_이미지_${new Date().toISOString().slice(0,10)}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    bulkLog_('✅ 완료! zip 파일 다운로드를 시작합니다.');
  }catch(e){
    bulkLog_('❌ zip 파일 생성 중 문제가 발생했습니다: ' + e.message);
  }
}

/** zip 압축 도구를 못 쓸 때의 대체 방법: 파일을 하나씩 순서대로 개별 다운로드합니다. */
async function startBulkDownloadIndividually_(selected){
  const totalPhotos = selected.reduce((sum,g)=>sum + (g.photos||[]).length, 0);
  let done = 0;
  for (const g of selected){
    for (let i=0; i<g.photos.length; i++){
      try{
        const { canvas } = await renderPhotoToCanvas_(g, g.photos[i], GUIDE_EXPORT_DEFAULT_REF_WIDTH);
        const suffix = g.photos.length > 1 ? `_사진${i+1}` : '';
        downloadCanvasAsPng_(canvas, `${g.name || 'game'}${suffix}.png`);
        done++;
        bulkLog_(`  (${done}/${totalPhotos}) ${g.name} - 사진 ${i+1} 다운로드`);
      }catch(e){
        bulkLog_(`  ❌ ${g.name} - 사진 ${i+1} 실패: ${e.message}`);
      }
      await new Promise(r=>setTimeout(r, 350));
    }
  }
  bulkLog_('✅ 완료!');
}

let showDashboard_ = false;
let dashboardFilter_ = 'all'; // 'all' | 'done' | 'undone'

let dashboardPeople_ = null; // { storeOfEmail: {email: storeCode}, stores: [{code,name,members}] } — 진행현황을 열 때 한 번 불러옵니다
let dashboardStore_ = ''; // 진행현황 표에서 특정 매장 기준으로 볼 때의 매장 코드

async function openDashboard(){
  if (!confirmLeaveDetail_()) return;
  leavePresence_();
  showDashboard_ = true;
  currentGameId = null;
  appEl.innerHTML = `<p>불러오는 중...</p>`;
  try{
    const [editorsSnap, viewersSnap, storesSnap] = await Promise.all([
      getDocs(collection(db, 'editors')),
      getDocs(collection(db, 'viewers')),
      getDocs(collection(db, 'stores')),
    ]);
    const storeOfEmail = {};
    const memberCount = {};
    [editorsSnap, viewersSnap].forEach(snap => snap.forEach(d => {
      const code = (d.data() || {}).storeCode || '';
      storeOfEmail[d.id.toLowerCase()] = code;
      if (code) memberCount[code] = (memberCount[code] || 0) + 1;
    }));
    const stores = [];
    storesSnap.forEach(d => stores.push({ code: d.id, name: (d.data()||{}).name || d.id, members: memberCount[d.id] || 0 }));
    stores.sort((a,b)=> String(a.name).localeCompare(String(b.name), 'ko'));
    dashboardPeople_ = { storeOfEmail, stores };
  }catch(e){
    console.error('진행현황: 사용자/매장 정보를 불러오지 못했습니다', e);
    dashboardPeople_ = { storeOfEmail: {}, stores: [] };
  }
  if (showDashboard_) renderDashboard();
}
function closeDashboard(){
  showDashboard_ = false;
  renderHome_();
}
function setDashboardFilter(v){ dashboardFilter_ = v; renderDashboard(); }
function setDashboardStore_(code){ dashboardStore_ = code; renderDashboard(); }

/** 게임 하나를 "작업 완료"로 체크한 사람들이 속한 매장 코드 목록 */
function storesDoneForGame_(g){
  const map = (dashboardPeople_ && dashboardPeople_.storeOfEmail) || {};
  const set = new Set();
  (g.completedBy||[]).forEach(email => { const code = map[String(email).toLowerCase()]; if (code) set.add(code); });
  return set;
}
function openReportsOf_(g){ return (g.missingReports||[]).filter(r => !r.resolved); }

function renderDashboard(){
  const total = games.length;
  const doneCount = games.filter(g=>g.guideDone).length;
  const pct = total ? Math.round(doneCount/total*100) : 0;
  const people = dashboardPeople_ || { storeOfEmail:{}, stores:[] };
  const storeName = code => (people.stores.find(s=>s.code===code)||{}).name || code;

  // ---- 매장별 작업 완료율 (가이드가 완성된 게임 기준) ----
  const readyGames = games.filter(g=>g.guideDone);
  const storeDoneSets = games.map(g => storesDoneForGame_(g));
  const storeRows = people.stores.filter(s=>s.members > 0).map(s=>{
    const done = readyGames.filter(g => storeDoneSets[games.indexOf(g)].has(s.code)).length;
    const p = readyGames.length ? Math.round(done/readyGames.length*100) : 0;
    return { ...s, done, pct: p };
  }).sort((a,b)=> b.pct - a.pct || String(a.name).localeCompare(String(b.name), 'ko'));

  let filtered = games;
  if (dashboardFilter_ === 'done') filtered = games.filter(g=>g.guideDone);
  if (dashboardFilter_ === 'undone') filtered = games.filter(g=>!g.guideDone);
  if (dashboardFilter_ === 'reports') filtered = games.filter(g=>openReportsOf_(g).length);
  if (dashboardFilter_ === 'storeUndone' && dashboardStore_) filtered = games.filter(g=>g.guideDone && !storeDoneSets[games.indexOf(g)].has(dashboardStore_));
  filtered = filtered.slice().sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''), 'ko'));
  const totalOpenReports = games.reduce((n,g)=> n + openReportsOf_(g).length, 0);
  const btnStyle = v => dashboardFilter_===v ? 'background:var(--ink); color:var(--surface);' : '';

  appEl.innerHTML = `
    <button class="back" onclick="closeDashboard()">← 목록으로</button>
    <h2 style="margin:0 0 6px;">📊 작업 진행 현황</h2>
    <div class="dash-progress-card">
      <p style="font-size:13px; color:var(--ink-soft); margin:0 0 12px;">${pct}% · 가이드 완료 ${doneCount}/${total}개${totalOpenReports ? ` · <b style="color:var(--accent);">미해결 누락 신고 ${totalOpenReports}건</b>` : ''}</p>
      <div class="dash-progress-bar-track">
        <div class="dash-progress-bar-fill" style="width:${pct}%;"></div>
        <div class="dash-progress-bar-label">${pct}%</div>
      </div>
    </div>
    <div class="dash-progress-card">
      <p style="font-size:13px; font-weight:700; margin:0 0 4px;">🏪 매장별 작업 완료율</p>
      <p style="font-size:12px; color:var(--ink-soft); margin:0 0 12px;">가이드가 완성된 게임 ${readyGames.length}개 중, 그 매장 소속 누군가가 "작업 완료"를 체크한 게임 수입니다.</p>
      ${storeRows.length ? `<div class="store-progress">
        ${storeRows.map(r=>`
          <div><a href="javascript:void(0)" onclick="setDashboardStore_('${escHtml_(jsq_(r.code))}'); setDashboardFilter('storeUndone');" title="이 매장에서 아직 안 한 게임 보기">${escHtml_(r.name)}</a> <span style="color:var(--ink-soft); font-size:11px;">${r.members}명</span></div>
          <div class="dash-progress-bar-track"><div class="dash-progress-bar-fill" style="width:${r.pct}%;"></div></div>
          <div style="text-align:right; font-weight:700;">${r.done}/${readyGames.length} · ${r.pct}%</div>
        `).join('')}
      </div>` : `<p style="font-size:12.5px; color:var(--ink-soft); margin:0;">매장 정보가 등록된 사용자가 없습니다.</p>`}
    </div>
    <div class="crop-toolbar" style="margin-bottom:14px; flex-wrap:wrap; align-items:center;">
      <button onclick="setDashboardFilter('all')" style="${btnStyle('all')}">전체</button>

async function toggleGuideDoneFor(checkbox, gameId){

}

let listSearch_ = '';
let listSort_ = 'name'; // 'name' | 'usage' (이 매장에서 스캔된 횟수가 많은 순)
let listWorkFilter_ = 'all'; // 'all' | 'owned' | 'fav' | 'done' | 'undone' (작업 완료 여부는 편집자만)
let listEditFilter_ = 'all'; // 편집자용 "편집 상태" 필터: 'all' | 'noPhoto' | 'noMarker' | 'mismatch' | 'reports' | 'noGuide'

/** 편집 상태 판단: 표에는 있는데 어느 사진에도 마커가 없는 케이스 수 */
function unplacedCaseCount_(g){
  const placed = new Set();
  (g.photos||[]).forEach(p => (p.markers||[]).forEach(m => placed.add(m.caseIdx)));
  return (g.cases||[]).filter((c, ci) => !placed.has(ci)).length;
}
function markerCount_(g){ return (g.photos||[]).reduce((n,p)=> n + (p.markers||[]).length, 0); }

const LIST_EDIT_FILTERS_ = {
  all:      { label:'편집 상태: 전체',          test: ()=>true },
  noGuide:  { label:'가이드 준비중',             test: g=>!g.guideDone },
  noPhoto:  { label:'사진 없음',                 test: g=>!(g.photos||[]).length },
  noMarker: { label:'사진은 있는데 마커 없음',    test: g=>(g.photos||[]).length && !markerCount_(g) },
  mismatch: { label:'표에 있는데 사진 마커 없음', test: g=>(g.photos||[]).length && (g.cases||[]).length && unplacedCaseCount_(g) > 0 },
  reports:  { label:'누락 신고 있음',            test: g=>openReportsOf_(g).length > 0 },
};

/** 현재 매장에서 게임별로 QR 스캔된 누적 횟수 (스티커 단위로 나뉜 기록은 게임 기준으로 합칩니다). */
function gameUsageCounts_(){
  const m = new Map();
  gameStatsMap_.forEach((v, key)=>{
    const gid = String(v.gameId || String(key).split('__')[0]);
    m.set(gid, (m.get(gid)||0) + (Number(v.totalScans)||0));
  });
  return m;
}

function setListWorkFilter_(v){
  listWorkFilter_ = v;
  document.querySelectorAll('#listWorkFilterTabs button').forEach(b=>b.classList.toggle('active', b.dataset.v===v));

 *  전환하면서 바로 그 검색어로 이어서 필터링합니다. */

/** 즐겨찾기 · 최근 본 게임을 목록 위에 바로가기 버튼으로 보여줍니다 (검색 중이 아닐 때만). */

function renderGameListResults_(){
  const container = document.getElementById('gameListResults');
  if (!container) return;
  const editable = currentRole === 'editor';
  const myEmail = auth.currentUser?.email?.toLowerCase();
  const favs = new Set(getFavorites_());

  let filtered = games.filter(g => !listSearch_ || (g.name||'').includes(listSearch_) || String(g.id) === listSearch_.trim() || (isChosungOnly(listSearch_) && getChosung(g.name||'').includes(listSearch_)));
  if (listWorkFilter_ === 'fav'){
    filtered = filtered.filter(g => favs.has(String(g.id)));
  } else if (listWorkFilter_ === 'owned'){
    filtered = filtered.filter(g => ownedQty_(g.id) > 0);
  } else if (editable && listWorkFilter_ !== 'all'){
    filtered = filtered.filter(g=>{
      const isDone = myEmail && (g.completedBy||[]).includes(myEmail);
      return listWorkFilter_ === 'done' ? isDone : !isDone;
    });
  }
  if (editable && listEditFilter_ !== 'all' && LIST_EDIT_FILTERS_[listEditFilter_]){
    filtered = filtered.filter(LIST_EDIT_FILTERS_[listEditFilter_].test);
  }
  const usage = listSort_ === 'usage' ? gameUsageCounts_() : null;
  filtered = filtered.slice().sort((a,b)=>{
    if (usage){ const d = (usage.get(String(b.id))||0) - (usage.get(String(a.id))||0); if (d) return d; }
    return String(a.name||'').localeCompare(String(b.name||''), 'ko');
  });

  renderListQuickRows_();
  const countSlot = document.getElementById('listCountSlot');
  if (countSlot) countSlot.textContent = filtered.length !== games.length ? `${filtered.length}개 게임 (전체 ${games.length}개)` : `전체 ${games.length}개 게임`;

  if (!filtered.length){
    const msg = listSearch_ ? '검색 결과가 없습니다.'
      : listWorkFilter_ === 'owned' ? (activeStoreCode_ ? '이 매장에 보유 게임으로 등록된 게임이 없습니다. 더보기 → 📦 보유 게임 관리에서 등록할 수 있습니다.' : '매장이 지정되지 않아 보유 게임을 볼 수 없습니다.')
      : listWorkFilter_ === 'fav' ? '즐겨찾기한 게임이 없습니다. 게임 카드의 ☆를 눌러 추가하세요.'
      : '검색 결과가 없습니다.';
    container.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }
  container.innerHTML = filtered.map(g=>{
    const done = editable && myEmail && (g.completedBy||[]).includes(myEmail);
    const fav = favs.has(String(g.id));
    const thumbPath = (g.photos||[])[0]?.thumbPath;
    const reports = openReportsOf_(g).length;
    const badges = [];
    if (editable){
      if (reports) badges.push(`<span class="mini-badge warn">누락 신고 ${reports}</span>`);
      if (!(g.photos||[]).length) badges.push('<span class="mini-badge">사진 없음</span>');
      else if (!markerCount_(g)) badges.push('<span class="mini-badge">마커 없음</span>');
      else { const n = unplacedCaseCount_(g); if (n) badges.push(`<span class="mini-badge">마커 없는 케이스 ${n}</span>`); }
    }
    return `
    <div class="game-card ${g.guideDone ? '' : 'no-guide'} ${done ? 'work-done' : ''}" style="position:relative; cursor:pointer;" onclick="openGame('${g.id}')">
      <div style="display:flex; align-items:center; gap:7px; margin-bottom:2px;">
        <div class="meta" style="flex:1;">ID ${escHtml_(g.id)}</div>
        <button class="fav-btn ${fav?'on':''}" onclick="event.stopPropagation(); toggleFavorite_('${g.id}')" title="${fav?'즐겨찾기 해제':'즐겨찾기에 추가'}" style="${editable?'margin-right:18px;':''}">${fav?'★':'☆'}</button>
      </div>
      <div>
        ${thumbPath ? `<div class="card-thumb" data-thumb-path="${escHtml_(thumbPath)}"></div>` : ''}
        <div class="name">${escHtml_(g.name || '(이름 없음)')}</div>
        ${g.guideDone ? '' : '<div class="meta">가이드 준비중</div>'}
        ${usage ? `<div class="meta">이용 ${usage.get(String(g.id))||0}회</div>` : ''}
        ${badges.length ? `<div class="card-badges">${badges.join('')}</div>` : ''}
      </div>
      ${editable ? `
      <label style="display:flex; align-items:center; gap:5px; margin-top:8px; font-size:11.5px; color:var(--ink-soft); cursor:pointer;" onclick="event.stopPropagation();">
        <input type="checkbox" ${done?'checked':''} onclick="event.stopPropagation(); toggleWorkComplete('${g.id}', this.checked, this)"> 작업 완료
      </label>` : ''}
      ${editable ? `<button onclick="event.stopPropagation(); deleteGame('${g.id}')" style="position:absolute; top:12px; right:12px; border:none; background:none; color:var(--ink-soft); cursor:pointer;" title="휴지통으로 이동">✕</button>` : ''}
    </div>
  `;}).join('');

  observeCardThumbs_(container);
}

/** 카드 썸네일은 화면에 보일 때만 주소를 받아와서 불러옵니다 (게임이 많아도 목록이 느려지지 않게). */
let thumbObserver_ = null;
function observeCardThumbs_(container){
  const els = container.querySelectorAll('.card-thumb[data-thumb-path]');
  if (!els.length) return;
  const load = async (el)=>{
    const path = el.dataset.thumbPath;
    el.removeAttribute('data-thumb-path');
    try{ el.style.backgroundImage = `url('${await resolvePhotoUrl_(path)}')`; }catch(e){ el.remove(); }
  };
  if (!('IntersectionObserver' in window)){ els.forEach(load); return; }
  if (thumbObserver_) thumbObserver_.disconnect();
  thumbObserver_ = new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if (en.isIntersecting){ thumbObserver_.unobserve(en.target); load(en.target); } });
  }, { rootMargin: '200px' });
  els.forEach(el=>thumbObserver_.observe(el));
}

async function toggleWorkComplete(gameId, checked, checkboxEl){
  const myEmail = auth.currentUser?.email?.toLowerCase();
  if (!myEmail) return false;
  // 서버 응답을 기다리지 않고, 체크하자마자 카드 색상부터 바로 바꿔줍니다.
  const card = checkboxEl && checkboxEl.closest('.game-card');
  if (card) card.classList.toggle('work-done', checked);

  const gameRef = doc(db, 'games', gameId);
  const g = games.find(x=>x.id===gameId);
  g.completedBy = g.completedBy || [];
  if (checked && !g.completedBy.includes(myEmail)) g.completedBy.push(myEmail);
  if (!checked) g.completedBy = g.completedBy.filter(e=>e!==myEmail);
  try{
    // 목록 전체를 덮어쓰지 않고 "내 이메일만" 넣고 빼서, 여러 사람이 동시에 체크해도 서로 지워지지 않게 합니다.
    await updateDoc(gameRef, { completedBy: checked ? arrayUnion(myEmail) : arrayRemove(myEmail) });
  }catch(e){
    // 저장에 실패하면 화면 표시도 원래대로 되돌립니다.
    if (checked) g.completedBy = g.completedBy.filter(e=>e!==myEmail);
    else g.completedBy.push(myEmail);
    if (card) card.classList.toggle('work-done', !checked);
    if (checkboxEl) checkboxEl.checked = !checked;
    alert('작업 완료 상태를 저장하지 못했습니다: ' + e.message);
    return false;
  }
  return true;
}

/** 게임을 바로 지우지 않고 휴지통으로 옮깁니다. 편집자는 목록의 "🗑️ 휴지통"에서 복구할 수 있습니다. */
async function deleteGame(gameId){
  const g = games.find(x=>x.id===gameId);
  if (!confirm(`"${g?.name || gameId}" 게임을 휴지통으로 옮길까요?\n(목록의 "🗑️ 휴지통"에서 다시 복구할 수 있습니다)`)) return;
  try{
    await updateDoc(doc(db, 'games', gameId), { deleted: true, deletedAt: Date.now(), deletedBy: auth.currentUser?.email?.toLowerCase() || '' });
  }catch(e){
    alert('휴지통으로 옮기지 못했습니다: ' + e.message);
    return;
  }
  await loadGames();
  renderList();
}

async function restoreGame_(gameId){
  try{
    await updateDoc(doc(db, 'games', gameId), { deleted: deleteField(), deletedAt: deleteField(), deletedBy: deleteField() });
    await loadGames();
    renderTrash_();
  }catch(e){
    alert('복구하지 못했습니다: ' + e.message);
  }
}

async function purgeGame_(gameId){
  const g = trashedGames_.find(x=>x.id===gameId);
  if (!confirm(`"${g?.name || gameId}" 게임을 영구 삭제할까요?\n이 작업은 되돌릴 수 없습니다.`)) return;
  try{
    await deleteDoc(doc(db, 'games', gameId));
    await loadGames();
    renderTrash_();
  }catch(e){
    alert('영구 삭제하지 못했습니다: ' + e.message);
  }
}

async function createNewGame(){
  const id = prompt('새 게임의 ID를 입력하세요 (숫자 또는 문자, 다른 게임과 겹치면 안 됩니다):');
  if (id === null) return;
  const trimmedId = id.trim();
  if (!trimmedId){ alert('게임 ID를 입력해주세요.'); return; }
  if (!isValidGameId_(trimmedId)){ alert('게임 ID에는 공백이나 따옴표, 슬래시(/), #, ?, % 같은 특수문자를 쓸 수 없습니다.'); return; }
  if (isGameIdTaken_(trimmedId)){
    alert(`ID "${trimmedId}"는 이미 사용 중입니다${trashedGames_.some(x=>String(x.id)===trimmedId) ? ' (휴지통에 있는 게임)' : ''}. 다른 ID를 입력해주세요.`);
    return;
  }
  const name = prompt('새 게임 이름을 입력하세요:');
  if (!name || !name.trim()) return;
  await setDoc(doc(db, 'games', trimmedId), {
    name: name.trim(),
    cases: [],
    guideDone: false,
    completedBy: [],
    note: '',
    updatedAt: Date.now()
  });
  await loadGames();
  openGame(trimmedId);
}

async function openGame(id, mode){
  if (String(id) !== String(currentGameId) && !confirmLeaveDetail_()) return;
  leavePresence_(); // 이전 게임에 있던 접속/잠금 정리
  showDashboard_ = false;
  currentGameId = id;
  currentMode = (rvMode_ || isStoreAccount_()) ? 'return' : (mode || 'photo');
  currentPhotoIdx = 0;
  pushRecent_(id);
  resetChangeTracking_();
  renderDetail();

  if (currentRole === 'editor' && !rvMode_){
    const gotLock = await ensureEditLockForGame_(id);
    if (!gotLock){
      currentRole = 'viewer';
      updateRoleToggleUI_();
    } else {
      enterPresence_(id);
    }
    renderDetail();
  }
}

async function toggleGuideDone(checked){
  const g = games.find(x=>x.id===currentGameId);
  g.guideDone = checked;
  await updateDoc(doc(db, 'games', g.id), { guideDone: checked });
}

function updateGameNote(v){
  const g = games.find(x=>x.id===currentGameId);
  g.note = v; // 저장 버튼 누를 때 같이 반영됩니다.
}

/** 게임 이름을 바꿉니다. 실수로 바뀌지 않도록, ID 변경처럼 별도 버튼 → 입력창 → 확인 절차를 거칩니다. */
async function changeGameName_(){
  const g = games.find(x=>x.id===currentGameId);
  if (!g) return;
  const newName = prompt(`새 게임 이름을 입력하세요 (현재: ${g.name || ''}):`, g.name || '');
  if (newName === null) return; // 취소
  const trimmed = newName.trim();
  if (!trimmed || trimmed === g.name) return;
  if (!confirm(`게임 이름을 "${g.name || '(이름 없음)'}" → "${trimmed}"로 변경하시겠습니까?`)) return;

  try{
    g.name = trimmed;
    await updateDoc(doc(db, 'games', g.id), { name: trimmed, updatedAt: Date.now() });
    renderDetail();
  }catch(e){
    alert('이름 변경 중 문제가 발생했습니다: ' + e.message);
  }
}

/**
 * 게임 ID를 바꿉니다. Firestore는 문서 ID를 직접 바꿀 수 없어서,
 * 새 ID로 문서(+이전 버전 기록)를 통째로 복사한 뒤 기존 문서를 지우는 방식으로 처리합니다.
 */
async function changeGameId_(){
  const g = games.find(x=>x.id===currentGameId);
  if (!g) return;
  const newId = prompt(`새 게임 ID를 입력하세요 (현재: ${g.id}):`, g.id);
  if (newId === null) return;
  const trimmed = newId.trim();
  if (!trimmed || trimmed === g.id) return;
  if (!isValidGameId_(trimmed)){ alert('게임 ID에는 공백이나 따옴표, 슬래시(/), #, ?, % 같은 특수문자를 쓸 수 없습니다.'); return; }
  if (isGameIdTaken_(trimmed)){
    alert(`ID "${trimmed}"는 이미 다른 게임이 사용 중입니다${trashedGames_.some(x=>String(x.id)===trimmed) ? ' (휴지통에 있는 게임)' : ''}.`);
    return;
  }
  if (!confirm(`게임 ID를 "${g.id}" → "${trimmed}"로 변경할까요?\n이전 버전 기록도 함께 옮겨집니다. 되돌릴 수 없습니다.`)) return;

  try{
    const oldId = g.id;
    const { id, editLockHolder, editLockAt, ...data } = g; // 편집 잠금 정보는 새 ID로 옮기지 않습니다.
    await setDoc(doc(db, 'games', trimmed), { ...data, updatedAt: Date.now() });
    resetChangeTracking_(); // 바뀐 내용까지 새 ID 문서에 그대로 복사됐으므로, "저장 안 됨" 상태를 비웁니다

    // 이전 버전 기록(history)도 그대로 복사합니다.
    const historySnap = await getDocs(collection(db, 'games', oldId, 'history'));
    for (const d of historySnap.docs){
      await setDoc(doc(db, 'games', trimmed, 'history', d.id), d.data());
    }

    leavePresence_(); // 옛 ID에 남아있던 편집 잠금/접속 표시를 정리합니다.
    await deleteDoc(doc(db, 'games', oldId));

    await loadGames();
    openGame(trimmed);
  }catch(e){
    alert('게임 ID 변경 중 문제가 발생했습니다: ' + e.message);
  }
}

/** 매장 계정(편집 권한이 없는 계정): 게임 화면에서 반납대 가이드만 봅니다 (사진·표 탭은 가이드 제작용). */
function isStoreAccount_(){ return myApprovedRole !== 'editor'; }

function switchMode(m){
  if (isStoreAccount_()) m = 'return';
  currentMode = m;
  currentPhotoIdx = 0;
  renderDetail();
}

// ---- 사진 탭 ----
async function renderPhotoTab(){
  const g = games.find(x=>x.id===currentGameId);
  const editable = currentRole === 'editor';
  const photos = g.photos || [];
  const body = document.getElementById('tabBody');
  editSelection_ = null; // 사진을 새로 열거나 넘길 때는 선택을 초기화합니다 (모두 접힌 상태로 시작)

  const uploadRowHtml = editable ? `
    <div class="upload-row">
      <input type="file" id="photoFileInput" accept="image/*">
      <button class="btn btn-primary2" style="width:auto;" onclick="uploadPhoto()">업로드</button>
      <span id="uploadStatus" style="font-size:12px; color:var(--ink-soft);"></span>
    </div>
  ` : '';

  if (!photos.length){
    body.innerHTML = `${uploadRowHtml}<p>등록된 사진이 없습니다.${editable ? ' 위에서 업로드해주세요.' : ''}</p>`;
    return;
  }

  if (currentPhotoIdx >= photos.length) currentPhotoIdx = 0;
  const photo = photos[currentPhotoIdx];

  body.innerHTML = `
    ${uploadRowHtml}
    <div class="toolbar-row">
      <div class="toolbar-group">
        <button class="btn btn-ghost2" style="width:auto;" onclick="prevPhoto()" ${photos.length<2?'disabled':''}>◀</button>
        <span style="font-size:12.5px; color:var(--ink-soft); min-width:34px; text-align:center;">${currentPhotoIdx+1} / ${photos.length}</span>
        <button class="btn btn-ghost2" style="width:auto;" onclick="nextPhoto()" ${photos.length<2?'disabled':''}>▶</button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button class="btn btn-ghost2" style="width:auto;" onclick="openLightbox_()" title="사진을 화면 가득 크게 보고 확대/이동합니다 (F)">🔍 크게 보기</button>
        <button class="btn btn-ghost2" style="width:auto;" onclick="downloadGuideImage()" title="이 사진의 가이드 화면을 이미지로 저장합니다">🖼️ 이미지 다운로드</button>
        ${photos.length>1 ? `<button class="btn btn-ghost2" style="width:auto;" onclick="downloadAllGuideImages()" title="사진 ${photos.length}장을 전부 이미지로 저장합니다">🖼️ 전체(${photos.length}장) 다운로드</button>` : ''}
      </div>
    </div>
    ${editable ? `
    <div class="toolbar-row">
      <div class="toolbar-group">
        ${photos.length>1 ? `
          <button class="btn btn-ghost2" style="width:auto; padding:6px 9px; font-size:12px;" onclick="movePhoto(-1)" ${currentPhotoIdx===0?'disabled':''} title="사진 순서를 앞으로">◀ 순서</button>
          <button class="btn btn-ghost2" style="width:auto; padding:6px 9px; font-size:12px;" onclick="movePhoto(1)" ${currentPhotoIdx===photos.length-1?'disabled':''} title="사진 순서를 뒤로">순서 ▶</button>
        ` : ''}
        <button class="btn btn-ghost2" style="width:auto;" onclick="autoGenerateMarkers()" title="표에 있지만 사진에 마커가 없는 케이스를 자동으로 배치합니다">📍 표 기준 마커 자동 생성</button>
        <button class="btn btn-ghost2" style="width:auto;" onclick="deletePhoto()">🗑️ 사진 삭제</button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group slider-group-wrap">
        <div class="marker-size-control">
          <label>마커 크기</label>
          <input type="range" min="16" max="44" value="${g.markerSize||24}" oninput="previewMarkerSize(this.value)" onchange="updateMarkerSize(this.value)">
        </div>
        <div class="marker-size-control">
          <label>연결선 굵기</label>
          <input type="range" min="1" max="6" step="0.5" value="${g.lineWidth||2.2}" oninput="previewLineWidth(this.value)" onchange="updateLineWidth(this.value)">
        </div>
        <div class="marker-size-control">
          <label>텍스트박스 크기</label>
          <input type="range" min="0.7" max="2.2" step="0.1" value="${g.annoScale||1}" oninput="previewAnnoScale(this.value)" onchange="updateAnnoScale(this.value)">
        </div>
      </div>
    </div>
    ` : ''}
    <div class="photo-stage" id="photoStage" style="--marker-size:${g.markerSize||24}px; --conn-line-width:${g.lineWidth||2.2}px; --anno-scale:${g.annoScale||1};">
      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#999; font-size:12px;">불러오는 중...</div>
    </div>
    ${editable ? `<p style="margin-top:8px; font-size:11.5px;">사진의 빈 곳을 더블클릭하면 새 마커와 텍스트박스가 추가됩니다. 마커와 텍스트박스는 각각 드래그로 옮길 수 있고, 텍스트박스 안에서 케이스종류·구성품·수량을 바로 수정할 수 있습니다. 사진 영역에 파일을 끌어다 놓아도 업로드됩니다.</p>` : ''}
    ${!editable && photos.length>1 ? `<p style="margin-top:8px; font-size:11.5px; color:var(--ink-soft);">사진 좌우를 클릭하거나 화면을 좌우로 밀면 이전/다음 사진으로 넘어갑니다.</p>` : ''}
  `;

  const url = await resolvePhotoUrl_(photo.storagePath);
  const stage = document.getElementById('photoStage');
  if (!stage) return; // 그 사이 다른 사진으로 넘어갔으면 중단
  stage.style.backgroundImage = `url('${url}')`;
  stage.innerHTML = '<div class="line-layer" id="lineLayer"></div>' +
    (!editable && photos.length>1 ? `
      <div class="nav-zone nav-zone-left" onclick="prevPhoto()" title="이전 사진">${currentPhotoIdx>0?'‹':''}</div>
      <div class="nav-zone nav-zone-right" onclick="nextPhoto()" title="다음 사진">${currentPhotoIdx<photos.length-1?'›':''}</div>
    ` : '');
  drawMarkers(stage, photo, editable);
  drawLabels(stage, photo, editable);

  if (editable){
    stage.ondblclick = (e)=>{
      if (e.target !== stage) return;
      const rect = stage.getBoundingClientRect();
      const x = (e.clientX-rect.left)/rect.width*100;
      const y = (e.clientY-rect.top)/rect.height*100;
      const boxX = x < 60 ? Math.min(97, x+8) : Math.max(3, x-8);
      const boxY = Math.max(5, Math.min(90, y-4));
      g.cases = g.cases || [];
      g.cases.push({ caseType:'A', items:[{name:'새 구성품', qty:1}] });
      photo.markers = photo.markers || [];
      photo.markers.push({ x, y, caseIdx: g.cases.length-1, box:{x:boxX, y:boxY} });
      editSelection_ = { type:'marker', idx: photo.markers.length-1 }; // 방금 만든 것을 바로 편집할 수 있도록 펼쳐둡니다
      drawMarkers(stage, photo, editable);
      drawLabels(stage, photo, editable);
    };

    // 빈 곳을 한 번 클릭하면 선택을 해제합니다 (모든 텍스트박스·라벨이 다시 뷰어 화면처럼 접힙니다)
    stage.addEventListener('click', (e)=>{
      if (e.target !== stage) return;
      deselectAnno_();
    });

    // 사진 영역에 파일을 끌어다 놓아도 업로드할 수 있습니다.
    stage.addEventListener('dragover', e=>{ e.preventDefault(); stage.classList.add('dragover'); });
    stage.addEventListener('dragleave', ()=> stage.classList.remove('dragover'));
    stage.addEventListener('drop', e=>{
      e.preventDefault();
      stage.classList.remove('dragover');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) openCropModal_(file);
      else alert('이미지 파일만 업로드할 수 있습니다.');
    });
  } else if (photos.length > 1) {
    // 뷰어: 좌우로 밀어서(스와이프) 사진 넘기기 (모바일 터치 대응). 클릭 영역(nav-zone)과 함께 동작합니다.
    let swipeStartX = null, swipeStartY = null;
    stage.addEventListener('pointerdown', e=>{ swipeStartX = e.clientX; swipeStartY = e.clientY; });
    stage.addEventListener('pointerup', e=>{
      if (swipeStartX === null) return;
      const dx = e.clientX - swipeStartX;
      const dy = e.clientY - swipeStartY;
      swipeStartX = null; swipeStartY = null;
      if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // 가로 스와이프가 아니면 무시
      if (dx < 0) nextPhoto(); else prevPhoto();
    });
  }
}

function drawMarkers(stage, photo, editable){
  const g = games.find(x=>x.id===currentGameId);
  // 표 탭 등에서 케이스가 삭제됐는데도 마커만 남아있는 경우(더 이상 존재하지 않는 케이스를
  // 가리키는 마커)는, 화면에 빈 빨간 원으로 나오지 않도록 여기서 걸러냅니다.
  photo.markers = (photo.markers||[]).filter(m => g.cases[m.caseIdx] !== undefined);
  stage.querySelectorAll('.marker, .anno-box').forEach(el=>el.remove());
  const lineLayer = stage.querySelector('#lineLayer');
  if (lineLayer) lineLayer.innerHTML = '';

  (photo.markers||[]).forEach((m, mi)=>{
    const c = g.cases[m.caseIdx];

    // ---- 마커(케이스 종류가 표시된 원, 구성품인 경우 화살표) ----
    const dot = document.createElement('div');
    const isItem = c && c.caseType === NON_CASE_TYPE;
    dot.className = 'marker' + (c ? ` case-${c.caseType}` : '') + (isItem ? ' marker-item' : '');
    dot.style.left = m.x+'%';
    dot.style.top = m.y+'%';
    dot.textContent = c ? markerGlyph_(c.caseType) : '';
    dot.title = isItem ? '구성품' : `케이스 ${mi+1}`;
    if (editable){
      dot.addEventListener('pointerdown', (e)=>{
        e.stopPropagation();
        // 클릭한 지점과 마커의 실제 위치 사이의 차이를 기억해뒀다가, 드래그 내내 그 차이를 유지합니다.
        // (이걸 안 하면 클릭하자마자 마커가 커서 위치로 순간이동해버립니다)
        const rect0 = stage.getBoundingClientRect();
        const grabDx = (e.clientX-rect0.left)/rect0.width*100 - m.x;
        const grabDy = (e.clientY-rect0.top)/rect0.height*100 - m.y;
        const downX = e.clientX, downY = e.clientY;
        let moved = false;
        const move = (ev)=>{
          if (Math.abs(ev.clientX-downX) > 3 || Math.abs(ev.clientY-downY) > 3) moved = true;
          const rect = stage.getBoundingClientRect();
          m.x = Math.max(0, Math.min(100, (ev.clientX-rect.left)/rect.width*100 - grabDx));
          m.y = Math.max(0, Math.min(100, (ev.clientY-rect.top)/rect.height*100 - grabDy));
          dot.style.left = m.x+'%';
          dot.style.top = m.y+'%';
          drawConnLine_(stage, lineLayer, mi, dot, box);
        };
        const up = ()=>{
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          // 드래그 없이 그냥 클릭만 한 거라면, 이 마커의 텍스트박스를 편집 모드로 펼쳐줍니다.
          if (!moved && !(editSelection_ && editSelection_.type==='marker' && editSelection_.idx===mi)) selectAnno_('marker', mi);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
    }
    stage.appendChild(dot);

    // ---- 텍스트박스(케이스 정보 패널) ----
    let box = null;
    if (!m.box || !c){ return; } // 구버전 마커(박스 없이 만들어진 것)는 패널 없이 점만 표시

    box = document.createElement('div');
    const isSelected = editable && editSelection_ && editSelection_.type==='marker' && editSelection_.idx===mi;
    box.className = 'anno-box case-' + c.caseType + (editable ? (isSelected ? ' draggable selected' : ' collapsed') : ' readonly');
    box.style.left = m.box.x+'%';
    box.style.top = m.box.y+'%';

    if (editable && isSelected){
      box.innerHTML = `
        <div class="anno-head">
          <select onchange="updateMarkerCaseType(${mi}, this.value)">${SELECTABLE_TYPES.map(t=>`<option value="${t}" ${t===c.caseType?'selected':''}>${typeLabel_(t)}</option>`).join('')}</select>
          <button class="anno-del" title="이 마커/케이스 삭제" onclick="removeMarkerCase(${mi})">✕</button>
        </div>
        <div id="annoItems${mi}">
          ${(c.items||[]).map((it, ii)=>`
            <div class="anno-item-row">
              <div class="anno-item">
                <input type="text" value="${escHtml_(it.name||'')}" placeholder="구성품명" onchange="updateMarkerItem(${mi},${ii},'name',this.value)">
                <input type="number" value="${it.qty||0}" onchange="updateMarkerItem(${mi},${ii},'qty',this.value)">
                <button onclick="deleteMarkerItem(${mi},${ii})">✕</button>
              </div>
              <div class="anno-item-photo-row">
                ${it.photo ? `
                  <div class="case-photo-wrap mini checkerboard-bg" data-photo="${it.photo}">
                    <img class="case-photo-thumb" alt="" onclick="event.stopPropagation(); openPhotoLightbox_(this.src)">
                    <button class="case-photo-remove" title="사진 삭제" onclick="removeCasePhoto_(${mi},${ii})">✕</button>
                  </div>
                ` : `<button class="anno-item-photo-btn" onclick="triggerCasePhotoUpload_(${mi},${ii})">📷 사진 추가</button>`}
              </div>
            </div>
          `).join('')}
        </div>
        <button class="anno-additem" onclick="addMarkerItem(${mi})">+ 항목 추가</button>
        <textarea placeholder="비고 (선택)" rows="2" style="width:100%; margin-top:6px; padding:4px 6px; font-size:11px; border:1px solid var(--line); border-radius:4px; box-sizing:border-box; font-family:var(--sans); resize:vertical;"
          onchange="updateCaseNote(${m.caseIdx}, this.value)">${escHtml_(c.note||'')}</textarea>
        <button class="anno-label-btn" onclick="createLabelFromMarker(${mi})">라벨 만들기</button>
        <button class="anno-label-btn" onclick="duplicateMarkerCase(${mi})" title="이 텍스트박스(케이스) 복제">복제</button>
      `;
      // 박스 자체를 드래그로 옮기기 (입력창/버튼 클릭은 제외)
      box.addEventListener('pointerdown', (e)=>{
        if (['INPUT','BUTTON','SELECT','OPTION'].includes(e.target.tagName)) return;
        e.stopPropagation();
        // 클릭한 지점과 텍스트박스의 실제 위치 사이의 차이를 기억해뒀다가, 드래그 내내 그 차이를 유지합니다.
        const rect0 = stage.getBoundingClientRect();
        const grabDx = (e.clientX-rect0.left)/rect0.width*100 - m.box.x;
        const grabDy = (e.clientY-rect0.top)/rect0.height*100 - m.box.y;
        const move = (ev)=>{
          const rect = stage.getBoundingClientRect();
          m.box.x = Math.max(0, Math.min(100, (ev.clientX-rect.left)/rect.width*100 - grabDx));
          m.box.y = Math.max(0, Math.min(100, (ev.clientY-rect.top)/rect.height*100 - grabDy));
          box.style.left = m.box.x+'%';
          box.style.top = m.box.y+'%';
          clampBoxToStage_(stage, box, m); // 드래그하는 동안에도 사진 밖으로 나가지 않게 붙잡아둡니다
          drawConnLine_(stage, lineLayer, mi, dot, box);
        };
        const up = ()=>{ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
    } else if (editable){
      // 선택되지 않은 상태: 뷰어 화면과 똑같이 간단히 보여주고, 클릭하면 그때 편집 모드로 펼쳐집니다.
      // (케이스가 많은 사진에서 입력창들이 한꺼번에 겹쳐 보이는 걸 막기 위함입니다)
      box.innerHTML = `
        <div class="anno-head"><span class="case-badge case-${c.caseType}" style="font-size:0.96em; padding:0.17em 0.52em;">${typeLabel_(c.caseType)}</span></div>
        ${(c.items||[]).map(it=>`
          <div style="display:flex; align-items:center; gap:0.35em; margin-bottom:0.17em;">
            ${it.photo ? `<span class="case-photo-wrap mini checkerboard-bg" data-photo="${it.photo}"><img class="case-photo-thumb" alt="" onclick="event.stopPropagation(); openPhotoLightbox_(this.src)"></span>` : ''}
            <span>${escHtml_(it.name||'')}${it.qty?` <span style="color:var(--ink-soft);">${it.qty}개</span>`:''}</span>
          </div>
        `).join('')}
        ${c.note ? `<div style="margin-top:0.35em; font-size:0.96em; color:var(--ink-soft); font-style:italic; white-space:pre-wrap;">${escHtml_(c.note)}</div>` : ''}
      `;
      box.addEventListener('click', (e)=>{ e.stopPropagation(); selectAnno_('marker', mi); });
    } else {
      box.innerHTML = `
        <div class="anno-head"><span class="case-badge case-${c.caseType}" style="font-size:0.96em; padding:0.17em 0.52em;">${typeLabel_(c.caseType)}</span></div>
        ${(c.items||[]).map(it=>`
          <div style="display:flex; align-items:center; gap:0.35em; margin-bottom:0.17em;">
            ${it.photo ? `<span class="case-photo-wrap mini checkerboard-bg" data-photo="${it.photo}"><img class="case-photo-thumb" alt="" onclick="event.stopPropagation(); openPhotoLightbox_(this.src)"></span>` : ''}
            <span>${escHtml_(it.name||'')}${it.qty?` <span style="color:var(--ink-soft);">${it.qty}개</span>`:''}</span>
          </div>
        `).join('')}
        ${c.note ? `<div style="margin-top:0.35em; font-size:0.96em; color:var(--ink-soft); font-style:italic; white-space:pre-wrap;">${escHtml_(c.note)}</div>` : ''}
      `;
    }
    stage.appendChild(box);
    clampBoxToStage_(stage, box, m, false); // 텍스트박스가 사진 오른쪽/아래쪽 밖으로 삐져나가지 않도록 보정
    box.querySelectorAll('.case-photo-wrap[data-photo]').forEach(wrap=>{
      const path = wrap.dataset.photo;
      resolvePhotoUrl_(path).then(url=>{
        const imgEl = wrap.querySelector('.case-photo-thumb');
        if (imgEl) imgEl.src = url;
      }).catch(()=>{});
    });

    // ---- 마커 ↔ 텍스트박스 연결선 ----
    // 둘 다 화면에 실제로 그려진 뒤, 두 요소를 똑같은 방식(getBoundingClientRect)으로
    // 측정해서 선을 긋습니다. (한쪽은 저장된 값, 한쪽은 측정값을 섞어 쓰면 어긋날 수 있어서
    // 반드시 같은 방식으로 통일합니다)
    if (lineLayer) drawConnLine_(stage, lineLayer, mi, dot, box);
  });
}

/**
 * 마커(dot)와 텍스트박스(box) 두 DOM 요소의 실제 화면 위치를 측정해서, 그 사이를
 * 잇는 점선을 순수 CSS(회전된 div)로 그립니다. (SVG 좌표계 관련 문제를 피하기 위해
 * 일부러 SVG를 쓰지 않습니다)
 */
/** 텍스트박스가 사진 영역의 오른쪽/아래쪽(또는 왼쪽/위쪽) 밖으로 삐져나가지 않도록,
 *  실제 렌더링된 박스 크기를 기준으로 위치를 안쪽으로 당겨줍니다. */
function clampBoxToStage_(stage, box, m, persist = true){
  if (!m.box) return false;
  const stageRect = stage.getBoundingClientRect();
  const boxRect = box.getBoundingClientRect();
  if (!stageRect.width || !stageRect.height) return false;
  const boxWPct = (boxRect.width / stageRect.width) * 100;
  const boxHPct = (boxRect.height / stageRect.height) * 100;
  const maxX = Math.max(0, 100 - boxWPct);
  const maxY = Math.max(0, 100 - boxHPct);
  let x = Math.min(Math.max(m.box.x, 0), maxX);
  let y = Math.min(Math.max(m.box.y, 0), maxY);
  if (x !== m.box.x || y !== m.box.y){
    // 화면을 그릴 때(persist=false)는 보이는 위치만 안쪽으로 당기고 저장값은 건드리지 않습니다.
    // (화면 크기가 다른 기기에서 열기만 해도 "수정됨"으로 잡히지 않게) 직접 드래그할 때만 값을 바꿉니다.
    if (persist){ m.box.x = x; m.box.y = y; }
    box.style.left = x+'%';
    box.style.top = y+'%';
    return true;
  }
  return false;
}

function drawConnLine_(stage, lineLayer, mi, dot, box){
  if (!lineLayer || !dot || !box) return;
  const stageRect = stage.getBoundingClientRect();
  const isItem = dot.classList.contains('marker-item');

  // 화살표 마커는 회전에 따라 실제 렌더링된 사각형(getBoundingClientRect)의 중심이 뾰족한 끝과
  // 달라지므로, 대신 저장된 위치(%)로 목표 지점을 정확히 계산합니다.
  let x1, y1;
  if (isItem){
    x1 = parseFloat(dot.style.left) / 100 * stageRect.width;
    y1 = parseFloat(dot.style.top) / 100 * stageRect.height;
  } else {
    const dotRect = dot.getBoundingClientRect();
    x1 = (dotRect.left + dotRect.width/2) - stageRect.left;
    y1 = (dotRect.top + dotRect.height/2) - stageRect.top;
  }
  const boxRect = box.getBoundingClientRect();
  const x2 = boxRect.left - stageRect.left; // 박스의 왼쪽 가장자리 중앙 (마커가 대체로 왼쪽에 있음)
  const y2 = (boxRect.top + boxRect.height/2) - stageRect.top;

  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const angle = Math.atan2(dy, dx) * 180 / Math.PI;

  let line = lineLayer.querySelector(`#connLine${mi}`);
  if (!line){
    line = document.createElement('div');
    line.className = 'conn-line';
    line.id = `connLine${mi}`;
    lineLayer.appendChild(line);
  }
  line.style.left = x1+'px';
  line.style.top = y1+'px';
  line.style.width = dist+'px';
  line.style.transform = `rotate(${angle}deg)`;
  const colorVar = getComputedStyle(dot).getPropertyValue('--c');
  if (colorVar) line.style.borderTopColor = colorVar.trim();

  // 화살표 마커는 뾰족한 끝이 정확히 목표 지점(%)에 오도록, 그리고 선과 같은 각도를 향하도록
  // (선은 화살표 쪽을 향해 그려지므로, 화살표는 그 반대 방향 = 선의 연장선을 가리켜야 합니다) 회전시킵니다.
  if (isItem){
    dot.style.transform = `translate(-100%,-50%) rotate(${angle + 180}deg)`;
  }
}

/**
 * 라벨을 드래그할 때 다른 라벨과 가장자리/중앙이 맞으면 빨간 점선으로 표시합니다.
 * xPos/yPos가 null이면 해당 방향 가이드를 지웁니다.
 */
function renderAlignGuides_(stage, xPos, yPos){
  let layer = stage.querySelector('#alignGuideLayer');
  if (!layer){
    layer = document.createElement('div');
    layer.id = 'alignGuideLayer';
    layer.style.cssText = 'position:absolute; inset:0; pointer-events:none; z-index:9;';
    stage.appendChild(layer);
  }
  layer.innerHTML = '';
  if (xPos != null){
    const el = document.createElement('div');
    el.className = 'align-guide';
    el.style.cssText = `left:${xPos}px; top:0; bottom:0; width:1.5px;`;
    layer.appendChild(el);
  }
  if (yPos != null){
    const el = document.createElement('div');
    el.className = 'align-guide';
    el.style.cssText = `top:${yPos}px; left:0; right:0; height:1.5px;`;
    layer.appendChild(el);
  }
}

// ---- 텍스트박스 안 편집 동작들 ----
/** 슬라이더를 움직이는 동안: 저장 없이 화면에서만 바로 크기를 미리 봅니다. */
function previewMarkerSize(v){
  const stage = document.getElementById('photoStage');
  if (stage) stage.style.setProperty('--marker-size', v+'px');
}

/** 슬라이더를 놓으면: 게임 데이터에 반영합니다. (다른 변경사항과 함께 "저장" 시 함께 저장됩니다) */
function updateMarkerSize(v){
  const g = games.find(x=>x.id===currentGameId);
  if (g) g.markerSize = Number(v);
}

/** 연결선 굵기도 마커 크기와 동일한 방식: 슬라이더를 움직이는 동안은 미리보기만, 놓으면 저장 대상에 반영. */
function previewLineWidth(v){
  const stage = document.getElementById('photoStage');
  if (stage) stage.style.setProperty('--conn-line-width', v+'px');
}
function updateLineWidth(v){
  const g = games.find(x=>x.id===currentGameId);
  if (g) g.lineWidth = Number(v);
}

/** 텍스트박스(케이스 정보 패널) 크기도 마커 크기와 동일한 방식: 구성품이 몇 개 안 되는 사진에서
 *  글씨/박스를 더 크게 보고 싶을 때 씁니다. --anno-scale은 em 단위로 자식 요소들까지 함께 커집니다. */
function previewAnnoScale(v){
  const stage = document.getElementById('photoStage');
  if (stage) stage.style.setProperty('--anno-scale', v);
}
function updateAnnoScale(v){
  const g = games.find(x=>x.id===currentGameId);
  if (g) g.annoScale = Number(v);
}

function updateMarkerCaseType(mi, val){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  g.cases[photo.markers[mi].caseIdx].caseType = val;
  redrawCurrentPhoto_();
}
function updateMarkerItem(mi, ii, field, val){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  g.cases[photo.markers[mi].caseIdx].items[ii][field] = field==='qty' ? Number(val) : val;
}
function addMarkerItem(mi){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  g.cases[photo.markers[mi].caseIdx].items.push({name:'', qty:1});
  redrawCurrentPhoto_();
}
function deleteMarkerItem(mi, ii){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  const items = g.cases[photo.markers[mi].caseIdx].items;
  items.splice(ii, 1);
  if (items.length === 0) items.push({name:'', qty:1}); // 최소 한 줄은 유지 (완전히 비면 편집이 어려움)
  redrawCurrentPhoto_();
}
/** 케이스 하나를 통째로 삭제하고, 모든 사진의 마커 참조(caseIdx)를 같이 정리합니다.
 *  (그 케이스를 가리키던 마커는 함께 지우고, 뒤에 있던 케이스들의 인덱스는 하나씩 당깁니다) */
function removeCaseAndFixMarkers_(g, caseIdx){
  g.cases.splice(caseIdx, 1);
  g.photos.forEach(p=>{
    p.markers = (p.markers||[]).filter(m=>{
      if (m.caseIdx === caseIdx) return false; // 이 케이스를 가리키던 마커는 함께 삭제
      if (m.caseIdx > caseIdx) m.caseIdx--; // 뒤 인덱스는 하나씩 당김
      return true;
    });
  });
}

function removeMarkerCase(mi){
  if (!confirm('이 마커와 케이스를 삭제할까요?')) return;
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  const caseIdx = photo.markers[mi].caseIdx;
  removeCaseAndFixMarkers_(g, caseIdx);
  redrawCurrentPhoto_();
}
function redrawCurrentPhoto_(){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  const stage = document.getElementById('photoStage');
  if (!stage) return;
  const editable = currentRole==='editor';
  drawMarkers(stage, photo, editable);
  drawLabels(stage, photo, editable);
}

/** 마커+텍스트박스(케이스)를 통째로 복제합니다. 새 케이스는 조금 옆으로 어긋난 위치에 생깁니다. */
function duplicateMarkerCase(mi){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  const m = photo.markers[mi];
  const c = g.cases[m.caseIdx];
  if (!c) return;

  const newCase = JSON.parse(JSON.stringify(c));
  g.cases.push(newCase);

  const newMarker = { x: Math.min(97, m.x + 5), y: Math.min(95, m.y + 5), caseIdx: g.cases.length - 1 };
  if (m.box) newMarker.box = { x: Math.min(97, m.box.x + 5), y: Math.min(95, m.box.y + 4) };
  photo.markers.push(newMarker);

  redrawCurrentPhoto_();
}

/**
 * ============================================================
 * 구성품 사진 (텍스트박스에 넣는 작은 사진, 자동 배경 제거 포함)
 * ------------------------------------------------------------
 * 사진 네 귀퉁이의 색을 "배경색"으로 추정해서, 그 색과 비슷한 픽셀을 투명하게 만드는
 * 방식입니다. 정교한 AI 분리는 아니지만, 밝고 단순한 배경(매트, 책상, 반납대 등) 위에
 * 놓고 찍은 사진에는 꽤 잘 맞습니다. 결과가 마음에 안 들면 민감도를 조절하거나
 * "배경 유지"를 선택할 수 있습니다.
 * ============================================================
 */
let casePhotoState_ = null; // { target, img, srcImageData }
let casePhotoFileInput_ = null;

/** target을 실제 데이터의 item 객체로 바꿔줍니다. 케이스 항목({type:'case',mi,ii})과
 *  반납대 가이드 항목({type:'return',section,idx}) 둘 다 지원합니다. */
function resolvePhotoTargetItem_(target){
  const g = games.find(x=>x.id===currentGameId);
  if (target.type === 'case'){
    const photo = g.photos[currentPhotoIdx];
    const caseIdx = photo.markers[target.mi].caseIdx;
    return g.cases[caseIdx].items[target.ii];
  }
  const rg = ensureReturnGuide_(g);
  return rg[target.section][target.idx];
}

function triggerCasePhotoUpload_(mi, ii){
  triggerPhotoUploadFor_({ type:'case', mi, ii });
}
function triggerReturnPhotoUpload_(section, idx){
  triggerPhotoUploadFor_({ type:'return', section, idx });
}
function triggerPhotoUploadFor_(target){
  if (!casePhotoFileInput_){
    casePhotoFileInput_ = document.createElement('input');
    casePhotoFileInput_.type = 'file';
    casePhotoFileInput_.accept = 'image/*';
    document.body.appendChild(casePhotoFileInput_);
  }
  casePhotoFileInput_.onchange = ()=>{
    const file = casePhotoFileInput_.files[0];
    casePhotoFileInput_.value = '';

  casePhotoFileInput_.click();
}

function openCasePhotoModal_(target, file){

}


/** 원본 픽셀 데이터를 기준으로, 네 귀퉁이 평균색과의 색 거리(threshold)에 따라
 *  배경을 투명하게 만든 새 ImageData를 계산합니다 (원본은 건드리지 않습니다). */
function computeBgRemovedImageData_(srcData, threshold){
  const { width, height, data: src } = srcData;
  const out = new Uint8ClampedArray(src);
  const corners = [[0,0],[width-1,0],[0,height-1],[width-1,height-1]];
  let br=0, bg=0, bb=0;
  corners.forEach(([x,y])=>{ const i=(y*width+x)*4; br+=src[i]; bg+=src[i+1]; bb+=src[i+2]; });
  br/=4; bg/=4; bb/=4;
  const soft = Math.max(6, threshold*0.5);
  for (let i=0; i<out.length; i+=4){
    const dr = src[i]-br, dg = src[i+1]-bg, db = src[i+2]-bb;
    const dist = Math.sqrt(dr*dr + dg*dg + db*db);
    if (dist < threshold) out[i+3] = 0;
    else if (dist < threshold + soft) out[i+3] = Math.round(255 * (dist-threshold) / soft);
  }
  return new ImageData(out, width, height);
}

function previewCasePhotoThreshold_(v){
  if (!casePhotoState_) return;
  document.getElementById('casePhotoThresholdLabel').textContent = v;
  const canvas = document.getElementById('casePhotoCanvas');
  const ctx = canvas.getContext('2d');
  const processed = computeBgRemovedImageData_(casePhotoState_.srcImageData, Number(v));
  ctx.putImageData(processed, 0, 0);
}

async function applyCasePhoto_(keepBackground){
  if (!casePhotoState_) return;
  const canvas = document.getElementById('casePhotoCanvas');
  const ctx = canvas.getContext('2d');
  if (keepBackground) ctx.putImageData(casePhotoState_.srcImageData, 0, 0);

  const { target } = casePhotoState_;
  const g = games.find(x=>x.id===currentGameId);
  const item = resolvePhotoTargetItem_(target);
  const oldPath = item.photo;

  try{
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const folder = target.type === 'case' ? 'case-photos' : 'return-guide-photos';
    const storagePath = `games/${g.id}/${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}.png`;
    await uploadBytes(ref(storage, storagePath), blob);
    item.photo = storagePath;
    await persistGame_(g);
    if (oldPath && oldPath !== storagePath) deleteObject(ref(storage, oldPath)).catch(()=>{});
    closeCasePhotoModal_();
    if (target.type === 'case') redrawCurrentPhoto_(); else renderReturnGuideTab();
  }catch(e){
    alert('사진을 저장하는 중 문제가 발생했습니다: ' + e.message);
  }
}

async function removeCasePhoto_(mi, ii){

}
async function removeReturnPhoto_(section, idx){
  await removePhotoFrom_({ type:'return', section, idx });
