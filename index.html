/** 좌/우 영역이 각각 스크롤되도록, 화면 남은 높이(상단 ~ 하단 내비 위)에 맞춰 높이를 정합니다.
 *  좁은 화면(세로로 쌓이는 경우)에서는 일반 스크롤로 둡니다. */
function fitReturnSplit_(){
  const el = document.getElementById('rgSplit');
  if (!el) return;
  if (window.innerWidth <= 720){ el.style.height = ''; return; }
  const top = el.getBoundingClientRect().top;
  const nav = document.getElementById('bottomNav');
  const navH = nav ? nav.getBoundingClientRect().height : 0;
  el.style.height = Math.max(280, window.innerHeight - top - navH - 14) + 'px';
}
window.addEventListener('resize', ()=>{ fitReturnSplit_(); });

function addGuideItem_(section, defaults){
  const g = games.find(x=>x.id===currentGameId);
  ensureReturnGuide_(g)[section].push(defaults);
  renderReturnGuideTab();
}
function updateGuideItem_(section, idx, field, val, isNumber){
  const g = games.find(x=>x.id===currentGameId);
  ensureReturnGuide_(g)[section][idx][field] = isNumber ? Number(val) : val;
  if (section === 'requiredItems' && field === 'qty'){
    // 필수 구성품 종류 수 표시를 위해 숫자만 바꿀 땐 전체를 다시 그릴 필요는 없습니다.
  }
}
async function deleteGuideItem_(section, idx){
  const g = games.find(x=>x.id===currentGameId);
  const rg = ensureReturnGuide_(g);
  const item = rg[section][idx];
  if (item && item.photo) deleteObject(ref(storage, item.photo)).catch(()=>{});
  rg[section].splice(idx, 1);
  renderReturnGuideTab();
}
function updateProtectorInfo_(v){
  const g = games.find(x=>x.id===currentGameId);
  ensureReturnGuide_(g).protectorInfo = v;
}
function estMinutesBadgeHtml_(g){
  const m = g && g.returnGuide ? Number(g.returnGuide.estMinutes) : NaN;
  if (!isFinite(m) || m <= 0) return '';
  return `<span class="est-badge" title="반납 관리 예상 소요 시간">⏱ 약 ${Math.round(m)}분</span>`;
}
async function updateEstMinutes_(v){
  const g = games.find(x=>x.id===currentGameId);
  const n = parseInt(v, 10);
  ensureReturnGuide_(g).estMinutes = (isFinite(n) && n > 0) ? n : null;
  await persistGame_(g);
  renderReturnGuideTab();
}
async function toggleGuidePublished_(checked){
  const g = games.find(x=>x.id===currentGameId);
  ensureReturnGuide_(g).published = checked;
  await persistGame_(g); // 게시 여부는 중요한 토글이라 바로 저장합니다.
}

async function saveGame(){
  // 사진 탭에서 마커를 옮겼을 수도 있으니, 표 저장 시에도 전체를 같이 저장합니다.
  const ok = await doSave_(false);
  if (ok) toast_('저장되었습니다 ✓');
}

/**
 * ============================================================
 * 변경사항 추적 · 실행 취소(Ctrl+Z) · 자동 저장 · 저장 안 하고 나가기 방지
 * ============================================================
 * 마커/라벨/표 편집 함수가 아주 많아서 하나하나에 "바뀜" 표시를 넣는 대신, 사용자가
 * 클릭·드래그·입력을 마칠 때마다 게임 내용(JSON)을 직전 상태와 비교해서 바뀌었으면
 * 실행 취소 기록에 쌓습니다. 마지막으로 저장한 내용과 다르면 "저장 안 됨"으로 봅니다.
 */
const UNDO_MAX_ = 50;
const AUTOSAVE_DELAY_MS_ = 4000;
let track_ = { gameId:null, saved:null, last:null, undo:[], redo:[] };
let saving_ = false;
let pendingSave_ = false;
let autosaveTimer_ = null;
let lastSavedAt_ = 0;
let pointerIsDown_ = false;

function currentGame_(){ return games.find(x=>x.id===currentGameId) || null; }

/** 저장 대상이 되는 "게임 내용"만 뽑아서 비교용 문자열로 만듭니다.
 *  (작업 완료 체크·가이드 완료·누락 신고·이름처럼 즉시 따로 저장되는 값은 제외) */
function contentJson_(g){
  return JSON.stringify({
    cases: g.cases || [], photos: g.photos || [], note: g.note || '',
    markerSize: g.markerSize ?? null, lineWidth: g.lineWidth ?? null, annoScale: g.annoScale ?? null,
    returnGuide: normReturnGuide_(g.returnGuide)
  });
}
/** 반납대 가이드는 화면에 그릴 때 빈 항목(기본값)이 채워지므로, 비교할 때는 같은 기본값을 채운 복사본으로 비교합니다
 *  (열어보기만 했는데 "수정됨"으로 잡히지 않게). */
function normReturnGuide_(rg){
  return ensureReturnGuide_({ returnGuide: JSON.parse(JSON.stringify(rg || {})) });
}
function applyContent_(g, json){
  const c = JSON.parse(json);
  g.cases = c.cases; g.photos = c.photos; g.note = c.note;
  g.returnGuide = c.returnGuide;
  ['markerSize','lineWidth','annoScale'].forEach(k=>{ if (c[k] == null) delete g[k]; else g[k] = c[k]; });
}

function resetChangeTracking_(){
  const g = currentGame_();
  const json = g ? contentJson_(g) : null;
  track_ = { gameId: g ? g.id : null, saved: json, last: json, undo: [], redo: [] };
  clearTimeout(autosaveTimer_);
  lastSavedAt_ = 0;
  updateSaveStateUI_();
}

function isDirty_(){
  if (currentRole !== 'editor' || !track_.gameId) return false;
  const g = currentGame_();
  if (!g || g.id !== track_.gameId) return false;
  return contentJson_(g) !== track_.saved;
}

/** 사용자 동작이 끝날 때마다 호출: 바뀐 게 있으면 실행 취소 기록에 쌓고 자동 저장을 예약합니다. */
function noteChange_(){
  if (currentRole !== 'editor') return;
  const g = currentGame_();
  if (!g || g.id !== track_.gameId) return;
  const cur = contentJson_(g);
  if (cur === track_.last) return;
  track_.undo.push(track_.last);
  if (track_.undo.length > UNDO_MAX_) track_.undo.shift();
  track_.redo = [];
  track_.last = cur;
  updateSaveStateUI_();
  scheduleAutosave_();
}
['pointerup','click','change','focusout'].forEach(type=>{
  document.addEventListener(type, ()=> setTimeout(noteChange_, 0), true);
});
document.addEventListener('pointerdown', ()=>{ pointerIsDown_ = true; }, true);
document.addEventListener('pointerup', ()=>{ pointerIsDown_ = false; }, true);
document.addEventListener('pointercancel', ()=>{ pointerIsDown_ = false; }, true);

function rerenderAfterContentSwap_(){
  editSelection_ = null;
  renderDetail();
}
function undo_(){
  if (currentRole !== 'editor') return;
  noteChange_(); // 아직 기록 안 된 마지막 변경까지 먼저 반영
  const g = currentGame_();
  if (!g || !track_.undo.length) return;
  track_.redo.push(track_.last);
  const prev = track_.undo.pop();
  applyContent_(g, prev);
  track_.last = prev;
  rerenderAfterContentSwap_();
  scheduleAutosave_();
}
function redo_(){
  if (currentRole !== 'editor') return;
  const g = currentGame_();
  if (!g || !track_.redo.length) return;
  track_.undo.push(track_.last);
  const next = track_.redo.pop();
  applyContent_(g, next);
  track_.last = next;
  rerenderAfterContentSwap_();
  scheduleAutosave_();
}

function isAutosaveOn_(){ return lsGet_('rbtn_autosave', true) !== false; }
function setAutosave_(on){
  lsSet_('rbtn_autosave', !!on);
  if (on) scheduleAutosave_(); else clearTimeout(autosaveTimer_);
  updateSaveStateUI_();
}
function scheduleAutosave_(){
  clearTimeout(autosaveTimer_);
  if (!isAutosaveOn_() || currentRole !== 'editor') return;
  autosaveTimer_ = setTimeout(autosaveTick_, AUTOSAVE_DELAY_MS_);
}
function autosaveTick_(){
  if (!isAutosaveOn_() || !isDirty_()) return;
  // 드래그 중이거나 글자를 입력하는 중이면 끝날 때까지 조금 더 기다립니다.
  const a = document.activeElement;
  const typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable);
  if (pointerIsDown_ || typing || saving_ || document.querySelector('.modal-backdrop')){ scheduleAutosave_(); return; }
  doSave_(true);
}

/** 저장 (버튼·Ctrl+S·자동 저장 공통). 저장하는 동안 또 바뀐 내용은 끝난 뒤 다시 저장됩니다. */
async function doSave_(silent){
  const g = currentGame_();
  if (!g) return false;
  if (saving_){ pendingSave_ = true; return false; }
  saving_ = true;
  updateSaveStateUI_();
  const ok = await persistGame_(g);
  saving_ = false;
  updateSaveStateUI_();
  if (pendingSave_){ pendingSave_ = false; if (isDirty_()) scheduleAutosave_(); }
  return ok;
}

/** persistGame_가 저장에 성공했을 때 호출: "마지막으로 저장한 내용"을 갱신합니다. */
function markSaved_(gameId, json){
  if (track_.gameId !== gameId) return;
  track_.saved = json;
  lastSavedAt_ = Date.now();
  updateSaveStateUI_();
}

function updateSaveStateUI_(){
  const el = document.getElementById('saveState');
  const btn = document.getElementById('saveBtn');
  const dirty = isDirty_();
  if (btn) btn.classList.toggle('dirty', dirty);
  if (el){
    el.className = 'save-state' + (saving_ ? ' saving' : dirty ? ' dirty' : '');
    const t = lastSavedAt_ ? new Date(lastSavedAt_) : null;
    el.textContent = saving_ ? '저장 중...'
      : dirty ? (isAutosaveOn_() ? '● 변경됨 · 곧 자동 저장' : '● 저장 안 됨')
      : t ? `✓ 저장됨 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}` : '';
  }
  const ub = document.getElementById('undoBtn'), rb = document.getElementById('redoBtn');
  const g = currentGame_();
  const hasUnrecorded = !!(g && track_.last && contentJson_(g) !== track_.last); // 기록 직전의 변경도 되돌릴 수 있음
  if (ub) ub.disabled = !track_.undo.length && !hasUnrecorded;
  if (rb) rb.disabled = !track_.redo.length;
}

/** 게임 화면에서 다른 화면으로 갈 때: 저장 안 한 변경사항이 있으면 물어봅니다.
 *  true = 계속 이동, false = 머무르기 */
function confirmLeaveDetail_(){
  if (!isDirty_()) return true;
  const g = currentGame_();
  if (!confirm(`"${g.name || g.id}"에 저장하지 않은 변경사항이 있습니다.\n\n[확인] 저장하고 이동\n[취소] 이 화면에 머무르기`)) return false;
  persistGame_(g); // 이동은 바로 하고, 저장은 뒤에서 마무리합니다 (실패하면 알림이 뜹니다)
  track_ = { gameId:null, saved:null, last:null, undo:[], redo:[] };
  clearTimeout(autosaveTimer_);
  return true;
}
window.addEventListener('beforeunload', (e)=>{
  if (isDirty_()){ e.preventDefault(); e.returnValue = ''; }
});

/** 화면 아래에 잠깐 떴다 사라지는 알림 */
function toast_(msg, ms){
  let el = document.getElementById('toast_');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast_';
    el.style.cssText = 'position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:10px; font-size:13px; font-weight:700; z-index:500; box-shadow:0 6px 20px rgba(0,0,0,.25); transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity = '0'; }, ms || 1800);
}

/**
 * ============================================================
 * 키보드 단축키
 * ============================================================
 */
document.addEventListener('keydown', (e)=>{
  if (document.getElementById('appRoot').style.display === 'none') return;
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key;

  if (key === 'Escape'){
    const lb = document.querySelector('.lightbox');
    if (lb){ closeLightbox_(); return; }
    const modals = document.querySelectorAll('.modal-backdrop');
    if (modals.length){
      const top = modals[modals.length-1];
      if (top.id === 'cropBackdrop') closeCropModal_();
      else if (top.id === 'casePhotoBackdrop') closeCasePhotoModal_();
      else top.remove();
      return;
    }
    if (document.querySelector('.nav-dropdown-menu.open, .more-menu.open')){ closeAllNavDropdowns_(); closeMoreMenu_(); return; }
    if (typing){ t.blur(); return; }
    if (editSelection_) deselectAnno_();
    return;
  }

  const editing = !!currentGameId && currentRole === 'editor' && !rvMode_;
  // 저장: 입력 중이어도 동작 (입력칸을 먼저 빠져나와서 입력한 값이 반영되게 합니다)
  if (mod && (key === 's' || key === 'S')){
    if (editing){
      e.preventDefault();
      if (typing) t.blur();
      setTimeout(saveGame, 0);
    }
    return;
  }
  // 실행 취소/다시 실행: 입력칸 안에서는 브라우저 기본 동작(글자 되돌리기)을 그대로 씁니다
  if (mod && !typing && editing){
    if (key === 'z' || key === 'Z'){ e.preventDefault(); if (e.shiftKey) redo_(); else undo_(); return; }
    if (key === 'y' || key === 'Y'){ e.preventDefault(); redo_(); return; }
  }
  if (mod || e.altKey || typing) return;

  const lb = document.querySelector('.lightbox');
  if (lb){
    if (key === 'ArrowLeft'){ e.preventDefault(); lightboxStep_(-1); }
    if (key === 'ArrowRight'){ e.preventDefault(); lightboxStep_(1); }
    if (key === '+' || key === '='){ e.preventDefault(); lightboxZoomBy_(1.25); }
    if (key === '-'){ e.preventDefault(); lightboxZoomBy_(0.8); }
    return;
  }
  if (document.querySelector('.modal-backdrop')) return;

  if (key === '/' && !rvMode_){
    e.preventDefault();
    document.getElementById('topSearchInput')?.focus();
    return;
  }
  if (key === '?'){ e.preventDefault(); openHelpModal(); return; }
  if (!currentGameId) return;

  if (currentMode === 'photo'){
    if (key === 'ArrowLeft'){ e.preventDefault(); prevPhoto(); return; }
    if (key === 'ArrowRight'){ e.preventDefault(); nextPhoto(); return; }
    if (key === 'f' || key === 'F'){ e.preventDefault(); openLightbox_(); return; }
    if ((key === 'Delete' || key === 'Backspace') && editing && editSelection_){
      e.preventDefault();
      const sel = editSelection_;
      if (sel.type === 'marker') removeMarkerCase(sel.idx);
      else { deleteLabel(sel.idx); editSelection_ = null; redrawCurrentPhoto_(); }
      setTimeout(noteChange_, 0);
      return;
    }
  }
});

/**
 * ============================================================
 * 반납대 가이드 누락·파손 신고 (한 번 누르면 정기 점검 대상으로 올림)
 * ============================================================
 * 매장에서는 문제 있는 게임을 포스트잇을 붙여 빼두는데, 여유가 없을 때 표시만 빠르게 남기는 용도입니다.
 * 내용은 따로 입력받지 않고, 지금 보고 있는 게임(스캔했다면 그 식별 스티커까지)을 이 매장의 점검 단위로
 * "신고됨" 표시해서, 스캔 횟수(20회)와 상관없이 정기 점검 목록 맨 위에 보이게 합니다.
 * "점검 완료"를 누르면 표시가 풀립니다.
 */
function currentReportUnit_(){
  const g = currentGame_(); if (!g) return null;
  const code = (currentScan_ && currentScan_.gameId === String(g.id)) ? (currentScan_.sticker || '') : '';
  return { g, code, unit: unitKey_(g.id, code), label: code ? stickerLabel_(g.id, code) : '' };
}
function isUnitFlagged_(unit){ return !!(gameStatsMap_.get(unit) || {}).flagged; }

/** 게임 제목(과 식별 스티커) 바로 오른쪽에 붙는 신고 버튼 */
function reportBtnHtml_(){
  const u = currentReportUnit_();
  if (!u || !activeStoreCode_) return '';
  const on = isUnitFlagged_(u.unit);
  return `<button class="rg-report-btn ${on?'on':''}" onclick="submitMissingReport_()" title="${on ? '정기 점검 대상으로 표시되어 있습니다 (누르면 취소)' : '누락·파손이 있으면 눌러서 정기 점검 대상으로 바로 올립니다'}">⚠ ${on ? '신고됨' : '누락·파손'}</button>`;
}
function refreshReportBtn_(){
  const slot = document.getElementById('reportBtnSlot');
  if (slot) slot.innerHTML = reportBtnHtml_();
}

async function submitMissingReport_(){
  const u = currentReportUnit_(); if (!u || !activeStoreCode_) return;
  const st = gameStatsMap_.get(u.unit) || {};
  const name = `${u.g.name || u.g.id}${u.label ? ` ${u.label}` : ''}`;
  const on = !st.flagged;
  if (!on && !confirm(`"${name}"의 누락·파손 표시를 취소할까요?`)) return;
  const now = Date.now();
  const by = (auth.currentUser?.email || '').toLowerCase();
  const data = on
    ? { gameId: String(u.g.id), gameName: u.g.name || '', stickerCode: u.code || null, stickerLabel: u.label || null, flagged: true, flaggedAt: now, flaggedBy: by }
    : { flagged: false, flaggedAt: null, flaggedBy: null };
  try{
    await setDoc(doc(db, 'stores', activeStoreCode_, 'gameStats', u.unit), data, { merge: true });
    gameStatsMap_.set(u.unit, { ...st, ...data });
    updateMaintBadge_();
    refreshReportBtn_();
    toast_(on ? `"${name}"을(를) 정기 점검 대상으로 올렸습니다` : '누락·파손 표시를 취소했습니다');
  }catch(e){
    alert('저장하지 못했습니다: ' + e.message);
  }
}

function storeNameOf_(code){ return (storeList_.find(s=>s.code===code) || {}).name || code || ''; }

function renderReportBanner_(g){
  const open = openReportsOf_(g);
  // 반납대(매장) 화면은 한 화면에 모든 내용이 들어가야 하므로, 신고 목록은 편집자 화면에서만 보여줍니다.
  const editable = currentRole === 'editor' && !rvMode_;
  if (!open.length || !editable) return '';
  return `<details class="report-banner" ${editable?'open':''}>
    <summary>⚠ 미해결 누락 신고 ${open.length}건</summary>
    ${open.slice().sort((a,b)=>b.at-a.at).map(r=>`
      <div class="report-item">
        <div style="flex:1; min-width:200px;">
          <div style="font-weight:700;">${formatHistoryDate_(r.at)} · ${escHtml_(r.name || r.email)}${r.storeCode ? ` · ${escHtml_(storeNameOf_(r.storeCode))}` : ''}</div>
          ${(r.items||[]).length ? `<div>${r.items.map(it=>`${escHtml_(it.name)}${it.qty?` ${it.qty}개`:''}`).join(', ')}</div>` : ''}
          ${r.memo ? `<div style="margin-top:2px; font-style:italic;">“${escHtml_(r.memo)}”</div>` : ''}
        </div>
        ${editable ? `<button class="btn btn-ghost2" style="width:auto; padding:4px 10px; font-size:12px;" onclick="resolveReport_('${escHtml_(jsq_(r.id))}')">해결됨</button>` : ''}
      </div>`).join('')}
  </details>`;
}
function refreshReportBanner_(){
  const slot = document.getElementById('reportBannerSlot');
  const g = currentGame_();
  if (slot && g) slot.innerHTML = renderReportBanner_(g);
}
async function resolveReport_(reportId){
  const g = currentGame_(); if (!g) return;
  const gameRef = doc(db, 'games', g.id);
  try{
    const updated = await runTransaction(db, async (tx)=>{
      const snap = await tx.get(gameRef);
      const list = ((snap.data()||{}).missingReports || []).map(r => r.id === reportId
        ? { ...r, resolved: true, resolvedAt: Date.now(), resolvedBy: auth.currentUser?.email?.toLowerCase() || '' } : r);
      tx.update(gameRef, { missingReports: list });
      return list;
    });
    g.missingReports = updated;
    refreshReportBanner_();
  }catch(e){
    alert('처리하지 못했습니다: ' + e.message);
  }
}

/**
 * ============================================================
 * QR 보조 기능 (공유, 인쇄용 QR 이미지, 목록에서 고른 게임을 QR 라벨 인쇄로 넘기기)
 * ============================================================
 */
async function shareGameQrLink_(gameId){
  const g = games.find(x=>String(x.id)===String(gameId));
  if (!g || !navigator.share) return;
  try{ await navigator.share({ title: `${g.name || ''} 반납대 가이드`, url: buildGameDeepLink_(g.id, 'return') }); }catch(e){}
}

/** 주어진 주소의 QR코드를 PNG 이미지(data URL)로 만듭니다 (화면 밖에서 잠깐 그려서 꺼냅니다). */
async function makeQrDataUrl_(text, size){
  const QRCode = await loadQRCodeLib_();
  const probe = document.createElement('div');
  probe.style.position = 'absolute';
  probe.style.left = '-9999px';
  document.body.appendChild(probe);
  try{
    new QRCode(probe, { text, width: size || 240, height: size || 240, correctLevel: QRCode.CorrectLevel.M });
    await new Promise(r=>setTimeout(r, 30)); // 캔버스가 그려질 시간을 잠깐 줍니다.
    const qrCanvas = probe.querySelector('canvas');
    const qrImgEl = probe.querySelector('img');
    return qrCanvas ? qrCanvas.toDataURL('image/png') : (qrImgEl ? qrImgEl.src : null);
  }finally{
    probe.remove();
  }
}


/**
 * ============================================================
 * 인쇄 (게임 가이드 1부: 사진 + 체크리스트 표 + 반납대 필수 구성품 + QR)
 * ============================================================
 */
function printHtml_(html){
  const area = document.getElementById('printArea');
  area.innerHTML = html;
  const imgs = [...area.querySelectorAll('img')];
  Promise.all(imgs.map(im => im.complete ? null : new Promise(r=>{ im.onload = im.onerror = r; }))).then(()=>{
    document.body.classList.add('printing-guide');
    const cleanup = ()=>{
      document.body.classList.remove('printing-guide');
      area.innerHTML = '';
      window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    window.print();
    setTimeout(()=>{ if (document.body.classList.contains('printing-guide')) cleanup(); }, 1000);
  });
}

async function printGameGuide_(){
  const g = currentGame_(); if (!g) return;
  noteChange_();
  toast_('인쇄 준비 중...', 4000);
  const refWidth = getPhotoStageRefWidth_();
  const photoImgs = [];
  for (const photo of (g.photos||[])){
    try{
      const { canvas } = await renderPhotoToCanvas_(g, photo, refWidth);
      photoImgs.push(`<img class="print-photo" src="${canvas.toDataURL('image/jpeg', 0.92)}">`);
    }catch(e){ console.error('인쇄용 사진 만들기 실패', e); }
  }
  let qrSrc = null;
  try{ qrSrc = await makeQrDataUrl_(buildQrPayload_(g.id), 240); }catch(e){}

  const cases = g.cases || [];
  const rows = casesInTypeOrder_(cases).map(ci=>{
    const c = cases[ci];
    const items = (c.items && c.items.length) ? c.items : [{name:'', qty:0}];
    return items.map((it, ii)=>`<tr>
      ${ii===0 ? `<td rowspan="${items.length}" style="font-weight:800; color:${caseColor_(c.caseType)};">${escHtml_(typeLabel_(c.caseType))}${CASE_SIZES[c.caseType] && CASE_SIZES[c.caseType] !== '-' ? `<div style="font-weight:400; font-size:10px; color:#555;">${CASE_SIZES[c.caseType]}mm</div>` : ''}</td>` : ''}
      <td>${escHtml_(it.name||'')}</td>
      <td style="text-align:center;">${it.qty||''}</td>
      <td style="text-align:center;"><span class="print-check"></span></td>
      ${ii===0 ? `<td rowspan="${items.length}" style="white-space:pre-wrap;">${escHtml_(c.note||'')}</td>` : ''}
    </tr>`).join('');
  }).join('');
  const required = (g.returnGuide && g.returnGuide.published && g.returnGuide.requiredItems) || [];

  const today = new Date();
  printHtml_(`
    <div class="print-page">
      <div class="print-head">
        <div>
          <h1>${escHtml_(g.name || '')}</h1>
          <div class="print-meta">ID ${escHtml_(g.id)} · 케이스 ${cases.length}개 · 인쇄 ${today.getFullYear()}.${today.getMonth()+1}.${today.getDate()}</div>
          ${g.note ? `<div style="margin-top:6px; font-size:12px; white-space:pre-wrap;">${escHtml_(g.note)}</div>` : ''}
        </div>
        ${qrSrc ? `<div class="print-qr"><img src="${qrSrc}" alt=""></div>` : ''}
      </div>
      ${photoImgs.join('')}
      ${cases.length ? `
      <table class="print-table">
        <thead><tr><th style="width:60px;">케이스</th><th>구성품</th><th style="width:40px;">수량</th><th style="width:36px;">확인</th><th>비고</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : ''}
      ${required.length ? `
      <table class="print-table" style="margin-top:10px;">
        <thead><tr><th>반납대 필수 구성품</th><th style="width:50px;">수량</th><th style="width:36px;">확인</th><th>확인 방법</th></tr></thead>
        <tbody>${required.map(it=>`<tr><td>${escHtml_(it.name||'')}</td><td style="text-align:center;">${it.qty||''}</td><td style="text-align:center;"><span class="print-check"></span></td><td>${escHtml_(it.note||'')}</td></tr>`).join('')}</tbody>
      </table>` : ''}
    </div>`);
}

/** 표 탭과 같은 순서(케이스 종류별)로 정렬한 케이스 번호 목록 */
function casesInTypeOrder_(cases){
  return cases.map((c, i) => i).sort((a, b) => {
    const ia = SELECTABLE_TYPES.indexOf(cases[a].caseType), ib = SELECTABLE_TYPES.indexOf(cases[b].caseType);
    return ia !== ib ? ia - ib : a - b;
  });
}

/**
 * ============================================================
 * 사진 크게 보기 (두 손가락으로 확대·이동, 마우스 휠 확대, 두 번 탭해서 확대/원래대로)
 * ============================================================
 * 사진 탭의 "🔍 크게 보기"(마커·라벨까지 그린 가이드 사진, ◀ ▶로 넘기기)와, 구성품·반납대 사진
 * 썸네일을 눌렀을 때(openPhotoLightbox_) 모두 이 화면 하나로 보여줍니다.
 */
let lightbox_ = null; // { idx, el, img, scale, tx, ty, minScale }

/** 게임 사진(idx번째)을 마커·텍스트박스·라벨까지 그린 모습으로 크게 봅니다. */
async function openLightbox_(idx){
  const g = currentGame_(); if (!g || !(g.photos||[]).length) return;
  if (idx === undefined) idx = currentPhotoIdx;
  const el = showLightboxShell_(g.photos.length > 1 ? { idx, count: g.photos.length } : null);
  let src;
  try{
    const { canvas } = await renderPhotoToCanvas_(g, g.photos[idx], getPhotoStageRefWidth_());
    src = canvas.toDataURL('image/jpeg', 0.92);
  }catch(e){
    try{ src = await resolvePhotoUrl_(g.photos[idx].storagePath); }catch(e2){ src = null; }
  }
  setLightboxImage_(el, src);
}

/** 작은 썸네일(구성품 사진, 상태 기준 사진, 반납대 가이드 사진 등)을 눌렀을 때 크게 봅니다. */
function openPhotoLightbox_(url){
  if (!url) return;
  setLightboxImage_(showLightboxShell_(null), url);
}

function showLightboxShell_(nav){
  closeLightbox_();
  const el = document.createElement('div');
  el.className = 'lightbox';
  el.innerHTML = `
    <div class="lightbox-bar">
      ${nav ? `<button onclick="lightboxStep_(-1)" title="이전 사진">◀</button><button onclick="lightboxStep_(1)" title="다음 사진">▶</button>` : ''}
      <button onclick="lightboxZoomBy_(1.4)" title="확대">＋</button>
      <button onclick="lightboxZoomBy_(1/1.4)" title="축소">－</button>
      <button onclick="lightboxFit_()" title="화면에 맞추기">맞춤</button>
      <button onclick="closeLightbox_()" title="닫기 (Esc)">✕</button>
    </div>
    <div class="lightbox-hint">두 손가락으로 벌리거나 휠로 확대 · 끌어서 이동 · 두 번 탭하면 확대/원래대로 · 빈 곳을 누르면 닫기${nav ? ` · 사진 ${nav.idx+1}/${nav.count}` : ''}</div>
    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#ccc; font-size:13px; pointer-events:none;" id="lightboxLoading">불러오는 중...</div>`;
  document.body.appendChild(el);
  lightbox_ = { idx: nav ? nav.idx : null, el, img:null, scale:1, tx:0, ty:0, minScale:1 };
  setupLightboxGestures_(el);
  return el;
}
function setLightboxImage_(el, src){
  if (!lightbox_ || lightbox_.el !== el) return; // 그 사이 닫혔거나 다른 사진으로 넘어감
  el.querySelector('#lightboxLoading')?.remove();
  if (!src){ el.insertAdjacentHTML('beforeend', '<div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#ccc; pointer-events:none;">사진을 불러오지 못했습니다</div>'); return; }
  const img = new Image();
  img.draggable = false;
  img.onload = ()=>{
    if (!lightbox_ || lightbox_.el !== el) return;
    lightbox_.img = img;
    el.appendChild(img);
    lightboxFit_();
  };
  img.src = src;
}
function closeLightbox_(){
  if (lightbox_ && lightbox_.el) lightbox_.el.remove();
  document.querySelectorAll('.lightbox').forEach(x=>x.remove());
  lightbox_ = null;
}
function lightboxStep_(d){
  const g = currentGame_(); if (!g || !lightbox_ || lightbox_.idx == null) return;
  const n = (g.photos||[]).length;
  const next = lightbox_.idx + d;
  if (next < 0 || next >= n) return;
  openLightbox_(next);
}
function applyLightboxTransform_(){
  const L = lightbox_; if (!L || !L.img) return;
  L.img.style.transform = `translate(${L.tx}px, ${L.ty}px) scale(${L.scale})`;
}
function lightboxFit_(){
  const L = lightbox_; if (!L || !L.img) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / L.img.naturalWidth, vh / L.img.naturalHeight);
  L.minScale = s; L.scale = s;
  L.tx = (vw - L.img.naturalWidth*s)/2;
  L.ty = (vh - L.img.naturalHeight*s)/2;
  applyLightboxTransform_();
}
/** 화면의 (cx, cy) 지점을 기준으로 확대/축소합니다 (그 지점이 손가락/커서 아래에 그대로 머물게). */
function lightboxZoomAt_(factor, cx, cy){
  const L = lightbox_; if (!L || !L.img) return;
  const newScale = Math.max(L.minScale * 0.8, Math.min(L.minScale * 8, L.scale * factor));
  const f = newScale / L.scale;
  L.tx = cx - (cx - L.tx) * f;
  L.ty = cy - (cy - L.ty) * f;
  L.scale = newScale;
  applyLightboxTransform_();
}
function lightboxZoomBy_(factor){ lightboxZoomAt_(factor, window.innerWidth/2, window.innerHeight/2); }

function setupLightboxGestures_(el){
  const pointers = new Map();
  let lastDist = 0, lastMid = null, lastTap = 0, downAt = null, moved = false;
  el.addEventListener('wheel', (e)=>{
    e.preventDefault();
    lightboxZoomAt_(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX, e.clientY);
  }, { passive:false });
  el.addEventListener('pointerdown', (e)=>{
    if (e.target.closest('.lightbox-bar')) return;
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pointers.size === 1){ downAt = { x:e.clientX, y:e.clientY, onImg: e.target.tagName === 'IMG' }; moved = false; }
    if (pointers.size === 2){
      const [a, b] = [...pointers.values()];
      lastDist = Math.hypot(a.x-b.x, a.y-b.y);
      lastMid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
      moved = true;
    }
    // 두 번 탭(또는 더블클릭): 확대 ↔ 화면 맞춤
    if (pointers.size === 1){
      const now = Date.now();
      if (now - lastTap < 300){
        const L = lightbox_;
        if (L && L.scale > L.minScale * 1.05) lightboxFit_();
        else lightboxZoomAt_(2.5, e.clientX, e.clientY);
        lastTap = 0;
        moved = true; // 두 번째 탭으로 창이 닫히지 않게
      } else lastTap = now;
    }
  });
  el.addEventListener('pointermove', (e)=>{
    if (!pointers.has(e.pointerId) || !lightbox_) return;
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (downAt && Math.hypot(e.clientX-downAt.x, e.clientY-downAt.y) > 6) moved = true;
    if (pointers.size === 1){
      lightbox_.tx += e.clientX - prev.x;
      lightbox_.ty += e.clientY - prev.y;
      applyLightboxTransform_();
    } else if (pointers.size === 2){
      const [a, b] = [...pointers.values()];
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      const mid = { x:(a.x+b.x)/2, y:(a.y+b.y)/2 };
      if (lastDist){
        lightbox_.tx += mid.x - lastMid.x;
        lightbox_.ty += mid.y - lastMid.y;
        lightboxZoomAt_(dist / lastDist, mid.x, mid.y);
      }
      lastDist = dist; lastMid = mid;
    }
  });
  const end = (e)=>{
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size < 2) lastDist = 0;
    // 사진 바깥 빈 곳을 (끌지 않고) 한 번 누르면 닫습니다. 두 번 탭 확대와 겹치지 않도록 잠깐 기다립니다.
    if (e.type === 'pointerup' && !pointers.size && downAt && !downAt.onImg && !moved){
      const tapAt = lastTap;
      setTimeout(()=>{ if (lastTap === tapAt && lightbox_ && lightbox_.el === el) closeLightbox_(); }, 310);
    }
    if (!pointers.size) downAt = null;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/**
 * ============================================================
 * 목록용 사진 썸네일 (작은 사진을 따로 만들어 두면 목록이 빠르고 데이터도 적게 씀)
 * ============================================================
 */
const THUMB_MAX_W_ = 480;
function makeThumbBlob_(source){
  const w = source.naturalWidth || source.width, h = source.naturalHeight || source.height;
  const scale = Math.min(1, THUMB_MAX_W_ / w);
  const c = document.createElement('canvas');
  c.width = Math.round(w*scale); c.height = Math.round(h*scale);
  c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.8));
}

/** 썸네일이 없는 기존 게임들의 첫 번째 사진으로 썸네일을 만들어 둡니다 (편집자용 일괄 작업). */
async function generateMissingThumbs_(){
  const targets = games.filter(g => (g.photos||[]).length && !g.photos[0].thumbPath);
  const log = (m)=> bulkLog_(m);
  const logEl = document.getElementById('bulkDownloadLog');
  if (logEl) logEl.textContent = '';
  if (!targets.length){ log('모든 게임에 이미 썸네일이 있습니다.'); return; }
  log(`썸네일이 없는 게임 ${targets.length}개의 썸네일을 만드는 중...\n`);
  let ok = 0;
  for (const g of targets){
    try{
      const photo = g.photos[0];
      const url = await resolvePhotoUrl_(photo.storagePath);
      const img = await new Promise((resolve, reject)=>{
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = ()=>resolve(im);
        im.onerror = ()=>reject(new Error('사진을 불러오지 못했습니다'));
        im.src = url;
      });
      const blob = await makeThumbBlob_(img);
      const thumbPath = photo.storagePath.replace(/\.[a-z0-9]+$/i, '') + '_thumb.jpg';
      await uploadBytes(ref(storage, thumbPath), blob);
      // 다른 편집자의 작업과 겹치지 않도록, 서버의 최신 내용에서 첫 사진에만 썸네일 경로를 붙입니다.
      // (게임 내용이 바뀐 게 아니므로 수정 시각(updatedAt)은 그대로 둡니다)
      const gameRef = doc(db, 'games', g.id);
      await runTransaction(db, async (tx)=>{
        const snap = await tx.get(gameRef);
        const photos = ((snap.data()||{}).photos || []).slice();
        if (photos[0] && photos[0].storagePath === photo.storagePath){
          photos[0] = { ...photos[0], thumbPath };
          tx.update(gameRef, { photos });
        }
      });
      photo.thumbPath = thumbPath;
      ok++;
      log(`  (${ok}/${targets.length}) ${g.name} 완료`);
    }catch(e){
      log(`  ❌ ${g.name} 실패: ${e.message}`);
    }
  }
  log(`\n✅ 썸네일 ${ok}개를 만들었습니다.`);
}

/**
 * ============================================================
 * 이전 버전 미리보기 · 현재와 비교
 * ============================================================
 */
function caseSummaryText_(c){
  if (!c) return '';
  return `${typeLabel_(c.caseType)} [${(c.items||[]).map(it=>`${it.name||''}${it.qty?` ${it.qty}개`:''}`).join(', ')}]${c.note ? ` (${c.note})` : ''}`;
}
/** 현재 내용(cur)을 과거 버전(old)으로 되돌리면 무엇이 바뀌는지 목록으로 만듭니다. */
function diffGames_(cur, old){
  const out = [];
  const cc = cur.cases || [], oc = old.cases || [];
  const n = Math.max(cc.length, oc.length);
  for (let i=0; i<n; i++){
    const a = caseSummaryText_(cc[i]), b = caseSummaryText_(oc[i]);
    if (a === b) continue;
    if (!cc[i]) out.push({ kind:'add', text:`케이스 ${i+1} 다시 생김: ${b}` });
    else if (!oc[i]) out.push({ kind:'del', text:`케이스 ${i+1} 없어짐: ${a}` });
    else out.push({ kind:'chg', text:`케이스 ${i+1}: ${a} → ${b}` });
  }
  const cp = cur.photos || [], op = old.photos || [];
  if (cp.length !== op.length) out.push({ kind:'chg', text:`사진 ${cp.length}장 → ${op.length}장` });
  const pn = Math.min(cp.length, op.length);
  for (let i=0; i<pn; i++){
    if (cp[i].storagePath !== op[i].storagePath){ out.push({ kind:'chg', text:`사진 ${i+1}: 다른 사진으로 바뀜` }); continue; }
    if (JSON.stringify(cp[i].markers||[]) !== JSON.stringify(op[i].markers||[])) out.push({ kind:'chg', text:`사진 ${i+1}: 마커 ${(cp[i].markers||[]).length}개 → ${(op[i].markers||[]).length}개 (위치·연결 포함 변경)` });
    if (JSON.stringify(cp[i].labels||[]) !== JSON.stringify(op[i].labels||[])) out.push({ kind:'chg', text:`사진 ${i+1}: 라벨 ${(cp[i].labels||[]).length}개 → ${(op[i].labels||[]).length}개 (내용·위치 포함 변경)` });
  }
  if ((cur.note||'') !== (old.note||'')) out.push({ kind:'chg', text:`게임 메모: "${cur.note||''}" → "${old.note||''}"` });
  if ((cur.name||'') !== (old.name||'')) out.push({ kind:'chg', text:`이름: ${cur.name||''} → ${old.name||''}` });
  const rgA = normReturnGuide_(cur.returnGuide), rgB = normReturnGuide_(old.returnGuide);
  if (JSON.stringify(rgA) !== JSON.stringify(rgB)){
    out.push({ kind:'chg', text:`반납대 가이드: 필수 구성품 ${rgA.requiredItems.length}종 → ${rgB.requiredItems.length}종, 정리 방법 ${rgA.sortingSteps.length}개 → ${rgB.sortingSteps.length}개${rgA.published !== rgB.published ? `, 게시 ${rgA.published?'켜짐':'꺼짐'} → ${rgB.published?'켜짐':'꺼짐'}` : ''} (내용 포함 변경)` });
  }
  ['markerSize','lineWidth','annoScale'].forEach(k=>{
    if ((cur[k]??null) !== (old[k]??null)) out.push({ kind:'chg', text:`표시 설정(${k==='markerSize'?'마커 크기':k==='lineWidth'?'연결선 굵기':'텍스트박스 크기'}): ${cur[k]??'기본'} → ${old[k]??'기본'}` });
  });
  return out;
}

async function showHistoryPreview_(gameId, historyId){
  const slot = document.getElementById(`historyPreview_${historyId}`);
  if (!slot) return;
  if (slot.dataset.open === '1'){ slot.innerHTML = ''; slot.dataset.open = ''; return; }
  slot.dataset.open = '1';
  slot.innerHTML = '<div class="history-preview">불러오는 중...</div>';
  const item = (historyItems_ || []).find(h=>h.id===historyId);
  const cur = games.find(x=>x.id===gameId);
  if (!item || !cur){ slot.innerHTML = '<div class="history-preview">불러오지 못했습니다.</div>'; return; }
  const old = { id: gameId, cases: [], photos: [], ...item.snapshot };
  const diffs = diffGames_(cur, old);
  let imgHtml = '';
  if ((old.photos||[]).length){
    try{
      const { canvas } = await renderPhotoToCanvas_(old, old.photos[0], GUIDE_EXPORT_DEFAULT_REF_WIDTH);
      imgHtml = `<img src="${canvas.toDataURL('image/jpeg', 0.85)}" alt="이 버전의 첫 번째 사진">`;
    }catch(e){}
  }
  if (slot.dataset.open !== '1') return;
  slot.innerHTML = `<div class="history-preview">
    ${imgHtml}
    <div style="font-size:12px; font-weight:700; margin-bottom:4px;">이 버전으로 되돌리면 바뀌는 내용 (${diffs.length}건)</div>
    ${diffs.length ? `<ul class="diff-list">${diffs.map(d=>`<li class="diff-${d.kind}">${escHtml_(d.text)}</li>`).join('')}</ul>` : '<p style="font-size:12px;">현재 내용과 같습니다.</p>'}
  </div>`;
}

// ============================================================
// 매장별 기능: QR 스캔 기록(히스토리·랭킹) · 정기 점검 · 보유 게임 · 게임 DB(엑셀)
// 데이터 위치: stores/{매장코드}/scans, gameStats, ownedGames  (게임 자체 정보는 기존 games 그대로)
// ============================================================
const MAINT_THRESHOLD_ = 20; // 점검 이후 스캔이 이 횟수 이상이면 "점검 대상"
const INTRO_OPTS_ = ['필수', '권장', '선택'];
const DIFF_OPTS_ = ['Very Easy', 'Easy', 'Normal', 'Semi-Hard', 'Hard', 'Extreme'];
const GRADE_OPTS_ = (()=>{ const out=[]; ['S','A','B','C','D','E','F'].forEach(l=>['+','','-'].forEach(m=>out.push(l+m))); return out; })();

let storeList_ = [];
let myProfile_ = null;
let activeStoreCode_ = '';
let ownedGamesMap_ = new Map();   // 게임ID -> { owned, stickers:[{code,label}] }  (현재 매장, 옛 데이터는 colors[])
let gameStatsMap_ = new Map();    // 점검 단위 키(게임ID 또는 게임ID__스티커코드) -> { gameId, stickerCode, totalScans, cycleScans, ... } (현재 매장)
let currentScan_ = null;          // 방금 스캔한 게임 { gameId, sticker, label }
let pageReloader_ = null;
let lastScanLoggedAt_ = {};

function jsq_(v){ return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
/** 사용자가 입력한 글자(게임 이름, 구성품, 메모 등)를 화면 HTML에 넣기 전에 특수문자를 바꿔서,
 *  이름에 < 나 따옴표가 들어가도 화면이 깨지거나 엉뚱한 코드가 실행되지 않게 합니다. */
function escHtml_(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function pad2_(n){ return String(n).padStart(2,'0'); }
function dayKey_(ms){ const d=new Date(ms); return `${d.getFullYear()}-${pad2_(d.getMonth()+1)}-${pad2_(d.getDate())}`; }
function startOfDayMs_(ms){ const d=new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
function endOfDayMs_(ms){ const d=new Date(ms); d.setHours(23,59,59,999); return d.getTime(); }
function fmtDayLabel_(key){
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const w = ['일','월','화','수','목','금','토'][dt.getDay()];
  const todayKey = dayKey_(Date.now()), yKey = dayKey_(Date.now()-86400000);
  const base = `${m}월 ${d}일 (${w})`;
  return key===todayKey ? `오늘 · ${base}` : key===yKey ? `어제 · ${base}` : base;
}
function fmtTime_(ms){ const d=new Date(ms); return `${pad2_(d.getHours())}:${pad2_(d.getMinutes())}`; }
function fmtShortDate_(ms){ if(!ms) return '-'; const d=new Date(ms); return `${d.getMonth()+1}/${d.getDate()}`; }
function gameNameById_(id, fallback){ const g=games.find(x=>String(x.id)===String(id)); return g ? (g.name||'') : (fallback||`(삭제된 게임 ${id})`); }
function matchGameSearch_(g, q){
  if (!q) return true;
  return (g.name||'').includes(q) || String(g.id).includes(q) || (isChosungOnly(q) && getChosung(g.name||'').includes(q));
}

// ---------- 매장 컨텍스트 ----------
async function loadStoreContext_(){
  storeList_ = [];
  try{
    const snap = await getDocs(collection(db, 'stores'));
    snap.forEach(d => storeList_.push({ code: d.id, name: d.data().name || d.id }));
    storeList_.sort((a,b)=> String(a.name).localeCompare(String(b.name), 'ko'));
  }catch(e){ console.warn('매장 목록을 불러오지 못했습니다', e); }
  let code = (myProfile_ && myProfile_.storeCode) || '';
  if (canSwitchStore_()){
    // 본사 계정은 매장을 자유롭게 바꿔 볼 수 있습니다. 마지막으로 본 매장 → 소속 매장 → 첫 번째 매장 순으로 엽니다.
    let remembered = '';
    try{ remembered = localStorage.getItem('rb_active_store') || ''; }catch(e){}
    if (storeList_.some(s=>s.code===remembered)) code = remembered;
    if (!storeList_.some(s=>s.code===code)) code = storeList_.length ? storeList_[0].code : '';
  }else if (!storeList_.some(s=>s.code===code)){
    code = ''; // 소속 매장이 지정되지 않은 계정은 어떤 매장 데이터도 볼 수 없습니다
  }
  activeStoreCode_ = code;
  await loadStoreData_();
}

async function loadStoreData_(){
  ownedGamesMap_ = new Map();
  gameStatsMap_ = new Map();
  if (!activeStoreCode_){ updateMaintBadge_(); return; }
  try{
    const [o, st] = await Promise.all([
      getDocs(collection(db, 'stores', activeStoreCode_, 'ownedGames')),
      getDocs(collection(db, 'stores', activeStoreCode_, 'gameStats')),
    ]);
    o.forEach(d=>ownedGamesMap_.set(d.id, d.data()));
    st.forEach(d=>gameStatsMap_.set(d.id, d.data()));
  }catch(e){ console.warn('매장 데이터를 불러오지 못했습니다 (Firestore 규칙 게시가 필요할 수 있습니다)', e); }
  updateMaintBadge_();
}

/** "처음 이용" 시각: 이 기능 전에 쌓인 단위는 firstScanAt 이 없으므로, 매장 스캔 로그를 오래된 순으로
 *  500건씩 읽어 단위별 가장 이른 스캔 시각을 찾아 채웁니다. 빠진 단위를 다 찾으면 바로 멈추고,
 *  로그에서도 못 찾은 단위는 firstScanUnknown 으로 표시해 다시 찾지 않습니다. (세션당 매장별 1번)
 *  모든 단위가 채워진 뒤에는 아무것도 읽지 않습니다. */
const firstScanBackfillDone_ = new Set();
async function backfillFirstScan_(){
  const code = activeStoreCode_;
  if (!code || firstScanBackfillDone_.has(code)) return false;
  firstScanBackfillDone_.add(code);
  const missing = new Set();
  gameStatsMap_.forEach((v, key)=>{ if (!v.firstScanAt && !v.firstScanUnknown && !v.replacedAt && (v.totalScans||0) > 0) missing.add(key); });
  if (!missing.size) return false;
  const found = new Map();
  try{
    let after = -1;
    for (let page = 0; page < 40 && found.size < missing.size; page++){
      const snap = await getDocs(query(collection(db, 'stores', code, 'scans'), where('ts', '>', after), orderBy('ts', 'asc'), limit(500)));
      if (!snap.docs.length) break;
      snap.forEach(d=>{
        const x = d.data();
        const key = unitKey_(String(x.gameId), x.sticker ? String(x.sticker) : '');
        if (missing.has(key) && !found.has(key) && x.ts) found.set(key, x.ts);
        after = Math.max(after, x.ts || 0);
      });
      if (snap.docs.length < 500) break;
    }
    if (activeStoreCode_ !== code) return false;
    await Promise.all([...missing].map(key=>{
      const patch = found.has(key) ? { firstScanAt: found.get(key) } : { firstScanUnknown: true };
      gameStatsMap_.set(key, { ...(gameStatsMap_.get(key)||{}), ...patch });
      return setDoc(doc(db, 'stores', code, 'gameStats', key), patch, { merge: true });
    }));
    return true;
  }catch(e){ console.warn('처음 이용 날짜를 채우지 못했습니다', e); firstScanBackfillDone_.delete(code); return false; }
}
/** 게임의 처음 이용(첫 스캔) 시각: 스티커별 단위 중 가장 이른 값. 모르면 0 */
function firstScanOf_(gameId, stickerCode){
  let t = 0;
  gameStatsMap_.forEach((v, key)=>{
    if (String(v.gameId || String(key).split('__')[0]) !== String(gameId)) return;
    if (stickerCode != null && String(v.stickerCode||'') !== String(stickerCode)) return;
    if (v.firstScanAt && (!t || v.firstScanAt < t)) t = v.firstScanAt;
  });
  return t;
}
function firstScanText_(ms){ return ms ? `처음 이용 ${dayKey_(ms)}` : ''; }
/** 박스(점검 단위) 하나의 처음 이용 상태 문구 */
function unitFirstText_(gameId, code){
  const st = gameStatsMap_.get(unitKey_(String(gameId), code ? String(code) : ''));
  if (st && st.firstScanAt) return firstScanText_(st.firstScanAt);
  if (st && st.replacedAt) return `${fmtShortDate_(st.replacedAt)} 새 게임으로 교체 · 다음 스캔부터 기록`;
  if (st && (st.totalScans||0) > 0) return '처음 이용 날짜 모름';
  return '아직 스캔 전';
}

/** 새 게임으로 교체: 식별 스티커(또는 게임)는 그대로 쓰되, 그 박스의 "처음 이용" 날짜를 지우고 다음 스캔부터 다시 기록합니다.
 *  새 박스이므로 점검 이후 횟수와 누락·파손 표시도 초기화하고, 점검 이력(checks)에 교체 기록을 남깁니다.
 *  누적 스캔 횟수와 스캔 기록(히스토리·랭킹)은 그대로 둡니다. */
async function replaceUnit_(gameId, code){
  if (!activeStoreCode_) return;
  gameId = String(gameId); code = code ? String(code) : '';
  const key = unitKey_(gameId, code);
  const label = code ? stickerLabel_(gameId, code) : '';
  const name = gameNameById_(gameId) + (label ? ` · ${label}` : '');
  if (!confirm(`"${name}"을(를) 새 게임으로 교체했나요?\n\n이 박스의 처음 이용 날짜를 지우고 다음 스캔부터 다시 기록합니다. 점검 이후 횟수와 누락·파손 표시도 초기화되고, 누적 스캔 기록은 그대로 남습니다.`)) return;
  const st = gameStatsMap_.get(key) || {};
  const now = Date.now();
  const by = (auth.currentUser?.email || '').toLowerCase();
  const patch = { gameId, gameName: gameNameById_(gameId), stickerCode: code || null, stickerLabel: label || null,
    firstScanAt: null, firstScanUnknown: false, replacedAt: now, replacedBy: by,
    cycleScans: 0, flagged: false, flaggedAt: null, flaggedBy: null };
  try{
    await addDoc(collection(db, 'stores', activeStoreCode_, 'gameStats', key, 'checks'), { at: now, by, type: 'replace', cycleScans: st.cycleScans||0, prevFirstScanAt: st.firstScanAt || null });
    await setDoc(doc(db, 'stores', activeStoreCode_, 'gameStats', key), patch, { merge: true });
    gameStatsMap_.set(key, { ...st, ...patch });
    maintCalCache_ = {};
    updateMaintBadge_();
    toast_(`${name}: 새 게임으로 교체했습니다`);
    if (document.getElementById('ownedBody')) renderOwnedList_();
    if (document.getElementById('maintBody')) renderMaintBody_();
  }catch(e){ console.error(e); alert('교체 처리에 실패했습니다. 잠시 후 다시 시도해주세요.'); }
}

/** 모든 매장을 골라 볼 수 있는 본사 계정인지:
 *  권한 관리에서 "전체 매장"을 켠 계정(allStores:true), 직책이 "본사"인 계정, 소속 매장이 없는 편집자 */
function canSwitchStore_(){
  if (!myProfile_) return false;
  return myProfile_.allStores === true || myProfile_.position === '본사' || (myApprovedRole === 'editor' && !myProfile_.storeCode);
}

async function setActiveStore_(code){

  const now = Date.now();
  const units = [];
  gameStatsMap_.forEach((v, id)=>{

    units.push({ id, gid, name: gameNameById_(gid, v.gameName), label, cycle: v.cycleScans||0, total: v.totalScans||0,

  const ago = (ms)=>{ const d = Math.floor((startOfDayMs_(now) - startOfDayMs_(ms)) / 86400000); return d <= 0 ? '오늘' : d === 1 ? '어제' : `${d}일 전`; };
  const doneBtn = (u)=> `<button class="btn btn-primary2 btn-sm" onclick="event.stopPropagation(); completeMaint_('${jsq_(u.id)}')">점검 완료</button>`;
  const guideBtn = (u)=> `<button class="btn btn-ghost2 btn-sm" onclick="event.stopPropagation(); openGameFromHistory_('${jsq_(u.gid)}')" title="반납대 가이드 보기">가이드</button>`;
  const bar = (u)=> `<div class="mini-bar home-bar"><i style="width:${Math.min(100, Math.round(u.cycle/MAINT_THRESHOLD_*100))}%"></i></div>`;

  return `
    <div class="home-hero ${total ? 'alert' : ''}">
      <div class="home-hero-main">
        <div class="home-hero-n">${total}<span>개</span></div>
        <div>
          <div class="home-hero-t">${total ? '지금 점검할 게임' : '지금 점검할 게임이 없습니다 👍'}</div>
          <div class="home-hero-s">${flagged.length ? `⚠ 누락·파손 신고 ${flagged.length}건` : ''}${flagged.length && due.length ? ' · ' : ''}${due.length ? `스캔 ${MAINT_THRESHOLD_}회 이상 ${due.length}개` : ''}${!total && soon.length ? `곧 점검할 게임 ${soon.length}개` : ''}</div>
        </div>
      </div>
      <div class="home-hero-actions">
        <button class="btn btn-ghost2 btn-sm" onclick="openMaintenance_()">🔧 정기 점검 전체</button>
        ${total ? `<button class="btn btn-ghost2 btn-sm" onclick="printMaintenance_()">🖨️ 점검표 출력</button>` : ''}
      </div>
    </div>

    ${flagged.length ? `
    <div class="home-section home-flag">
      <h3>⚠ 누락·파손 신고 <span class="row-sub">스캔 횟수와 상관없이 먼저 점검하세요</span></h3>
      ${flagged.map(u=>`
        <div class="home-unit" onclick="openGameFromHistory_('${jsq_(u.gid)}')">
          <div class="home-unit-main">${unitName(u)}<div class="row-sub">${ago(u.flaggedAt)} 신고${u.cycle ? ` · 점검 이후 ${u.cycle}회 스캔` : ''}</div></div>
          ${guideBtn(u)}${doneBtn(u)}
        </div>`).join('')}
    </div>` : ''}

    ${due.length ? `
    <div class="home-section">
      <h3>🔧 점검 기준 도달 <span class="row-sub">마지막 점검 이후 ${MAINT_THRESHOLD_}회 이상 스캔 · 많이 찍힌 순</span></h3>
      ${due.map(u=>`
        <div class="home-unit" onclick="openGameFromHistory_('${jsq_(u.gid)}')">
          <div class="home-unit-main">${unitName(u)}${bar(u)}<div class="row-sub"><b style="color:var(--accent);">${u.cycle}회</b> / ${MAINT_THRESHOLD_}회 · 마지막 점검 ${u.lastAt ? ago(u.lastAt) : '기록 없음'}</div></div>
          ${guideBtn(u)}${doneBtn(u)}
        </div>`).join('')}
    </div>` : ''}

    <div class="home-grid">
      <div class="home-section">
        <h3>⏳ 곧 점검할 게임 <span class="row-sub">${soonMin}회 이상</span></h3>

          : `<div class="home-empty">곧 점검 기준에 닿는 게임이 없습니다.</div>`}

      <div class="home-section">
        <h3>✅ 최근 점검 완료</h3>

          <div class="home-unit compact" onclick="openGameFromHistory_('${jsq_(u.gid)}')">
            <div class="home-unit-main">${unitName(u)}</div>

    </div>

    ${needSticker.length ? `
    <div class="home-section home-note" onclick="openOwnedGames_('need')">
      <h3 style="margin:0;">🏷️ 식별 스티커 지정 필요 ${needSticker.length}개 <span class="row-sub">2개 이상 보유 게임은 스티커별로 점검을 셉니다</span><span class="home-go">보유 게임 관리 →</span></h3>
    </div>` : ''}`;
}

  try{

// ---------- QR 스캔 기록 + 식별 스티커 ----------
// 같은 게임을 매장에 여러 개 두면 박스마다 식별 스티커(매장이 자유롭게 정한 글자, 예: "빨강", "파랑 하트")를 붙입니다.
// 스티커마다 짧은 숫자 코드(1, 2, 3…)를 매기고, QR에는 게임ID와 이 코드만 담습니다 (스캐너가 한글을 못 보내는 경우 대비).
// 랭킹(인기 게임)은 게임 단위로, 정기 점검은 "게임 + 스티커" 단위로 셉니다.

/** 이 매장에서 이 게임에 등록한 식별 스티커 목록 [{code, label}] (옛 데이터의 colors 배열도 함께 읽습니다) */
function getOwnedStickers_(gameId){
  const o = ownedGamesMap_.get(String(gameId));
  if (!o || o.owned === false) return [];
  if (Array.isArray(o.stickers)) return o.stickers.filter(st=>st && st.code);
  if (Array.isArray(o.colors)) return o.colors.map((name, i)=>({ code: String(i+1), label: name }));
  return [];
}
/** 스티커 코드 → 매장에서 정한 이름. 보유 수량을 0으로 바꿔 둔 게임이어도 정해 둔 이름은 찾아 줍니다.
 *  끝내 못 찾으면 null (화면에는 "#코드"로 표시). */
function findStickerLabel_(gameId, code){
  if (!code) return null;
  const o = ownedGamesMap_.get(String(gameId));
  if (!o) return null;
  const list = Array.isArray(o.stickers) ? o.stickers : Array.isArray(o.colors) ? o.colors.map((name, i)=>({ code: String(i+1), label: name })) : [];
  const st = list.find(x=>x && String(x.code) === String(code));
  return st ? st.label : null;
}
function stickerLabel_(gameId, code){
  if (!code) return '';
  return findStickerLabel_(gameId, code) || `#${code}`;
}
/** 정기 점검을 세는 단위의 키 (스티커가 없으면 게임ID 그대로 — 예전 기록과 호환) */
function unitKey_(gameId, code){ return code ? `${gameId}__${code}` : String(gameId); }

/** QR 스캔 한 번을 기록합니다. 스캔 기록에는 게임ID와 스티커를 남기고(랭킹은 게임 단위로 집계),
 *  점검 카운트(누적/점검 이후)는 "게임 + 스티커" 단위로 1 올립니다. */
function logQrScan_(g, stickerCode){
  const id = String(g.id);
  const code = stickerCode ? String(stickerCode) : '';
  let label = stickerLabel_(id, code);
  const scan = currentScan_ = { gameId:id, sticker:code, label, known: !code || !!findStickerLabel_(id, code) };
  if (!activeStoreCode_) return;
  const unit = unitKey_(id, code);
  const now = Date.now();
  const dup = lastScanLoggedAt_[unit] && now - lastScanLoggedAt_[unit] < 5000; // 새로고침 등으로 겹쳐 기록되는 것 방지
  if (!dup) lastScanLoggedAt_[unit] = now;
  (async ()=>{
    // 반납대 기기는 로그인할 때 보유 게임을 한 번 불러오므로, 그 뒤 다른 기기에서 등록한 스티커는 모를 수 있습니다.
    // 이름을 못 찾으면 이 게임의 보유 정보만 다시 불러와서 스티커 이름으로 바꿔 보여주고 기록합니다.
    if (!scan.known){
      try{
        const snap = await getDoc(doc(db, 'stores', activeStoreCode_, 'ownedGames', id));
        if (snap.exists()) ownedGamesMap_.set(id, snap.data());
        const found = findStickerLabel_(id, code);
        if (found){ label = found; scan.label = found; scan.known = true; refreshScanChips_(); }
      }catch(e){ console.warn('식별 스티커 이름을 다시 불러오지 못했습니다', e); }
    }
    if (dup) return;
    try{
      const by = (auth.currentUser?.email || '').toLowerCase();
      await addDoc(collection(db, 'stores', activeStoreCode_, 'scans'), { gameId:id, gameName:g.name||'', sticker:code||null, color:label||null, ts:now, by });
      const st = gameStatsMap_.get(unit) || { totalScans:0, cycleScans:0 };
      // 처음 스캔되는 단위(또는 새 게임으로 교체한 뒤 첫 스캔)면 "처음 이용" 시각을 남깁니다 (예전 기록이 있는 단위는 스캔 로그에서 따로 채움)
      const first = (!st.firstScanAt && (!(st.totalScans > 0) || st.replacedAt)) ? { firstScanAt: now } : {};
      await setDoc(doc(db, 'stores', activeStoreCode_, 'gameStats', unit),
        { gameId:id, gameName:g.name||'', stickerCode:code||null, stickerLabel:label||null, totalScans:increment(1), cycleScans:increment(1), lastScanAt:now, ...first }, { merge:true });
      gameStatsMap_.set(unit, { ...st, ...first, gameId:id, gameName:g.name||'', stickerCode:code||null, stickerLabel:label||null, totalScans:(st.totalScans||0)+1, cycleScans:(st.cycleScans||0)+1, lastScanAt:now });
      updateMaintBadge_();
    }catch(e){ console.warn('스캔 기록 저장 실패 (Firestore 규칙 게시가 필요할 수 있습니다)', e); }
  })();
}

/** 방금 스캔한 박스의 식별 스티커 이름을 게임 이름 바로 오른쪽에 보여줍니다 (QR에 들어 있으므로 따로 고를 필요 없음). */
function scanChipsHtml_(g){
  if (!g || !currentScan_ || currentScan_.gameId !== String(g.id) || !currentScan_.sticker) return '';
  if (!currentScan_.known) return `<span class="sc-sticker unknown" title="이 매장의 보유 게임 관리에 없는 스티커 번호입니다">🏷️ 미등록 스티커 #${escHtml_(currentScan_.sticker)}</span>`;
  return `<span class="sc-sticker" title="스캔한 박스의 식별 스티커">🏷️ ${escHtml_(currentScan_.label)}</span>`;
}
function refreshScanChips_(){
  const slot = document.getElementById('scanChipsSlot');
  if (slot) slot.innerHTML = scanChipsHtml_(games.find(x=>x.id===currentGameId));
  refreshReportBtn_();
}

async function fetchScans_(fromMs, toMs){
  const q = query(collection(db, 'stores', activeStoreCode_, 'scans'),
    where('ts', '>=', fromMs), where('ts', '<=', toMs), orderBy('ts', 'desc'));
  const snap = await getDocs(q);
  const out = [];
  snap.forEach(d=>out.push({ id:d.id, ...d.data() }));
  return out;
}

function pageHeadHtml_(title, desc){
  return `<div class="pg-head"><h2>${title}</h2>${desc?`<p class="pg-desc">${desc}</p>`:''}</div>`;
}

            </div>

function setHistRange_(d){ histRangeDays_ = d; openScanHistory_(); }

// ---------- 랭킹 ----------
let rankRange_ = 'week';
let rankFrom_ = '', rankTo_ = '';
let rankSelected_ = null;
let rankScans_ = [];
let rankSpan_ = null;

function computeRankSpan_(){
  const now = Date.now();
  if (rankRange_ === 'today') return { from: startOfDayMs_(now), to: now };
  if (rankRange_ === 'month'){ const d=new Date(now); return { from: new Date(d.getFullYear(), d.getMonth(), 1).getTime(), to: now }; }
  if (rankRange_ === 'custom'){
    const f = rankFrom_ ? new Date(rankFrom_+'T00:00:00').getTime() : startOfDayMs_(now);
    const t = rankTo_ ? new Date(rankTo_+'T23:59:59').getTime() : endOfDayMs_(now);
    return { from: f, to: Math.max(f, t) };
  }
  return { from: startOfDayMs_(now - 6*86400000), to: now };
}
async function openScanRanking_(){
  if (!prepPage_('more', openScanRanking_)) return;
  const dayStr = dayKey_(Date.now());
  if (!rankFrom_) rankFrom_ = dayKey_(Date.now()-6*86400000);
  if (!rankTo_) rankTo_ = dayStr;
  appEl.innerHTML = `
    ${pageHeadHtml_('🏆 랭킹', '선택한 기간 동안 QR로 많이 찍힌 게임 순위입니다. 게임을 누르면 날짜별 이용 횟수 그래프가 나옵니다.')}
    <div class="st-bar">
      ${storeBarHtml_()}
      ${[['today','오늘'],['week','최근 7일'],['month','이번 달'],['custom','기간 설정']].map(([k,l])=>`<button class="chip-btn ${rankRange_===k?'on':''}" onclick="setRankRange_('${k}')">${l}</button>`).join('')}
    </div>
    ${rankRange_==='custom' ? `<div class="st-bar"><input type="date" value="${rankFrom_}" onchange="setRankCustom_('from', this.value)"> ~ <input type="date" value="${rankTo_}" onchange="setRankCustom_('to', this.value)"></div>` : ''}
    <div id="rankBody"><p style="padding:20px 4px;">불러오는 중...</p></div>`;
  const body = document.getElementById('rankBody');
  if (!activeStoreCode_){ body.innerHTML = noStoreHtml_(); return; }
  try{
    rankSpan_ = computeRankSpan_();
    rankScans_ = await fetchScans_(rankSpan_.from, rankSpan_.to);
    renderRankBody_();
  }catch(e){
    console.error(e);
    body.innerHTML = `<div class="empty">기록을 불러오지 못했습니다.<br><span style="font-size:12px;">(Firestore 규칙에 새 항목이 게시되어 있는지 확인해주세요)</span></div>`;
  }
}
function setRankRange_(k){ rankRange_ = k; rankSelected_ = null; openScanRanking_(); }
function setRankCustom_(which, v){ if (which==='from') rankFrom_ = v; else rankTo_ = v; rankSelected_ = null; openScanRanking_(); }
function selectRankGame_(id){ rankSelected_ = rankSelected_ === id ? null : id; renderRankBody_(); }

function renderRankBody_(){
  const body = document.getElementById('rankBody');
  if (!body) return;
  const agg = new Map();
  rankScans_.forEach(s=>{
    const a = agg.get(s.gameId) || { id:s.gameId, name:s.gameName, count:0 };
    a.count++; agg.set(s.gameId, a);
  });
  const rows = [...agg.values()].sort((a,b)=> b.count - a.count || String(a.name).localeCompare(String(b.name),'ko'));
  const max = rows.length ? rows[0].count : 1;
  body.innerHTML = `
    <div class="stat-row">
      <div class="stat-box"><div class="n">${rankScans_.length}회</div><div class="l">기간 내 총 스캔</div></div>
      <div class="stat-box"><div class="n">${rows.length}개</div><div class="l">이용된 게임 수</div></div>
      <div class="stat-box"><div class="n" style="font-size:15px; line-height:1.5;">${rows.length ? escHtml_(gameNameById_(rows[0].id, rows[0].name)) : '-'}</div><div class="l">가장 많이 이용된 게임</div></div>
    </div>
    ${rows.length ? rows.map((r,i)=>`
      <div class="row-card clickable" onclick="selectRankGame_('${jsq_(r.id)}')" style="${rankSelected_===r.id?'border-color:var(--accent);':''}">
        <div class="row-top">
          <div style="width:24px; text-align:center; font-weight:800; color:${i===0?'var(--accent)':'var(--ink-soft)'};">${i+1}</div>
          <div style="flex:1; min-width:0;"><div class="row-name">${escHtml_(gameNameById_(r.id, r.name))}</div><div class="mini-bar"><i style="width:${Math.round(r.count/max*100)}%"></i></div></div>
          <div style="font-weight:800;">${r.count}회</div>
        </div>
        ${rankSelected_===r.id ? rankTrendHtml_(r.id) : ''}
      </div>`).join('') : `<div class="empty">이 기간에는 스캔 기록이 없습니다.</div>`}`;
}

function rankTrendHtml_(gameId){
  const { from, to } = rankSpan_;
  const days = Math.max(1, Math.round((startOfDayMs_(to) - startOfDayMs_(from)) / 86400000) + 1);
  const weekly = days > 31;
  const step = weekly ? 7 : 1;
  const n = Math.ceil(days / step);
  const buckets = new Array(n).fill(0);
  rankScans_.filter(s=>s.gameId===gameId).forEach(s=>{
    const di = Math.round((startOfDayMs_(s.ts) - startOfDayMs_(from)) / 86400000);
    const bi = Math.min(n-1, Math.max(0, Math.floor(di / step)));
    buckets[bi]++;
  });
  const m = Math.max(...buckets, 1);
  const labelEvery = n > 14 ? Math.ceil(n/7) : 1;
  return `
    <div style="margin-top:10px; padding-top:8px; border-top:1px dashed var(--line);" onclick="event.stopPropagation()">
      <div class="row-sub">${weekly?'주별':'일별'} 이용 횟수 · 합계 ${buckets.reduce((a,b)=>a+b,0)}회</div>
      <div class="trend">
        ${buckets.map((v,i)=>{
          const d = new Date(startOfDayMs_(from) + i*step*86400000);
          const lb = (i % labelEvery === 0) ? `${d.getMonth()+1}/${d.getDate()}` : '';
          return `<div class="tb" title="${d.getMonth()+1}/${d.getDate()} · ${v}회"><i class="${v===m&&v>0?'hi':''}" style="height:${Math.round(v/m*80)}%"></i><span>${lb}</span></div>`;
        }).join('')}
      </div>
    </div>`;
}

// ---------- 안 쓰이는 게임 ----------
// 보유 중인데 정한 기간 동안 QR 스캔이 한 번도 없는 게임을 찾아, 진열 위치를 바꾸거나 진열에서 뺄 게임을 고를 때 씁니다.
// 매장 gameStats 의 lastScanAt(마지막 스캔 시각)만 보므로 추가로 읽는 문서가 없습니다.
let idleDays_ = 30;
function setIdleDays_(n){ idleDays_ = n; openIdleGames_(); }

function idleGameRows_(days){
  const cutoff = Date.now() - days*86400000;
  const byGame = new Map(); // gameId -> { last, total, units: Map(stickerCode -> last) }
  gameStatsMap_.forEach((v, key)=>{
    const gid = String(v.gameId || String(key).split('__')[0]);
    const g = byGame.get(gid) || { last: 0, total: 0, units: new Map() };
    const last = Number(v.lastScanAt) || 0;
    g.last = Math.max(g.last, last);
    g.total += Number(v.totalScans) || 0;
    if (v.stickerCode) g.units.set(String(v.stickerCode), Math.max(g.units.get(String(v.stickerCode)) || 0, last));
    byGame.set(gid, g);
  });
  const idle = [], never = [], spare = [];
  games.forEach(game=>{
    const id = String(game.id);
    const qty = ownedQty_(id);
    if (!qty) return;
    const st = byGame.get(id);
    const row = { id, name: game.name || '(이름 없음)', qty, last: st ? st.last : 0, total: st ? st.total : 0 };
    if (!st || (!st.last && !st.total)) { never.push(row); return; }
    if (st.last < cutoff){ idle.push(row); return; }
    // 여러 개 보유한 게임: 기간 안에 찍힌 스티커가 보유 수량보다 적으면 "여분"으로 알려줍니다 (스티커로 구분된 것만 셈)
    const stickers = getOwnedStickers_(id);
    if (qty >= 2 && stickers.length >= 2){
      const unused = stickers.filter(x => (st.units.get(String(x.code)) || 0) < cutoff);
      if (unused.length && unused.length < stickers.length) spare.push({ ...row, unused: unused.map(x=>x.label || `#${x.code}`), used: stickers.length - unused.length });
    }
  });
  idle.sort((a,b)=> (a.last - b.last) || a.name.localeCompare(b.name, 'ko'));
  never.sort((a,b)=> a.name.localeCompare(b.name, 'ko'));
  spare.sort((a,b)=> b.unused.length - a.unused.length || a.name.localeCompare(b.name, 'ko'));
  return { idle, never, spare };
}

async function openIdleGames_(){
  if (!prepPage_('more', openIdleGames_)) return;
  appEl.innerHTML = `
    ${pageHeadHtml_('💤 안 쓰이는 게임', '보유 중인데 선택한 기간 동안 QR로 한 번도 찍히지 않은 게임입니다. 진열 위치를 바꾸거나 진열에서 뺄 게임을 고를 때 참고하세요. 게임을 누르면 가이드로 이동합니다.')}
    <div class="st-bar">
      ${storeBarHtml_()}
      ${[30, 60, 90].map(n=>`<button class="chip-btn ${idleDays_===n?'on':''}" onclick="setIdleDays_(${n})">최근 ${n}일</button>`).join('')}
    </div>
    <div id="idleBody"><p style="padding:20px 4px;">불러오는 중...</p></div>`;
  const body = document.getElementById('idleBody');
  if (!activeStoreCode_){ body.innerHTML = noStoreHtml_(); return; }
  await loadStoreData_();

  if (!ownedCount){ body.innerHTML = `<div class="empty">이 매장에 보유 게임으로 등록된 게임이 없습니다. 더보기 → 🗂️ 보유 게임 관리에서 먼저 등록해주세요.</div>`; return; }
  const { idle, never, spare } = idleGameRows_(idleDays_);
  const ago = ms => Math.floor((Date.now() - ms) / 86400000);
  const row = (r, sub) => `
    <div class="row-card clickable" onclick="openGame('${jsq_(r.id)}')">
      <div class="row-top">
        <div style="flex:1; min-width:0;">

          <div class="row-sub">${sub}</div>
        </div>
      </div>
    </div>`;
  body.innerHTML = `
    <div class="stat-row">
      <div class="stat-box"><div class="row-sub">${idleDays_}일 넘게 이용 없음</div><div class="n">${idle.length}개</div></div>
      <div class="stat-box"><div class="row-sub">스캔 기록 없음</div><div class="n">${never.length}개</div></div>
      <div class="stat-box"><div class="row-sub">보유 게임</div><div class="n" style="color:var(--ink);">${ownedCount}개</div></div>
    </div>
    <h3 style="font-size:14px; margin:4px 0 8px;">💤 ${idleDays_}일 넘게 이용 없음 <span class="row-sub">오래된 순</span></h3>
    ${idle.length ? idle.map(r=>row(r, (r.last ? `마지막 이용 <b style="color:var(--ink);">${dayKey_(r.last)}</b> (${ago(r.last)}일 전) · 누적 ${r.total}회` : `마지막 이용 날짜 기록 없음 · 누적 ${r.total}회`) + (firstScanOf_(r.id) ? ` · ${firstScanText_(firstScanOf_(r.id))}` : ''))).join('')
      : `<div class="empty">최근 ${idleDays_}일 동안 이용 기록이 없는 보유 게임이 없습니다.</div>`}
    ${spare.length ? `
    <h3 style="font-size:14px; margin:18px 0 8px;">📦 여분이 남는 게임 <span class="row-sub">여러 개 보유 중 ${idleDays_}일 동안 일부만 이용</span></h3>
    ${spare.map(r=>row(r, `${firstScanOf_(r.id) ? `${firstScanText_(firstScanOf_(r.id))} · ` : ''}${r.qty}개 중 ${r.used}개만 이용 · 이용 없는 스티커 ${r.unused.map(l=>`<span class="sc-sticker">🏷️ ${escHtml_(l)}</span>`).join(' ')}`)).join('')}` : ''}
    ${never.length ? `
    <h3 style="font-size:14px; margin:18px 0 8px;">❔ 스캔 기록 없음 <span class="row-sub">QR 라벨을 아직 안 붙였거나 새로 들어온 게임일 수 있습니다</span></h3>
    ${never.map(r=>row(r, '아직 QR로 찍힌 기록이 없습니다')).join('')}` : ''}`;
}

// ---------- 정기 점검 ----------
let maintShowAll_ = false;
let maintOpen_ = null;
let maintView_ = 'list';      // 'list' | 'calendar'
let maintCalMonth_ = null;    // 달력에 보이는 달의 1일 (ms)
let maintCalDay_ = null;      // 달력에서 고른 날짜 'YYYY-MM-DD'
let maintCalCache_ = {};      // `${매장}|${월}` -> 그 달의 이벤트 목록

function getMaintRows_(){
  const rows = [];
  gameStatsMap_.forEach((v, id)=>{
    if (!v.flagged && (v.cycleScans||0) <= 0 && !(maintShowAll_ && (v.totalScans||0) > 0)) return;
    const gid = v.gameId || id;
    const label = v.stickerCode ? (getOwnedStickers_(gid).find(x=>x.code===String(v.stickerCode))?.label || v.stickerLabel || `#${v.stickerCode}`) : '';
    const gname = gameNameById_(gid, v.gameName);
    rows.push({ id, gameName: gname, sticker: label, name: gname + (label ? ` · ${label}` : ''), cycle: v.cycleScans||0, total: v.totalScans||0, last: v.lastCheckedAt||0, first: v.firstScanAt||0, gid: String(gid), code: v.stickerCode ? String(v.stickerCode) : '', memo: v.memo||'', flagged: !!v.flagged, flaggedAt: v.flaggedAt||0 });
  });
  // 누락·파손 신고된 게임은 스캔 횟수와 상관없이 맨 위에, 그다음 많이 찍힌 순
  rows.sort((a,b)=> (b.flagged - a.flagged) || (b.flagged ? b.flaggedAt - a.flaggedAt : 0) || b.cycle - a.cycle || b.total - a.total);
  return maintShowAll_ ? rows : rows.filter(r=>r.flagged || r.cycle >= MAINT_THRESHOLD_);
}

async function openMaintenance_(){
  if (!prepPage_('maint', openMaintenance_)) return;
  maintCalCache_ = {};
  appEl.innerHTML = `${pageHeadHtml_('🔧 정기 점검', `마지막 점검 이후 QR로 ${MAINT_THRESHOLD_}회 이상 찍힌 게임이 자동으로 점검 대상이 되고, 많이 찍힌 순서로 정렬됩니다. 같은 게임을 여러 개 운영하면 식별 스티커별로 따로 셉니다. 게임을 누르면 메모와 점검 이력이 보입니다.`)}
    <div class="st-bar">${storeBarHtml_()}</div><div id="maintBody"><p style="padding:20px 4px;">불러오는 중...</p></div>`;
  if (!activeStoreCode_){ document.getElementById('maintBody').innerHTML = noStoreHtml_(); return; }
  await loadStoreData_();
  renderMaintBody_();
  if (await backfillFirstScan_()) renderMaintBody_();
}

function renderMaintBody_(){
  const body = document.getElementById('maintBody');
  if (!body) return;
  if (maintView_ === 'calendar'){ renderMaintCalendar_(); return; }
  const rows = getMaintRows_();
  const maxCycle = Math.max(MAINT_THRESHOLD_, ...rows.map(r=>r.cycle));
  body.innerHTML = `
    <div class="st-bar">
      <span style="font-size:13px; color:var(--ink-soft);">점검 대상 <b style="color:var(--accent);">${[...gameStatsMap_.values()].filter(v=>v.flagged || (v.cycleScans||0)>=MAINT_THRESHOLD_).length}</b>개 · 기준 ${MAINT_THRESHOLD_}회 이상 또는 ⚠ 누락·파손 신고</span>
      <label style="display:flex; align-items:center; gap:5px; font-size:12.5px; cursor:pointer;"><input type="checkbox" ${maintShowAll_?'checked':''} onchange="toggleMaintShowAll_(this.checked)"> ${MAINT_THRESHOLD_}회 미만도 보기</label>
      <span style="flex:1;"></span>
      <button class="btn btn-ghost2 btn-sm" onclick="setMaintView_('calendar')" title="지난 점검 기록을 달력으로 보기">📅 달력</button>
      <button class="btn btn-ghost2 btn-sm" onclick="printMaintenance_()">🖨️ A4 출력</button>
    </div>
    ${rows.length ? rows.map((r,i)=>`
      <div class="row-card clickable" onclick="toggleMaintDetail_('${jsq_(r.id)}')" style="${maintOpen_===r.id?'border-color:var(--accent);':''}">
        <div class="row-top">
          <div style="width:24px; text-align:center; font-weight:800; color:${r.flagged || r.cycle>=MAINT_THRESHOLD_?'var(--accent)':'var(--ink-soft)'};">${r.flagged ? '⚠' : i+1}</div>
          <div style="flex:1; min-width:0;">
            <div class="row-name" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">${escHtml_(r.gameName)}${r.sticker ? ` <span class="sc-sticker" title="식별 스티커">🏷️ ${escHtml_(r.sticker)}</span>` : ''}${r.flagged ? ` <span class="mini-badge warn" style="white-space:nowrap;">⚠ 누락·파손 ${fmtShortDate_(r.flaggedAt)}</span>` : ''}</div>
            <div class="mini-bar"><i style="width:${Math.round(r.cycle/maxCycle*100)}%"></i></div>
            <div class="row-sub">점검 이후 <b style="color:var(--ink);">${r.cycle}회</b> · 누적 ${r.total}회 · 마지막 점검 ${fmtShortDate_(r.last)}${r.first ? ` · ${firstScanText_(r.first)}` : ''}</div>
          </div>
          <button class="btn btn-primary2 btn-sm" onclick="event.stopPropagation(); completeMaint_('${jsq_(r.id)}')">점검 완료</button>
        </div>
        ${maintOpen_===r.id ? `
          <div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);" onclick="event.stopPropagation()">
            <div class="row-sub" style="margin-bottom:5px; font-weight:700;">📝 메모</div>
            <textarea style="width:100%; min-height:70px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; font-family:var(--sans); resize:vertical;" placeholder="점검하면서 확인한 내용을 적어주세요 (예: 타일 2장 마모)" onchange="saveMaintMemo_('${jsq_(r.id)}', this.value)">${escHtml_(r.memo)}</textarea>
            <div class="row-sub" style="margin:10px 0 5px; font-weight:700;">점검 이력</div>
            <div id="maintHist" class="row-sub">불러오는 중...</div>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px;">
              <span class="row-sub" style="flex:1;">${escHtml_(unitFirstText_(r.gid, r.code))}</span>
              <button class="chip-btn" onclick="replaceUnit_('${jsq_(r.gid)}','${jsq_(r.code)}')">🔁 새 게임으로 교체</button>
            </div>
          </div>` : ''}
      </div>`).join('') : `<div class="empty">${maintShowAll_?'스캔 기록이 있는 게임이 없습니다.':`점검 대상(${MAINT_THRESHOLD_}회 이상 또는 누락·파손 신고)인 게임이 아직 없습니다.`}</div>`}`;
  if (maintOpen_) loadMaintHistory_(maintOpen_);
}
function toggleMaintShowAll_(v){ maintShowAll_ = v; renderMaintBody_(); }
function toggleMaintDetail_(id){ maintOpen_ = maintOpen_ === id ? null : id; renderMaintBody_(); }

async function loadMaintHistory_(id){
  const el = document.getElementById('maintHist');
  if (!el) return;
  try{
    const q = query(collection(db, 'stores', activeStoreCode_, 'gameStats', id, 'checks'), orderBy('at', 'desc'), limit(8));
    const snap = await getDocs(q);
    const list = []; snap.forEach(d=>list.push(d.data()));
    const el2 = document.getElementById('maintHist');
    if (!el2 || maintOpen_ !== id) return;
    el2.innerHTML = list.length ? list.map(c=> c.type === 'replace'
      ? `<div style="padding:5px 0; border-bottom:1px solid var(--line);"><b style="color:var(--ink);">${dayKey_(c.at)}</b> · 🔁 새 게임으로 교체${c.by?` · ${escHtml_(String(c.by).split('@')[0])}`:''}</div>`
      : `<div style="padding:5px 0; border-bottom:1px solid var(--line);"><b style="color:var(--ink);">${dayKey_(c.at)}</b> · 점검 직전 ${c.cycleScans||0}회${c.by?` · ${escHtml_(String(c.by).split('@')[0])}`:''}${c.memo?`<div style="white-space:pre-wrap; margin-top:2px;">${escHtml_(c.memo)}</div>`:''}</div>`).join('') : '아직 점검 이력이 없습니다.';
  }catch(e){ el.textContent = '이력을 불러오지 못했습니다.'; }
}

// ---------- 정기 점검 달력 ----------
// 점검을 완료할 때마다 gameStats/{단위}/checks 에 남는 기록을 달력으로 모아 보여줍니다.
// 점검한 적이 있는 단위(lastCheckedAt 있음)만 그 달 범위로 조회하고, 달마다 한 번만 불러옵니다.
function setMaintView_(v){
  maintView_ = v;
  if (v === 'calendar' && !maintCalMonth_){ const d = new Date(); maintCalMonth_ = new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
  renderMaintBody_();
}
function moveMaintCal_(delta){
  const d = new Date(maintCalMonth_);
  maintCalMonth_ = delta === 0 ? new Date(new Date().getFullYear(), new Date().getMonth(), 1).getTime() : new Date(d.getFullYear(), d.getMonth() + delta, 1).getTime();
  maintCalDay_ = null;
  renderMaintCalendar_();
}
function pickMaintCalDay_(key){ maintCalDay_ = maintCalDay_ === key ? null : key; renderMaintCalendar_(); }

function maintUnitInfo_(id, v){
  v = v || gameStatsMap_.get(id) || {};
  const gid = v.gameId || String(id).split('__')[0];
  const label = v.stickerCode ? (getOwnedStickers_(gid).find(x=>x.code===String(v.stickerCode))?.label || v.stickerLabel || `#${v.stickerCode}`) : '';
  return { gid, gameName: gameNameById_(gid, v.gameName), sticker: label };
}

async function loadMaintCalEvents_(monthStart){
  const key = `${activeStoreCode_}|${monthStart}`;
  if (maintCalCache_[key]) return maintCalCache_[key];
  const d = new Date(monthStart);
  const from = monthStart, to = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime() - 1;
  const events = [];
  const units = [...gameStatsMap_.entries()].filter(([, v]) => (v.lastCheckedAt||0) >= from || (v.replacedAt||0) >= from);
  const lists = await Promise.all(units.map(async ([id, v]) => {
    const snap = await getDocs(query(collection(db, 'stores', activeStoreCode_, 'gameStats', id, 'checks'), where('at', '>=', from), where('at', '<=', to)));
    const out = [];
    snap.forEach(c => out.push({ id, ...maintUnitInfo_(id, v), ...c.data() }));
    return out;
  }));
  lists.flat().forEach(c => {
    if ((c.at||0) < from || (c.at||0) > to) return;
    if (c.type === 'replace'){ events.push({ type: 'replace', at: c.at, id: c.id, gid: c.gid, gameName: c.gameName, sticker: c.sticker, by: c.by || '' }); return; }
    events.push({ type: 'check', at: c.at, id: c.id, gid: c.gid, gameName: c.gameName, sticker: c.sticker, by: c.by || '', cycle: c.cycleScans || 0, memo: c.memo || '', wasFlagged: !!c.flagged });
    // 점검으로 해결된 누락·파손 신고도 신고한 날짜에 표시합니다
    if (c.flagged && c.flaggedAt >= from && c.flaggedAt <= to) events.push({ type: 'flag', at: c.flaggedAt, id: c.id, gid: c.gid, gameName: c.gameName, sticker: c.sticker, resolvedAt: c.at });
  });
  // 아직 점검하지 않은 신고
  gameStatsMap_.forEach((v, id) => {
    if (v.flagged && v.flaggedAt >= from && v.flaggedAt <= to) events.push({ type: 'flag', at: v.flaggedAt, id, ...maintUnitInfo_(id, v), by: v.flaggedBy || '', open: true });
  });
  events.sort((a, b) => b.at - a.at);
  maintCalCache_[key] = events;
  return events;
}

async function renderMaintCalendar_(){
  const body = document.getElementById('maintBody');
  if (!body) return;
  const month = maintCalMonth_;
  const d0 = new Date(month);
  const head = `
    <div class="st-bar">
      <button class="btn btn-ghost2 btn-sm" onclick="setMaintView_('list')">← 점검 목록</button>
      <span style="flex:1;"></span>
      <button class="chip-btn" onclick="moveMaintCal_(-1)" title="이전 달">◀</button>
      <b style="font-size:15px; min-width:96px; text-align:center;">${d0.getFullYear()}년 ${d0.getMonth()+1}월</b>
      <button class="chip-btn" onclick="moveMaintCal_(1)" title="다음 달">▶</button>
      <button class="chip-btn" onclick="moveMaintCal_(0)">이번 달</button>
    </div>`;
  const key = `${activeStoreCode_}|${month}`;
  if (!maintCalCache_[key]) body.innerHTML = head + '<p style="padding:20px 4px;">불러오는 중...</p>';
  let events;
  try{ events = await loadMaintCalEvents_(month); }
  catch(e){ console.error(e); body.innerHTML = head + '<div class="empty">점검 기록을 불러오지 못했습니다.</div>'; return; }
  if (maintView_ !== 'calendar' || maintCalMonth_ !== month || !document.getElementById('maintBody')) return;

  const byDay = {};
  events.forEach(ev => { (byDay[dayKey_(ev.at)] = byDay[dayKey_(ev.at)] || []).push(ev); });
  const checks = events.filter(e => e.type === 'check');
  const flags = events.filter(e => e.type === 'flag');
  const todayKey = dayKey_(Date.now());
  const firstWd = d0.getDay();
  const days = new Date(d0.getFullYear(), d0.getMonth() + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstWd; i++) cells.push('<div class="mc-day out"></div>');
  for (let n = 1; n <= days; n++){
    const k = dayKey_(new Date(d0.getFullYear(), d0.getMonth(), n).getTime());
    const evs = byDay[k] || [];
    const c = evs.filter(e => e.type === 'check').length, f = evs.filter(e => e.type === 'flag').length, rp = evs.filter(e => e.type === 'replace').length;
    cells.push(`<button class="mc-day ${k===todayKey?'today':''} ${k===maintCalDay_?'sel':''}" data-day="${k}" onclick="pickMaintCalDay_('${k}')">
      <span class="mc-n">${n}</span>
      ${c ? `<span class="mc-tag ok" title="점검 완료 ${c}건">✔ ${c}</span>` : ''}
      ${f ? `<span class="mc-tag warn" title="누락·파손 신고 ${f}건">⚠ ${f}</span>` : ''}
      ${rp ? `<span class="mc-tag rep" title="새 게임으로 교체 ${rp}건">🔁 ${rp}</span>` : ''}
    </button>`);
  }
  const who = e => e.by ? escHtml_(String(e.by).split('@')[0]) : '';
  const evRow = e => {
    const name = `${escHtml_(e.gameName)}${e.sticker ? ` <span class="sc-sticker">🏷️ ${escHtml_(e.sticker)}</span>` : ''}`;
    if (e.type === 'replace') return `<div class="row-card clickable" onclick="openGame('${jsq_(e.gid)}')">
        <div class="row-name" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;"><span class="mini-badge">🔁 새 게임으로 교체</span> ${name}</div>
        <div class="row-sub">${fmtTime_(e.at)}${who(e) ? ` · ${who(e)}` : ''} · 처음 이용 날짜 초기화</div>
      </div>`;
    if (e.type === 'flag') return `<div class="row-card clickable" onclick="openGame('${jsq_(e.gid)}')">
        <div class="row-name" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;"><span class="mini-badge warn">⚠ 누락·파손 신고</span> ${name}</div>
        <div class="row-sub">${fmtTime_(e.at)}${who(e) ? ` · ${who(e)}` : ''} · ${e.open ? '<b style="color:var(--accent);">아직 점검 전</b>' : `${fmtShortDate_(e.resolvedAt)} 점검으로 해결`}</div>
      </div>`;
    return `<div class="row-card clickable" onclick="openGame('${jsq_(e.gid)}')">
        <div class="row-name" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;"><span class="mini-badge" style="background:var(--done-bg); border-color:var(--done-line);">✔ 점검 완료</span> ${name}${e.wasFlagged ? ' <span class="mini-badge warn">신고 처리</span>' : ''}</div>
        <div class="row-sub">${fmtTime_(e.at)}${who(e) ? ` · ${who(e)}` : ''} · 점검 직전 ${e.cycle}회 사용</div>
        ${e.memo ? `<div class="row-sub" style="white-space:pre-wrap; margin-top:3px; color:var(--ink);">📝 ${escHtml_(e.memo)}</div>` : ''}
      </div>`;
  };
  const listEvents = maintCalDay_ ? (byDay[maintCalDay_] || []) : events;
  const games = new Set(checks.map(e => e.gid)).size;
  body.innerHTML = head + `
    <div class="stat-row">
      <div class="stat-box"><div class="row-sub">${d0.getMonth()+1}월 점검 완료</div><div class="n">${checks.length}건</div></div>
      <div class="stat-box"><div class="row-sub">점검한 게임</div><div class="n">${games}개</div></div>
      <div class="stat-box"><div class="row-sub">누락·파손 신고</div><div class="n">${flags.length}건</div></div>
    </div>
    <div class="mc-grid">${['일','월','화','수','목','금','토'].map(w=>`<div class="mc-wd">${w}</div>`).join('')}${cells.join('')}</div>
    <div class="row-sub" style="margin:8px 0 14px;">✔ 점검 완료 · ⚠ 누락·파손 신고 · 🔁 새 게임으로 교체 — 날짜를 누르면 그날 기록만 봅니다.</div>
    <h3 style="font-size:14px; margin:0 0 8px;">${maintCalDay_ ? escHtml_(fmtDayLabel_(maintCalDay_)) : `${d0.getMonth()+1}월 전체 기록`} <span class="row-sub">${listEvents.length}건</span>${maintCalDay_ ? ` <button class="chip-btn" style="margin-left:6px;" onclick="pickMaintCalDay_('${maintCalDay_}')">전체 보기</button>` : ''}</h3>
    <div id="maintCalList">${listEvents.length ? listEvents.map(evRow).join('') : `<div class="empty">${maintCalDay_ ? '이 날은 점검 기록이 없습니다.' : '이 달에는 점검 기록이 없습니다.'}</div>`}</div>`;
}

async function saveMaintMemo_(id, val){
  try{
    await setDoc(doc(db, 'stores', activeStoreCode_, 'gameStats', id), { memo: val, memoUpdatedAt: Date.now() }, { merge: true });
    const st = gameStatsMap_.get(id) || {};
    gameStatsMap_.set(id, { ...st, memo: val });
  }catch(e){ alert('메모를 저장하지 못했습니다. 잠시 후 다시 시도해주세요.'); }
}

/** 점검 완료: "점검 이후 횟수"만 0으로 되돌립니다. 누적 횟수와 스캔 기록(히스토리·랭킹)은 그대로 남습니다. */
async function completeMaint_(id){
  const st = gameStatsMap_.get(id) || {};
  const name = (getMaintRows_().find(r=>r.id===id) || {}).name || gameNameById_(st.gameId || id, st.gameName);
  if (!confirm(`"${name}" 점검을 완료 처리할까요?\n\n점검 이후 횟수와 누락·파손 표시만 초기화되고, 누적 스캔 기록(히스토리·랭킹)은 그대로 유지됩니다.`)) return;
  const now = Date.now();
  const by = (auth.currentUser?.email || '').toLowerCase();
  try{
    await addDoc(collection(db, 'stores', activeStoreCode_, 'gameStats', id, 'checks'), { at: now, by, cycleScans: st.cycleScans||0, memo: st.memo||'', ...(st.flagged ? { flagged: true, flaggedAt: st.flaggedAt||null } : {}) });
    await setDoc(doc(db, 'stores', activeStoreCode_, 'gameStats', id), { cycleScans: 0, lastCheckedAt: now, lastCheckedBy: by, flagged: false, flaggedAt: null, flaggedBy: null }, { merge: true });
    gameStatsMap_.set(id, { ...st, cycleScans: 0, lastCheckedAt: now, lastCheckedBy: by, flagged: false, flaggedAt: null, flaggedBy: null });

// ---------- 보유 게임 관리 ----------
// 매장마다 보유 수량(qty)을 관리합니다. 같은 게임이 2개 이상이면 박스마다 식별 스티커가 필요하므로,
// 수량만큼 스티커가 정해지지 않은 게임은 "스티커 지정 필요"로 모아 보여줍니다.
// 수량은 엑셀(전체 게임 목록 양식)로 한 번에 올릴 수 있고, 스티커 값은 이 화면에서만 정합니다.
let ownedSearch_ = '';
let ownedPickerFor_ = null;
let ownedFilter_ = 'all'; // 'all' | 'owned' | 'need'
let ownedXlsxParsed_ = null; // 엑셀 업로드 미리보기
function setOwnedSearch_(v){ ownedSearch_ = v; renderOwnedList_(); }
function setOwnedFilter_(v){ ownedFilter_ = v; renderOwnedList_(); }

/** 이 매장의 보유 수량. 수량을 따로 저장하기 전의 기록은 "보유 = 1개, 스티커가 더 많으면 스티커 수"로 봅니다. */
function ownedQty_(gameId){
  const o = ownedGamesMap_.get(String(gameId));
  if (!o || o.owned === false) return 0;
  if (typeof o.qty === 'number') return o.qty;
  return Math.max(1, getOwnedStickers_(gameId).length);
}
/** 보유 수량이 2개 이상인데 식별 스티커가 수량보다 적게 정해진 게임인지 */
function needsSticker_(gameId){
  const q = ownedQty_(gameId);
  return q >= 2 && getOwnedStickers_(gameId).length < q;
}

  if (!prepPage_('more', openOwnedGames_)) return;

    <div class="st-bar">${storeBarHtml_()}<input type="text" class="pg-search" style="margin:0; flex:1; min-width:160px;" placeholder="게임 이름 검색 (초성 가능)" oninput="setOwnedSearch_(this.value)"></div>

}
