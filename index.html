async function removePhotoFrom_(target){
  if (!confirm('이 사진을 삭제할까요?')) return;
  const g = games.find(x=>x.id===currentGameId);
  const item = resolvePhotoTargetItem_(target);
  const oldPath = item.photo;
  item.photo = null;
  await persistGame_(g);
  if (oldPath) deleteObject(ref(storage, oldPath)).catch(()=>{});
  if (target.type === 'case') redrawCurrentPhoto_(); else renderReturnGuideTab();
}

// ---- 라벨 (실제 라벨기 인쇄 미리보기: 검정 바탕 흰 글씨) ----
function createLabelFromMarker(mi){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  const m = photo.markers[mi];
  const c = g.cases[m.caseIdx];
  const text = (c.items||[]).map(it => it.qty ? `${it.name} ${it.qty}개` : it.name).join('\n');
  photo.labels = photo.labels || [];
  const baseX = m.box ? m.box.x : m.x;
  const baseY = m.box ? m.box.y : m.y;
  photo.labels.push({ x: Math.min(94, baseX+6), y: Math.min(90, baseY+10), text, fontSize:14 });
  redrawCurrentPhoto_();
}

function drawLabels(stage, photo, editable){
  stage.querySelectorAll('.label-wrap').forEach(el=>el.remove());
  labelRectsCache_ = [];
  (photo.labels||[]).forEach((lbl, li)=>{
    const rotation = lbl.rotation || 0;
    const wrap = document.createElement('div');
    wrap.className = 'label-wrap';
    wrap.style.left = lbl.x+'%';
    wrap.style.top = lbl.y+'%';

    const rotateGroup = document.createElement('div');
    rotateGroup.className = 'label-rotate-group';
    rotateGroup.style.transform = `rotate(${rotation}deg)`;

    const labelEl = document.createElement('div');
    labelEl.className = 'photo-label';
    labelEl.style.fontSize = (lbl.fontSize||14)+'px';
    if (lbl.widthPct != null && lbl.heightPct != null){
      const stageRect = stage.getBoundingClientRect();
      labelEl.style.width = (stageRect.width * lbl.widthPct/100)+'px';
      labelEl.style.height = (stageRect.height * lbl.heightPct/100)+'px';
      labelEl.style.overflow = 'hidden';
    }
    labelEl.textContent = lbl.text;

    rotateGroup.appendChild(labelEl);
    wrap.appendChild(rotateGroup);
    stage.appendChild(wrap); // 실제 위치/크기를 측정하려면 먼저 화면(DOM)에 붙어있어야 함

    // 정렬 가이드용: 이 라벨의 실제 화면 위치를 저장해둡니다.
    {
      const stageRectNow = stage.getBoundingClientRect();
      const groupRectNow = rotateGroup.getBoundingClientRect();
      labelRectsCache_[li] = {
        left: groupRectNow.left - stageRectNow.left,
        top: groupRectNow.top - stageRectNow.top,
        right: groupRectNow.right - stageRectNow.left,
        bottom: groupRectNow.bottom - stageRectNow.top,
        centerX: (groupRectNow.left + groupRectNow.right)/2 - stageRectNow.left,
        centerY: (groupRectNow.top + groupRectNow.bottom)/2 - stageRectNow.top
      };
    }

    if (editable){
      const isSelected = editSelection_ && editSelection_.type==='label' && editSelection_.idx===li;
      if (!isSelected){
        // 선택되지 않은 상태: 뷰어처럼 그냥 보여주기만 하고, 클릭하면 편집 모드로 펼쳐집니다.
        wrap.classList.add('collapsed');
        wrap.addEventListener('click', (e)=>{ e.stopPropagation(); selectAnno_('label', li); });
        return;
      }
      labelEl.contentEditable = 'true';
      labelEl.addEventListener('blur', ()=>{ lbl.text = labelEl.innerText; });
      wrap.classList.add('selected');

      // 회전 후 실제 화면에 보이는 라벨의 테두리를 측정해서, 툴바는 왼쪽 위
      // 모서리 바로 위, 손잡이는 오른쪽 아래 모서리에 맞춰 배치합니다.
      const wrapRect = wrap.getBoundingClientRect();
      const groupRect = rotateGroup.getBoundingClientRect();
      const relLeft = groupRect.left - wrapRect.left;
      const relTop = groupRect.top - wrapRect.top;
      const relRight = groupRect.right - wrapRect.left;
      const relBottom = groupRect.bottom - wrapRect.top;

      const toolbar = document.createElement('div');
      toolbar.className = 'label-toolbar';
      toolbar.style.left = relLeft+'px';
      toolbar.style.top = (relTop-28)+'px';
      toolbar.innerHTML = `
        <span class="label-drag">⠿</span>
        <button onclick="changeLabelFontSize(${li},-1)">A-</button>
        <button onclick="changeLabelFontSize(${li},1)">A+</button>
        <button onclick="rotateLabel(${li})">⟳</button>
        <button title="라벨 복제" onclick="duplicateLabel(${li})">⧉</button>
        <button onclick="deleteLabel(${li})">✕</button>
      `;
      toolbar.querySelector('.label-drag').addEventListener('pointerdown', (e)=>{
        e.stopPropagation();
        // labelEl.offsetWidth/Height는 회전 영향을 안 받는 "원래(로컬)" 크기이고,
        // getBoundingClientRect는 회전이 반영된 "화면에 보이는" 크기입니다.
        // 90/270도 회전이면 이 둘이 서로 다르므로, 그 차이를 보정값으로 미리 구해둡니다.
        const localW = labelEl.offsetWidth, localH = labelEl.offsetHeight;
        const swapped = (rotation === 90 || rotation === 270);
        const visualW = swapped ? localH : localW;
        const visualH = swapped ? localW : localH;
        const offsetXPx = (localW - visualW) / 2; // wrap 기준 위치 → 실제 화면 왼쪽위로 변환하는 보정값
        const offsetYPx = (localH - visualH) / 2;

        // 클릭한 지점(드래그 손잡이 위치)과 라벨의 실제 위치 사이의 차이를 기억해뒀다가,
        // 드래그 내내 그 차이를 유지합니다. (이걸 안 하면 클릭하자마자 라벨이 커서 위치로 순간이동해버립니다)
        const stageRect0 = stage.getBoundingClientRect();
        const grabDx = (e.clientX-stageRect0.left)/stageRect0.width*100 - lbl.x;
        const grabDy = (e.clientY-stageRect0.top)/stageRect0.height*100 - lbl.y;

        const move = (ev)=>{
          const rect = stage.getBoundingClientRect();
          let x = (ev.clientX-rect.left)/rect.width*100 - grabDx;
          let y = (ev.clientY-rect.top)/rect.height*100 - grabDy;
          x = Math.max(0, Math.min(100, x));
          y = Math.max(0, Math.min(100, y));

          // ---- 정렬 가이드: 다른 라벨과 가장자리/중앙이 가까우면 딱 맞춰서(스냅) 표시 ----
          const SNAP_PX = 6;
          const flowLeftPx = x/100*rect.width, flowTopPx = y/100*rect.height;
          const curLeft = flowLeftPx + offsetXPx, curTop = flowTopPx + offsetYPx; // 실제 화면상 위치로 보정
          const curRight = curLeft + visualW, curBottom = curTop + visualH;
          const curCenterX = curLeft + visualW/2, curCenterY = curTop + visualH/2;

          let bestX = null, bestY = null;
          labelRectsCache_.forEach((r, idx)=>{
            if (!r || idx === li) return;
            [[curLeft, r.left, 0], [curRight, r.right, -visualW], [curCenterX, r.centerX, -visualW/2]].forEach(([cur, target, adj])=>{
              const diff = Math.abs(cur - target);
              if (diff < SNAP_PX && (!bestX || diff < bestX.diff)) bestX = { diff, snap: target+adj, guidePos: target };
            });
            [[curTop, r.top, 0], [curBottom, r.bottom, -visualH], [curCenterY, r.centerY, -visualH/2]].forEach(([cur, target, adj])=>{
              const diff = Math.abs(cur - target);
              if (diff < SNAP_PX && (!bestY || diff < bestY.diff)) bestY = { diff, snap: target+adj, guidePos: target };
            });
          });
          // 스냅된 "화면상 위치"를 다시 wrap의 flow 위치(%)로 역산해서 반영합니다.
          if (bestX) x = ((bestX.snap - offsetXPx) / rect.width) * 100;
          if (bestY) y = ((bestY.snap - offsetYPx) / rect.height) * 100;

          lbl.x = x; lbl.y = y;
          wrap.style.left = x+'%';
          wrap.style.top = y+'%';
          renderAlignGuides_(stage, bestX ? bestX.guidePos : null, bestY ? bestY.guidePos : null);
        };
        const up = ()=>{
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          renderAlignGuides_(stage, null, null);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
      wrap.appendChild(toolbar);

      // 크기 조절 손잡이 - 회전과 무관하게 항상 화면상 오른쪽 아래 모서리에 고정합니다.
      const resizeHandle = document.createElement('div');
      resizeHandle.className = 'label-resize';
      resizeHandle.style.left = (relRight-6)+'px';
      resizeHandle.style.top = (relBottom-6)+'px';
      resizeHandle.addEventListener('pointerdown', (e)=>{
        e.stopPropagation();
        const stageRect = stage.getBoundingClientRect();
        const startW = labelEl.getBoundingClientRect().width;
        const startH = labelEl.getBoundingClientRect().height;
        const startX = e.clientX, startY = e.clientY;
        const swapped = (rotation === 90 || rotation === 270);
        const move = (ev)=>{
          // 화면에 보이는(회전 후) 크기 기준으로 계산 → 회전돼도 항상 오른쪽 아래를 드래그하는 느낌
          const visualW = Math.max(20, startW + (ev.clientX-startX));
          const visualH = Math.max(16, startH + (ev.clientY-startY));
          const localW = swapped ? visualH : visualW;
          const localH = swapped ? visualW : visualH;
          lbl.widthPct = localW/stageRect.width*100;
          lbl.heightPct = localH/stageRect.height*100;
          labelEl.style.width = localW+'px';
          labelEl.style.height = localH+'px';
          labelEl.style.overflow = 'hidden';
        };
        const up = ()=>{ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); redrawCurrentPhoto_(); };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
      wrap.appendChild(resizeHandle);
    }
  });
}

function changeLabelFontSize(li, delta){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  const lbl = photo.labels[li];
  lbl.fontSize = Math.max(8, Math.min(48, (lbl.fontSize||14) + delta*2));
  redrawCurrentPhoto_();
}
function rotateLabel(li){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  const lbl = photo.labels[li];
  lbl.rotation = ((lbl.rotation||0) + 90) % 360;
  redrawCurrentPhoto_();
}
function deleteLabel(li){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  photo.labels.splice(li, 1);
  redrawCurrentPhoto_();
}

/** 라벨을 복제합니다. 새 라벨은 원본에서 살짝 어긋난 위치에 생깁니다. */
function duplicateLabel(li){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  const lbl = photo.labels[li];
  if (!lbl) return;
  const newLbl = JSON.parse(JSON.stringify(lbl));
  newLbl.x = Math.min(94, (lbl.x||0) + 5);
  newLbl.y = Math.min(94, (lbl.y||0) + 5);
  photo.labels.push(newLbl);
  redrawCurrentPhoto_();
}

async function resolvePhotoUrl_(storagePath){
  if (photoUrlCache[storagePath]) return photoUrlCache[storagePath];
  const url = await getDownloadURL(ref(storage, storagePath));
  photoUrlCache[storagePath] = url;
  return url;
}

/**
 * ============================================================
 * 가이드 화면 이미지로 다운로드 (뷰어가 보는 모습 그대로)
 * ------------------------------------------------------------
 * 실제 화면(DOM)을 그대로 캡처하는 대신, 사진 위에 마커·화살표·연결선·
 * 텍스트박스·라벨을 캔버스에 직접 그려서 이미지를 만듭니다. 편집자가
 * 눌러도 항상 "뷰어 화면" 스타일(입력창이 아닌 텍스트, 안내 배지)로 그립니다.
 * ============================================================
 */
const GUIDE_EXPORT_W = 1600, GUIDE_EXPORT_H = 1200; // 4:3, 사진 스테이지와 동일한 비율
const GUIDE_EXPORT_DEFAULT_REF_WIDTH = 700; // 스테이지 실제 폭을 못 잴 때 쓰는 대략값

function wrapCanvasText_(ctx, text, maxWidth){
  const words = String(text||'').split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur+' '+w : w;
    if (ctx.measureText(test).width > maxWidth && cur){
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  });
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

/** 업로드 시 "전체 축소"를 쓰면 사진 둘레에 단색 여백(#F6F6F3)이 구워져 저장됩니다.
 *  그 여백을 뺀 실제 사진 영역을 비율(0~1)로 돌려줍니다. 여백이 없거나 못 찾으면 null. */
function detectContentBox_(img){
  const sc = Math.min(1, 600 / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d', { willReadFrequently:true });
  cx.drawImage(img, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h).data;
  const bg = [246,246,243], tol = 22;
  const colCnt = new Array(w).fill(0), rowCnt = new Array(h).fill(0);
  for (let y=0; y<h; y++){
    for (let x=0; x<w; x++){
      const i = (y*w + x)*4;
      if (Math.abs(d[i]-bg[0])>tol || Math.abs(d[i+1]-bg[1])>tol || Math.abs(d[i+2]-bg[2])>tol){ colCnt[x]++; rowCnt[y]++; }
    }
  }
  const need = 3; // 잡티 한두 픽셀에 속지 않도록 최소 개수
  let x0 = colCnt.findIndex(v=>v>=need), y0 = rowCnt.findIndex(v=>v>=need);
  let x1 = w-1 - [...colCnt].reverse().findIndex(v=>v>=need), y1 = h-1 - [...rowCnt].reverse().findIndex(v=>v>=need);
  if (x0 < 0 || y0 < 0 || x1 <= x0 || y1 <= y0) return null;
  const fx = x0/w, fy = y0/h, fw = (x1+1-x0)/w, fh = (y1+1-y0)/h;
  if (fx < 0.01 && fy < 0.01 && fw > 0.98 && fh > 0.98) return null; // 여백 없음
  return { x:fx, y:fy, w:fw, h:fh };
}

async function renderPhotoToCanvas_(g, photo, refWidth, opts){
  const labelOnly = !!(opts && opts.labelOnly); // true면 마커·연결선·텍스트박스 없이 라벨만, 사진은 원본 비율 그대로
  let imgRect = null;
  const labelBounds = [];
  // 마커/텍스트박스/라벨의 px 크기(패딩·폰트 등)는 실제 화면의 사진 영역 폭을 기준으로 정해져 있으므로,
  // 지금 화면에 실제로 그려진 사진 영역 폭을 그대로 기준 삼아야 화면에서 보는 비율과 똑같이 나옵니다.
  const k = GUIDE_EXPORT_W / (refWidth || GUIDE_EXPORT_DEFAULT_REF_WIDTH);
  const s = g.annoScale || 1; // 화면의 "텍스트박스 크기" 슬라이더 값 (텍스트박스에만 적용)
  const canvas = document.createElement('canvas');
  canvas.width = GUIDE_EXPORT_W;
  canvas.height = GUIDE_EXPORT_H;
  const ctx = canvas.getContext('2d');

  // 배경 (사진이 4:3을 정확히 채우지 못할 때 보이는 여백 색, 화면과 동일)
  ctx.fillStyle = '#EDEDE8';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 사진 (화면의 background-size:contain과 동일한 방식으로 배치)
  if (photo.storagePath){
    try{
      const url = await resolvePhotoUrl_(photo.storagePath);
      const img = await new Promise((resolve, reject)=>{
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = ()=>resolve(im);
        im.onerror = ()=>reject(new Error('CORS_OR_NETWORK'));
        im.src = url;
      });
      const scale = Math.min(canvas.width/img.width, canvas.height/img.height);
      const dw = img.width*scale, dh = img.height*scale;
      const dx = (canvas.width-dw)/2, dy = (canvas.height-dh)/2;
      ctx.drawImage(img, dx, dy, dw, dh);
      imgRect = { dx, dy, dw, dh };
      if (labelOnly){
        // 업로드할 때 "전체 축소"로 사진 둘레에 넣어둔 여백을 찾아내 걷어냅니다 → 사진 원본 비율만 남음
        try{
          const bb = detectContentBox_(img);
          if (bb) imgRect = { dx: dx + bb.x*dw, dy: dy + bb.y*dh, dw: bb.w*dw, dh: bb.h*dh };
        }catch(e){ /* 감지 실패 시 전체를 그대로 사용 */ }
      }
    }catch(e){
      console.error('가이드 이미지 내보내기: 사진 로드 실패 (Storage 버킷의 CORS 설정이 필요할 수 있습니다)', e);
      ctx.fillStyle = '#999';
      ctx.font = `${14*k}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('사진을 불러오지 못했습니다', canvas.width/2, canvas.height/2);
    }
  }

  // 텍스트박스 안에 넣을 구성품 사진들을 미리 불러와둡니다 (있는 것만, 실패해도 무시).
  const caseImgCache = {};
  const photoPaths = labelOnly ? [] : [...new Set((photo.markers||[]).flatMap(m=>{
    const c = g.cases[m.caseIdx];
    return c ? (c.items||[]).map(it=>it.photo).filter(Boolean) : [];
  }))];
  await Promise.all(photoPaths.map(async path=>{
    try{
      const url = await resolvePhotoUrl_(path);
      const im = await new Promise((resolve, reject)=>{
        const el = new Image();
        el.crossOrigin = 'anonymous';
        el.onload = ()=>resolve(el);
        el.onerror = reject;
        el.src = url;
      });
      caseImgCache[path] = im;
    }catch(e){ /* 실패하면 그냥 사진 없이 나머지만 그립니다 */ }
  }));

  // 마커·연결선·텍스트박스를 그리기 전에, 먼저 각 텍스트박스의 크기/위치를 계산해둡니다.
  // (연결선이 박스의 왼쪽 가장자리를 향해야 하고, 화살표는 그 반대 방향을 향해야 하므로)
  const thumbSize = 40*k*s;
  const photoLineH = thumbSize + 6*k*s;
  const boxLayout = (labelOnly ? [] : (photo.markers||[])).map(m=>{
    const c = g.cases[m.caseIdx];
    if (!m.box || !c) return null;
    const boxW = 185*k*s;
    const paddingX = 10*k*s, paddingY = 8*k*s;
    const lineH = 15*k*s;
    const lines = [];
    (c.items||[]).forEach(it=>{
      const img = it.photo ? caseImgCache[it.photo] : null;
      if (img) lines.push({type:'photo', img});
      ctx.font = `${11.5*k*s}px sans-serif`;
      const t = `${it.name||''}${it.qty?` ${it.qty}개`:''}`;
      wrapCanvasText_(ctx, t, boxW-paddingX*2).forEach(l=>lines.push({type:'text', text:l, style:'item'}));
    });
    if (c.note){
      ctx.font = `italic ${10.5*k*s}px sans-serif`;
      wrapCanvasText_(ctx, c.note, boxW-paddingX*2).forEach(l=>lines.push({type:'text', text:l, style:'note'}));
    }
    const badgeH = 22*k*s;
    const contentH = lines.reduce((sum,l)=> sum + (l.type==='photo' ? photoLineH : lineH), 0);
    const boxH = paddingY*2 + badgeH + 4*k*s + Math.max(lineH, contentH);
    const bx = (m.box.x/100)*canvas.width;
    const by = (m.box.y/100)*canvas.height;
    return { x:bx, y:by, w:boxW, h:boxH, lines, c, paddingX, paddingY, badgeH, lineH };
  });

  // ---- 연결선 ----
  (labelOnly ? [] : (photo.markers||[])).forEach((m, mi)=>{
    const box = boxLayout[mi];
    if (!box) return;
    const c = g.cases[m.caseIdx];
    const x1 = (m.x/100)*canvas.width, y1 = (m.y/100)*canvas.height;
    const x2 = box.x, y2 = box.y + box.h/2;
    ctx.strokeStyle = c ? caseColor_(c.caseType) : 'rgba(80,80,75,.85)';
    ctx.lineWidth = (g.lineWidth||2.2)*k;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  });

  // ---- 마커 (원 또는 화살표) ----
  (labelOnly ? [] : (photo.markers||[])).forEach((m, mi)=>{
    const c = g.cases[m.caseIdx];
    const x = (m.x/100)*canvas.width, y = (m.y/100)*canvas.height;
    const color = c ? caseColor_(c.caseType) : '#E4141B';
    const isItem = c && c.caseType === NON_CASE_TYPE;

    if (isItem){
      const box = boxLayout[mi];
      const tx = box ? box.x : x, ty = box ? box.y + box.h/2 : y;
      const angle = Math.atan2(ty-y, tx-x); // 텍스트박스 반대 방향(화살표가 향하는 방향)
      const len = 16*k, halfW = 9*k;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle + Math.PI); // 선의 각도 + 180도 = 화살표가 가리키는 방향
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-len, -halfW);
      ctx.lineTo(-len, halfW);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else {
      const r = ((g.markerSize||24)/2) * k;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI*2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 2.5*k;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      if (c){
        ctx.fillStyle = '#fff';
        ctx.font = `700 ${r*0.92}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(markerGlyph_(c.caseType), x, y+1);
      }
    }
  });

  // ---- 텍스트박스 ----
  (labelOnly ? [] : (photo.markers||[])).forEach((m, mi)=>{
    const box = boxLayout[mi];
    if (!box) return;
    const { x, y, w, h, c, paddingX, paddingY, badgeH, lineH } = box;
    const color = caseColor_(c.caseType);
    const left = x, top = y;

    // 박스 배경 + 테두리 + 왼쪽 색 띠
    ctx.fillStyle = 'rgba(255,255,255,.98)';
    roundRectPath_(ctx, left, top, w, h, 8*k*s);
    ctx.fill();
    ctx.lineWidth = 1*k;
    ctx.strokeStyle = '#E3E3DE';
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.fillRect(left, top, 4*k*s, h);

    // 종류 배지 (색 점 + 이름)
    let cx = left + paddingX + 4*k*s;
    const badgeY = top + paddingY;
    ctx.font = `800 ${11*k*s}px monospace`;
    const label = typeLabel_(c.caseType);
    const labelW = ctx.measureText(label).width;
    const dotR = 4.5*k*s;
    const chipW = dotR*2 + 6*k*s + labelW + 14*k*s;
    ctx.fillStyle = `${color}1A`;
    roundRectPath_(ctx, cx, badgeY, chipW, badgeH, 6*k*s);
    ctx.fill();
    ctx.lineWidth = 1.8*k;
    ctx.strokeStyle = color;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx+7*k*s, badgeY+badgeH/2, dotR, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = color;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, cx+7*k*s+dotR+6*k*s, badgeY+badgeH/2+1);

    // 구성품 목록 · 사진 · 비고 (구성품마다 사진이 있으면 그 줄 자리에 함께 그려집니다)
    let cursorTop = top + paddingY + badgeH + 4*k*s;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    box.lines.forEach(l=>{
      if (l.type === 'photo'){
        const scale = Math.min(thumbSize/l.img.width, thumbSize/l.img.height);
        const dw = l.img.width*scale, dh = l.img.height*scale;
        const dx = left + paddingX + (thumbSize-dw)/2;
        const dy = cursorTop + (thumbSize-dh)/2;
        ctx.drawImage(l.img, dx, dy, dw, dh);
        cursorTop += photoLineH;
      } else {
        ctx.font = l.style === 'note' ? `italic ${10.5*k*s}px sans-serif` : `${11.5*k*s}px sans-serif`;
        ctx.fillStyle = l.style === 'note' ? '#63645F' : '#1B1C1A';
        ctx.fillText(l.text, left+paddingX, cursorTop + lineH*0.75);
        cursorTop += lineH;
      }
    });
  });

  // ---- 라벨(실제 인쇄 미리보기) ----
  // lbl.x/lbl.y는 회전 전 라벨의 "왼쪽 위 모서리" 위치이고, 회전은 그 라벨 자신의 중심을
  // 기준으로 일어납니다 (화면의 CSS와 동일한 동작). 그래서 중심 좌표는 위치 + 크기의 절반으로 구합니다.
  (photo.labels||[]).forEach(lbl=>{
    const fontSize = (lbl.fontSize||14)*k;
    ctx.font = `600 ${fontSize}px sans-serif`;
    const linesRaw = String(lbl.text||'').split('\n');
    const padX = 0.7*fontSize, padY = 0.5*fontSize;
    let w, h;
    if (lbl.widthPct != null && lbl.heightPct != null){
      w = canvas.width * lbl.widthPct/100;
      h = canvas.height * lbl.heightPct/100;
    } else {
      const maxLineW = Math.max(...linesRaw.map(l=>ctx.measureText(l).width), 1);
      w = maxLineW + padX*2;
      h = linesRaw.length*fontSize*1.35 + padY*2;
    }
    const left = (lbl.x/100)*canvas.width, top = (lbl.y/100)*canvas.height;
    const pivotX = left + w/2, pivotY = top + h/2;
    { const rad=(lbl.rotation||0)*Math.PI/180; const bw=Math.abs(w*Math.cos(rad))+Math.abs(h*Math.sin(rad)), bh=Math.abs(w*Math.sin(rad))+Math.abs(h*Math.cos(rad)); labelBounds.push({x0:pivotX-bw/2, y0:pivotY-bh/2, x1:pivotX+bw/2, y1:pivotY+bh/2}); }
    ctx.save();
    ctx.translate(pivotX, pivotY);
    ctx.rotate((lbl.rotation||0) * Math.PI/180);
    roundRectPath_(ctx, -w/2, -h/2, w, h, 0.25*fontSize);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lineH = fontSize*1.35;
    const startY = -((linesRaw.length-1)*lineH)/2;
    linesRaw.forEach((l, i)=> ctx.fillText(l, 0, startY + i*lineH));
    ctx.restore();
  });

  // 텍스트박스마다 캔버스 안에서 차지하는 위치·크기를 %로도 함께 돌려줍니다.
  // (반납대 가이드의 사진 격자에서, 캔버스 이미지 위에 클릭 가능한 투명 영역을 정확히 겹쳐 그리기 위함입니다.)
  const boxRects = boxLayout.map((box, mi)=>{
    if (!box) return null;
    return {
      caseIdx: photo.markers[mi].caseIdx,
      leftPct: (box.x/canvas.width)*100,
      topPct: (box.y/canvas.height)*100,
      widthPct: (box.w/canvas.width)*100,
      heightPct: (box.h/canvas.height)*100,
    };
  });

  if (labelOnly && imgRect){
    // 라벨이 사진 가장자리 밖으로 걸쳐 있으면 잘리지 않도록 잘라낼 영역을 라벨까지 넓힙니다.
    let r0 = imgRect.dx, r1 = imgRect.dx + imgRect.dw, q0 = imgRect.dy, q1 = imgRect.dy + imgRect.dh;
    labelBounds.forEach(l=>{ r0=Math.min(r0,Math.max(0,l.x0)); r1=Math.max(r1,Math.min(canvas.width,l.x1)); q0=Math.min(q0,Math.max(0,l.y0)); q1=Math.max(q1,Math.min(canvas.height,l.y1)); });
    imgRect = { dx:r0, dy:q0, dw:r1-r0, dh:q1-q0 };
    // 사진 영역만 잘라내서(4:3 여백 제거) 원본 비율 그대로 돌려줍니다.
    const out = document.createElement('canvas');
    out.width = Math.round(imgRect.dw);
    out.height = Math.round(imgRect.dh);
    out.getContext('2d').drawImage(canvas, imgRect.dx, imgRect.dy, imgRect.dw, imgRect.dh, 0, 0, out.width, out.height);
    return { canvas: out, boxRects: [] };
  }
  return { canvas, boxRects };
}

function roundRectPath_(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function downloadCanvasAsPng_(canvas, fileName){
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function downloadGuideImage(idx){
  if (idx === undefined) idx = currentPhotoIdx; // 인라인 onclick(전역 스코프)에서는 currentPhotoIdx를 직접 못 읽어서, 안 넘어오면 여기서 채웁니다.
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[idx];
  if (!photo) return;
  try{
    const stageEl = document.getElementById('photoStage');
    const refWidth = stageEl ? stageEl.getBoundingClientRect().width : GUIDE_EXPORT_DEFAULT_REF_WIDTH;
    const { canvas } = await renderPhotoToCanvas_(g, photo, refWidth);
    const suffix = (g.photos.length > 1) ? `_사진${idx+1}` : '';
    downloadCanvasAsPng_(canvas, `${g.name || 'game'}${suffix}.png`);
  }catch(e){
    alert('이미지를 만드는 중 문제가 발생했습니다: ' + e.message);
  }
}

async function downloadAllGuideImages(){
  const g = games.find(x=>x.id===currentGameId);
  if (!g.photos || !g.photos.length) return;
  const stageEl = document.getElementById('photoStage');
  const refWidth = stageEl ? stageEl.getBoundingClientRect().width : GUIDE_EXPORT_DEFAULT_REF_WIDTH;
  for (let i=0; i<g.photos.length; i++){
    try{
      const { canvas } = await renderPhotoToCanvas_(g, g.photos[i], refWidth);
      downloadCanvasAsPng_(canvas, `${g.name || 'game'}_사진${i+1}.png`);
    }catch(e){
      alert(`${i+1}번째 사진을 만드는 중 문제가 발생했습니다: ` + e.message);
      return;
    }
    // 브라우저가 다운로드를 팝업 차단 없이 순서대로 처리할 수 있도록 약간 간격을 둡니다.
    await new Promise(r=>setTimeout(r, 350));
  }
}

function prevPhoto(){ currentPhotoIdx = Math.max(0, currentPhotoIdx-1); renderPhotoTab(); }
function nextPhoto(){
  const g = games.find(x=>x.id===currentGameId);
  currentPhotoIdx = Math.min((g.photos||[]).length-1, currentPhotoIdx+1);
  renderPhotoTab();
}

function uploadPhoto(){
  const input = document.getElementById('photoFileInput');
  const file = input.files[0];
  if (!file){ alert('파일을 선택해주세요.'); return; }
  openCropModal_(file);
}

/**
 * ============================================================
 * 사진 자르기 · 회전 (업로드 전 편집)
 * ============================================================
 */
let cropState_ = null;

function openCropModal_(file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    cropState_ = { originalImg: img, img, rotation: 0, fileName: file.name };
    renderCropModal_();
  };
  img.src = url;
}

function renderCropModal_(){
  const old = document.getElementById('cropBackdrop');
  if (old) old.remove();

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'cropBackdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>사진 자르기 · 회전</h3>
      <div class="crop-toolbar">
        <button onclick="rotateCrop_(-90)">↺ 왼쪽으로 회전</button>
        <button onclick="rotateCrop_(90)">회전 ↻ 오른쪽으로</button>
      </div>
      <div class="crop-canvas-wrap" id="cropCanvasWrap">
        <canvas id="cropCanvas"></canvas>
        <div class="crop-box" id="cropBox">
          <div class="crop-handle corner-nw" data-h="nw"></div>
          <div class="crop-handle corner-ne" data-h="ne"></div>
          <div class="crop-handle corner-sw" data-h="sw"></div>
          <div class="crop-handle corner-se" data-h="se"></div>
          <div class="crop-handle edge-n" data-h="n"></div>
          <div class="crop-handle edge-s" data-h="s"></div>
          <div class="crop-handle edge-w" data-h="w"></div>
          <div class="crop-handle edge-e" data-h="e"></div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);">
        <label style="font-size:12px; color:var(--ink-soft); white-space:nowrap;">전체 축소</label>
        <input type="range" id="cropShrinkRange" min="40" max="100" value="100" style="flex:1;">
        <span id="cropShrinkVal" style="font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); width:38px; text-align:right;">100%</span>
      </div>
      <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--line); text-align:center;">
        <div style="font-size:12px; color:var(--ink-soft); margin-bottom:8px;">실제 저장될 모습 미리보기</div>
        <canvas id="cropResultPreview" width="220" height="160" style="border:2px solid var(--ink); border-radius:8px; background:#F6F6F3; box-shadow:0 2px 10px rgba(0,0,0,.18); max-width:100%;"></canvas>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeCropModal_()">취소</button>
        <button class="btn-apply" onclick="applyCropAndUpload_()">적용하고 업로드</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  setupCropCanvas_();
  document.getElementById('cropShrinkRange').addEventListener('input', (e)=>{
    cropState_.shrinkPct = Number(e.target.value);
    document.getElementById('cropShrinkVal').textContent = cropState_.shrinkPct + '%';
    updateCropResultPreview_();
  });
}

/**
 * 점선 대신, 실제로 저장될 때의 모습(선택 영역 + 축소 비율 반영)을 그대로 그려서
 * 보여줍니다. applyCropAndUpload_()과 동일한 계산식을 씁니다.
 */
function updateCropResultPreview_(){
  const canvas = document.getElementById('cropResultPreview');
  if (!canvas || !cropState_ || !cropState_.box) return;
  const ctx = canvas.getContext('2d');
  const outW = canvas.width, outH = canvas.height;
  ctx.clearRect(0,0,outW,outH);
  ctx.fillStyle = '#F6F6F3';
  ctx.fillRect(0,0,outW,outH);

  const wrap = document.getElementById('cropCanvasWrap');
  if (!wrap) return;
  const wrapRect = wrap.getBoundingClientRect();
  const img = cropState_.img;
  const scale = img.width / wrapRect.width;

  const { x, y, w, h } = cropState_.box;
  const sx = x*scale, sy = y*scale, sw = w*scale, sh = h*scale;
  if (sw <= 0 || sh <= 0) return;

  const fitScale = Math.min(outW/sw, outH/sh);
  const baseW = sw*fitScale, baseH = sh*fitScale;
  const shrink = (cropState_.shrinkPct || 100) / 100;
  const drawW = baseW*shrink, drawH = baseH*shrink;
  const drawX = (outW-drawW)/2, drawY = (outH-drawH)/2;

  ctx.drawImage(img, sx, sy, sw, sh, drawX, drawY, drawW, drawH);
}

function setupCropCanvas_(){
  const wrap = document.getElementById('cropCanvasWrap');
  const canvas = document.getElementById('cropCanvas');
  const box = document.getElementById('cropBox');
  const CROP_MIN = 30;

  const img = cropState_.img;
  const ctx = canvas.getContext('2d');
  canvas.width = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);

  // 사진 원래 비율 그대로 미리보기 높이를 맞춥니다. (고정된 4:3 틀에 늘려 넣으면
  // 미리보기가 눌리거나 늘어나 보이고, 그 상태로 계산한 크롭 좌표도 같이 어긋납니다)
  const wrapWidth = wrap.clientWidth;
  wrap.style.height = (wrapWidth * img.height / img.width) + 'px';

  // 처음에는 크롭 박스가 전체 이미지를 덮도록 초기화
  const rect = wrap.getBoundingClientRect();
  cropState_.box = { x: 0, y: 0, w: rect.width, h: rect.height };
  applyBoxStyle_();

  box.onpointerdown = (e)=>{
    if (e.target.classList.contains('crop-handle')) return;
    const startX = e.clientX, startY = e.clientY;
    const start = { ...cropState_.box };
    const move = (ev)=>{
      const wrapRect = wrap.getBoundingClientRect();
      let x = start.x + (ev.clientX - startX);
      let y = start.y + (ev.clientY - startY);
      x = Math.max(0, Math.min(wrapRect.width - cropState_.box.w, x));
      y = Math.max(0, Math.min(wrapRect.height - cropState_.box.h, y));
      cropState_.box.x = x; cropState_.box.y = y;
      applyBoxStyle_();
    };
    const up = ()=>{ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  // 모서리 4곳 + 변 중앙 4곳, 총 8개 손잡이로 어느 방향으로든 크기 조절 가능합니다.
  box.querySelectorAll('.crop-handle').forEach(handleEl=>{
    handleEl.onpointerdown = (e)=>{
      e.stopPropagation();
      const dir = handleEl.dataset.h;
      const startX = e.clientX, startY = e.clientY;
      const start = { ...cropState_.box };
      const move = (ev)=>{
        const wrapRect = wrap.getBoundingClientRect();
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        let { x, y, w, h } = start;

        if (dir.includes('w')){
          const newX = Math.min(start.x + start.w - CROP_MIN, Math.max(0, start.x + dx));
          w = start.x + start.w - newX;
          x = newX;
        }
        if (dir.includes('e')){
          const newRight = Math.max(start.x + CROP_MIN, Math.min(wrapRect.width, start.x + start.w + dx));
          w = newRight - start.x;
        }
        if (dir.includes('n')){
          const newY = Math.min(start.y + start.h - CROP_MIN, Math.max(0, start.y + dy));
          h = start.y + start.h - newY;
          y = newY;
        }
        if (dir.includes('s')){
          const newBottom = Math.max(start.y + CROP_MIN, Math.min(wrapRect.height, start.y + start.h + dy));
          h = newBottom - start.y;
        }

        cropState_.box = { x, y, w, h };
        applyBoxStyle_();
      };
      const up = ()=>{ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    };
  });
}

function applyBoxStyle_(){
  const box = document.getElementById('cropBox');
  const { x, y, w, h } = cropState_.box;
  box.style.left = x+'px'; box.style.top = y+'px';
  box.style.width = w+'px'; box.style.height = h+'px';
  updateCropResultPreview_();
}

function rotateCrop_(deltaDeg){
  const { originalImg } = cropState_;
  cropState_.rotation = ((cropState_.rotation || 0) + deltaDeg + 360) % 360;
  const rot = cropState_.rotation;
  const swapped = (rot === 90 || rot === 270);

  const rotatedCanvas = document.createElement('canvas');
  rotatedCanvas.width = swapped ? originalImg.height : originalImg.width;
  rotatedCanvas.height = swapped ? originalImg.width : originalImg.height;
  const rctx = rotatedCanvas.getContext('2d');
  rctx.save();
  rctx.translate(rotatedCanvas.width/2, rotatedCanvas.height/2);
  rctx.rotate(rot * Math.PI/180);
  rctx.drawImage(originalImg, -originalImg.width/2, -originalImg.height/2);
  rctx.restore();

  cropState_.img = rotatedCanvas;
  setupCropCanvas_(); // 회전된 이미지 기준으로 캔버스와 크롭 박스를 다시 초기화
}

function closeCropModal_(){
  const el = document.getElementById('cropBackdrop');
  if (el) el.remove();
  cropState_ = null;
}

async function applyCropAndUpload_(){
  const wrap = document.getElementById('cropCanvasWrap');
  const wrapRect = wrap.getBoundingClientRect();
  const img = cropState_.img; // 캔버스(회전됐으면) 또는 이미지(회전 안 했으면) - 둘 다 drawImage 가능
  const scale = img.width / wrapRect.width; // 화면 표시 크기 → 실제 이미지 픽셀 크기 비율

  const { x, y, w, h } = cropState_.box;
  const sx = x*scale, sy = y*scale, sw = w*scale, sh = h*scale;

  const outCanvas = document.createElement('canvas');
  outCanvas.width = sw; outCanvas.height = sh;
  const ctx = outCanvas.getContext('2d');

  const shrink = (cropState_.shrinkPct || 100) / 100;
  if (shrink < 1){
    // 선택 영역 프레임은 그대로 두고, 그 안의 내용만 축소해서 가운데 배치 (남는 자리는 여백)
    ctx.fillStyle = '#F6F6F3';
    ctx.fillRect(0, 0, sw, sh);
    const drawW = sw*shrink, drawH = sh*shrink;
    const drawX = (sw-drawW)/2, drawY = (sh-drawH)/2;
    ctx.drawImage(img, sx, sy, sw, sh, drawX, drawY, drawW, drawH);
  } else {
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  }

  const blob = await new Promise(res => outCanvas.toBlob(res, 'image/jpeg', 0.9));
  closeCropModal_();

  const statusEl = document.getElementById('uploadStatus');
  if (statusEl) statusEl.textContent = '업로드 중...';

  const g = games.find(x=>x.id===currentGameId);
  const stamp = Date.now();
  const storagePath = `games/${g.id}/${stamp}_cropped.jpg`;
  try{
    await uploadBytes(ref(storage, storagePath), blob);
    // 목록 카드에 쓸 작은 썸네일도 함께 올립니다 (실패해도 사진 업로드 자체는 그대로 진행)
    let thumbPath = null;
    try{
      const thumbBlob = await makeThumbBlob_(outCanvas);
      thumbPath = `games/${g.id}/${stamp}_thumb.jpg`;
      await uploadBytes(ref(storage, thumbPath), thumbBlob);
    }catch(e){ console.warn('썸네일 업로드 실패', e); thumbPath = null; }
    g.photos = g.photos || [];
    g.photos.push(thumbPath ? { storagePath, thumbPath, markers: [] } : { storagePath, markers: [] });
    currentPhotoIdx = g.photos.length - 1;
    await persistGame_(g);
    renderPhotoTab();
  }catch(e){
    console.error(e);
    alert('업로드에 실패했습니다.');
  }
}

async function deletePhoto(){
  if (!confirm('이 사진을 삭제할까요? (마커 정보도 함께 삭제됩니다)')) return;
  const g = games.find(x=>x.id===currentGameId);
  g.photos.splice(currentPhotoIdx, 1);
  currentPhotoIdx = 0;
  await persistGame_(g);
  renderPhotoTab();
}

/** 사진 순서를 앞/뒤로 바꿉니다. 마커·라벨은 사진 객체 안에 함께 들어있어서 자동으로 같이 이동합니다.
 *  (다른 사진 편집사항과 마찬가지로, 화면에는 바로 반영되고 "저장" 버튼을 눌러야 실제로 저장됩니다) */
function movePhoto(direction){
  const g = games.find(x=>x.id===currentGameId);
  const newIdx = currentPhotoIdx + direction;
  if (!g.photos || newIdx < 0 || newIdx >= g.photos.length) return;
  const tmp = g.photos[currentPhotoIdx];
  g.photos[currentPhotoIdx] = g.photos[newIdx];
  g.photos[newIdx] = tmp;
  currentPhotoIdx = newIdx;
  renderPhotoTab();
}

/** 표에는 있지만 아직 사진에 마커가 없는 케이스들을, 격자 형태로 자동 배치합니다.
 *  위치는 대략적인 시작점일 뿐이니, 실제 배치에 맞게 드래그로 옮겨주는 걸 전제로 합니다. */
function autoGenerateMarkers(){
  const g = games.find(x=>x.id===currentGameId);
  const photo = g.photos[currentPhotoIdx];
  if (!photo) return;

  const placedCaseIdx = new Set();
  (g.photos||[]).forEach(p => (p.markers||[]).forEach(m => placedCaseIdx.add(m.caseIdx)));

  const missing = [];
  (g.cases||[]).forEach((c, ci) => { if (!placedCaseIdx.has(ci)) missing.push(ci); });

  if (missing.length === 0){
    alert('이미 모든 케이스에 마커가 있습니다.');
    return;
  }

  const positions = computeGridPositions_(missing.length);
  photo.markers = photo.markers || [];
  missing.forEach((ci, i) => {
    const x = positions[i].x, y = positions[i].y;
    const boxX = x < 60 ? Math.min(97, x+8) : Math.max(3, x-8);
    const boxY = Math.max(5, Math.min(90, y-4));
    photo.markers.push({ x, y, caseIdx: ci, box:{x:boxX, y:boxY} });
  });

  renderPhotoTab();
  alert(missing.length + '개 마커를 자동 생성했습니다. 위치를 드래그해서 실제 배치에 맞게 옮겨주세요.');
}

function computeGridPositions_(count){
  const cols = Math.max(1, Math.ceil(Math.sqrt(count)));
  const rows = Math.max(1, Math.ceil(count / cols));
  const positions = [];
  for (let i = 0; i < count; i++){
    const col = i % cols, row = Math.floor(i / cols);
    const x = cols === 1 ? 50 : 12 + col * (76 / (cols - 1));
    const y = rows === 1 ? 50 : 12 + row * (76 / (rows - 1));
    positions.push({ x, y });
  }
  return positions;
}

/**
 * 사진/마커 변경사항은 즉시 저장합니다 (표 탭의 케이스 편집은 "저장" 버튼으로 별도 처리).
 * 저장할 때마다:
 *  1) 서버의 현재 버전이 내가 마지막으로 불러온 버전과 다르면(그 사이 다른 편집자가
 *     먼저 저장했다면) 충돌로 보고 덮어쓰지 않고 최신 내용을 다시 불러옵니다.
 *  2) 충돌이 없으면, 덮어쓰기 직전의 내용을 이력에 남깁니다 (너무 자주 남기지
 *     않도록 게임당 3분에 한 번으로 제한합니다).
 * 이 모든 걸 하나의 트랜잭션으로 처리해서 원자적으로(중간에 끼어들 틈 없이) 실행합니다.
 */
let historyLastSavedAt_ = {}; // gameId -> 마지막으로 이력을 남긴 시각 (너무 잦은 이력 생성 방지)

async function persistGame_(g){
  const gameRef = doc(db, 'games', g.id);
  const basedOnUpdatedAt = g.updatedAt;
  const savingJson = contentJson_(g); // 저장을 시작한 순간의 내용 (저장 도중 또 바뀌면 그 부분은 "저장 안 됨"으로 남음)

  try{
    const result = await runTransaction(db, async (tx)=>{
      const snap = await tx.get(gameRef);
      const serverData = snap.data();

      if (serverData && serverData.updatedAt && basedOnUpdatedAt && serverData.updatedAt !== basedOnUpdatedAt){
        return { conflict:true, serverGame: { id: g.id, ...serverData } };
      }

      if (serverData){
        const lastHistoryAt = historyLastSavedAt_[g.id] || 0;
        if (Date.now() - lastHistoryAt > 3*60*1000){
          // 편집 잠금 정보(editLockHolder/editLockAt)는 "지금 누가 편집 중인지"를 나타내는
          // 실시간 상태일 뿐, 게임 내용이 아니므로 이력에는 남기지 않습니다.
          // (안 그러면 나중에 이 버전을 복원할 때 그 당시의 잠금 상태까지 같이 되살아나서 꼬입니다)
          const { editLockHolder, editLockAt, ...contentOnly } = serverData;
          const historyRef = doc(collection(db, 'games', g.id, 'history'));
          tx.set(historyRef, { savedAt: Date.now(), snapshot: contentOnly });
          historyLastSavedAt_[g.id] = Date.now();
        }
      }

      // 작업 완료 체크·누락 신고·가이드 완료·휴지통 상태는 각자 따로 즉시 저장되는 값이라, 여기서 내 화면에
      // 남아있던 (오래됐을 수 있는) 값으로 덮어쓰면 다른 사람이 방금 한 체크가 지워집니다. 그래서 제외합니다.
      const { id, editLockHolder, editLockAt, completedBy, missingReports, guideDone, deleted, deletedAt, deletedBy, ...data } = g;
      data.updatedAt = Date.now();
      data.updatedBy = auth.currentUser?.email?.toLowerCase() || '';
      // merge:true로 저장해서, 이 문서에 있는 편집 잠금 필드(editLockHolder/editLockAt)는
      // 절대 건드리지 않습니다. (내용 저장과 잠금 상태는 완전히 분리되어야 함)
      tx.set(gameRef, data, { merge: true });
      return { conflict:false, newUpdatedAt: data.updatedAt };
    });

    if (result.conflict){
      const idx = games.findIndex(x=>x.id===g.id);
      if (idx !== -1) games[idx] = result.serverGame;
      if (currentGameId === g.id){ resetChangeTracking_(); renderDetail(); }
      alert('⚠ 다른 편집자가 방금 이 게임을 수정해서, 최신 내용을 다시 불러왔습니다.\n방금 편집하신 내용은 다시 적용해주세요.');
      return false;
    }

    g.updatedAt = result.newUpdatedAt; // 다음 저장 때 "나 자신"을 충돌로 오판하지 않도록 갱신
    g.updatedBy = auth.currentUser?.email?.toLowerCase() || '';
    markSaved_(g.id, savingJson);
    return true;
  }catch(e){
    console.error('저장 실패', e);
    alert('저장에 실패했습니다. 잠시 후 다시 시도해주세요.');
    return false;
  }
}

/**
 * ============================================================
 * 이전 버전(수정 이력) 보기·복원
 * ============================================================
 */
let historyItems_ = []; // 지금 열려있는 이전 버전 목록 (미리보기용)
const HISTORY_LIST_MAX_ = 10;

async function showHistoryModal_(){
  const gameId = currentGameId;
  noteChange_();
  const q = query(collection(db, 'games', gameId, 'history'), orderBy('savedAt', 'desc'), limit(HISTORY_LIST_MAX_));
  const snap = await getDocs(q);
  const items = [];
  snap.forEach(d => items.push({ id: d.id, ...d.data() }));
  historyItems_ = items;
  renderHistoryModal_(gameId, items);
}

function formatHistoryDate_(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderHistoryModal_(gameId, items){
  const old = document.getElementById('historyBackdrop');
  if (old) old.remove();

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'historyBackdrop';
  backdrop.innerHTML = `
    <div class="modal" style="max-width:520px;">
      <h3>이전 버전</h3>
      <p style="font-size:12px; color:var(--ink-soft); margin-top:-8px;">저장할 때 직전 내용이 자동으로 남습니다 (최근 ${HISTORY_LIST_MAX_}개 표시). "미리보기"로 그 버전의 모습과 지금과 달라지는 점을 먼저 확인할 수 있습니다.</p>
      <div class="history-list">
        ${items.length ? items.map(h=>`
          <div class="history-row">
            <div>
              <div class="history-time">${formatHistoryDate_(h.savedAt)}</div>
              <div class="history-meta">${escHtml_(h.snapshot.name)} · 케이스 ${(h.snapshot.cases||[]).length}개 · 사진 ${(h.snapshot.photos||[]).length}장${h.snapshot.updatedBy ? ` · 작성 ${escHtml_(h.snapshot.updatedBy)}` : ''}</div>
            </div>
            <div class="history-actions">
              <button class="btn btn-ghost2" style="width:auto; padding:5px 10px; font-size:12px;" onclick="showHistoryPreview_('${gameId}','${h.id}')">미리보기</button>
              <button class="btn btn-ghost2" style="width:auto; padding:5px 10px; font-size:12px;" onclick="restoreHistory_('${gameId}','${h.id}')">복원</button>
            </div>
            <div id="historyPreview_${h.id}" style="flex-basis:100%;"></div>
          </div>
        `).join('') : `<p>아직 저장된 이전 버전이 없습니다.</p>`}
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="document.getElementById('historyBackdrop').remove()">닫기</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
}

async function restoreHistory_(gameId, historyId){
  if (!confirm('이 버전으로 되돌릴까요? 현재 내용은 이력에 저장된 뒤 덮어써집니다.')) return;
  const snap = await getDoc(doc(db, 'games', gameId, 'history', historyId));
  const item = snap.data();
  if (!item){ alert('불러오지 못했습니다.'); return; }

  // 혹시 예전에 만들어진 이력에 편집 잠금 정보가 남아있더라도(수정 전 버전), 복원 시
  // 절대 반영하지 않도록 한 번 더 걸러냅니다.
  // 작업 완료 체크·누락 신고·가이드 완료 같은 "상태" 값은 되돌리지 않고 지금 값을 그대로 둡니다.
  const { editLockHolder, editLockAt, completedBy, missingReports, guideDone, deleted, deletedAt, deletedBy, updatedBy, ...contentOnly } = item.snapshot;
  const current = games.find(x=>x.id===gameId) || {};
  const g = {
    id: gameId,
    completedBy: current.completedBy, missingReports: current.missingReports, guideDone: current.guideDone,
    ...contentOnly,
    updatedAt: current.updatedAt
  };
  ['markerSize','lineWidth','annoScale'].forEach(k=>{ if (!(k in contentOnly)) delete g[k]; });
  const ok = await persistGame_(g);
  if (ok){
    const idx = games.findIndex(x=>x.id===gameId);
    if (idx !== -1) games[idx] = g;
    document.getElementById('historyBackdrop')?.remove();
    if (currentGameId === gameId){ resetChangeTracking_(); renderDetail(); }
    alert('복원되었습니다.');
  }
}

/**
 * ============================================================
 * 접속 알림 + 동시편집 잠금 (Firestore 실시간 리스너 사용)
 * ============================================================
 * Apps Script 때는 45초마다 서버에 "혹시 새 소식 있어요?" 하고 직접 물어보는
 * 방식(폴링)이었는데, Firestore는 onSnapshot으로 변화가 생기는 즉시 알 수 있어서
 * 훨씬 자연스럽고 빠릅니다.
 */
let presenceHeartbeatInterval_ = null;
let presenceUnsub_ = null;
let lockUnsub_ = null;
let lastPresenceOthers_ = [];
let holdsEditLock_ = false;
const PRESENCE_STALE_MS = 90000; // 90초 이상 신호가 없으면 "나갔다"고 취급

function sanitizeForDocId_(s){ return s.replace(/[^a-zA-Z0-9]/g, '_'); }

/** 편집을 시작하기 전에 호출합니다. 다른 편집자가 이미 편집 중이면 물어보고 넘겨받습니다. */
async function ensureEditLockForGame_(gameId){
  const email = auth.currentUser.email.toLowerCase();
  const gameRef = doc(db, 'games', gameId);

  const attempt = async (force)=>{
    return await runTransaction(db, async (tx)=>{
      const snap = await tx.get(gameRef);
      const data = snap.data() || {};
      const now = Date.now();
      const holderActive = data.editLockHolder && data.editLockHolder !== email && (now - (data.editLockAt||0)) < PRESENCE_STALE_MS;
      if (holderActive && !force){
        return { granted:false, holder: data.editLockHolder };
      }
      tx.update(gameRef, { editLockHolder: email, editLockAt: now });
      return { granted:true };
    });
  };

  const result = await attempt(false);
  if (result.granted){ holdsEditLock_ = true; return true; }

  const wantsToTake = confirm(`${result.holder}님이 현재 이 게임을 편집 중입니다.\n지금 편집하시겠습니까? (편집을 시작하면 ${result.holder}님은 뷰어로 전환됩니다)`);
  if (!wantsToTake) return false;

  const forced = await attempt(true);
  holdsEditLock_ = !!forced.granted;
  return holdsEditLock_;
}

/** 게임을 여는 동안 접속 신호를 계속 보내고, 다른 사람 접속/잠금 상태를 실시간으로 감시합니다. */
let lastPresenceRawData_ = []; // 정제 전 원본 접속 기록 (주기적 재평가용)
let presenceStaleCheckInterval_ = null;
let currentPresenceGameId_ = null;

function enterPresence_(gameId){
  const email = auth.currentUser.email.toLowerCase();
  currentPresenceGameId_ = gameId;
  const presenceRef = doc(db, 'games', gameId, 'presence', sanitizeForDocId_(email));

  const writePresence = ()=> setDoc(presenceRef, { email, lastSeen: Date.now() }).catch(()=>{});
  writePresence();
  presenceHeartbeatInterval_ = setInterval(writePresence, 30000);

  // 다른 편집자가 지금 같이 보고 있는지 실시간 감시
  presenceUnsub_ = onSnapshot(collection(db, 'games', gameId, 'presence'), (snap)=>{
    lastPresenceRawData_ = [];
    snap.forEach(d=> lastPresenceRawData_.push(d.data()));
    refreshPresenceBanner_(email);
  });

  // 데이터가 안 바뀌어도(예: 나간 사람이 접속 기록을 못 지우고 탭을 닫은 경우)
  // 시간이 지나면 유효기간이 끝나는지 주기적으로 다시 확인합니다.
  presenceStaleCheckInterval_ = setInterval(()=> refreshPresenceBanner_(email), 20000);

  // 내가 다른 편집자에게 밀려나서 잠금을 잃었는지 실시간 감시 (즉시 알림)
  lockUnsub_ = onSnapshot(doc(db, 'games', gameId), (snap)=>{
    const data = snap.data();
    if (holdsEditLock_ && data && data.editLockHolder && data.editLockHolder !== email){
      holdsEditLock_ = false;
      currentRole = 'viewer';
      updateRoleToggleUI_();
      renderDetail();
      alert(`${data.editLockHolder}님이 이 게임의 편집을 시작해서 뷰어로 전환되었습니다.`);
    }
  });
}

function refreshPresenceBanner_(myEmail){
  const now = Date.now();
  const others = lastPresenceRawData_
    .filter(d => d.email !== myEmail && (now - d.lastSeen) < PRESENCE_STALE_MS)
    .map(d => d.email);
  lastPresenceOthers_ = others;
  updatePresenceBanner_(others);
}

function leavePresence_(){
  if (presenceHeartbeatInterval_) clearInterval(presenceHeartbeatInterval_);
  if (presenceStaleCheckInterval_) clearInterval(presenceStaleCheckInterval_);
  if (presenceUnsub_) presenceUnsub_();
  if (lockUnsub_) lockUnsub_();
  presenceHeartbeatInterval_ = null; presenceStaleCheckInterval_ = null;
  presenceUnsub_ = null; lockUnsub_ = null;
  holdsEditLock_ = false;
  lastPresenceOthers_ = [];
  lastPresenceRawData_ = [];

  // 내 접속 기록을 바로 지워서, 다른 사람 화면에서도 곧바로 사라지게 합니다.
  // (지우지 않으면 시간이 지나기 전까지는 "아직 보고 있다"고 계속 남아있게 됩니다)
  if (currentPresenceGameId_ && auth.currentUser){
    const email = auth.currentUser.email.toLowerCase();
    deleteDoc(doc(db, 'games', currentPresenceGameId_, 'presence', sanitizeForDocId_(email))).catch(()=>{});
    currentPresenceGameId_ = null;
  }
}

function updatePresenceBanner_(otherEmails){
  const slot = document.getElementById('presenceBannerSlot');
  if (!slot) return;
  if (!otherEmails || !otherEmails.length){ slot.innerHTML = ''; return; }
  slot.innerHTML = `<div class="presence-banner">⚠ 이 게임을 지금 같이 보고 있는 편집자가 있습니다 (${otherEmails.length}명). 저장이 겹치지 않도록 서로 확인 후 작업해주세요.</div>`;
}

// ---- 표 탭 ----
function renderTableTab(){
  const g = games.find(x=>x.id===currentGameId);
  const editable = currentRole === 'editor';
  const cases = g.cases || [];
  const body = document.getElementById('tabBody');

  // 같은 케이스 종류끼리 묶어서 보여줍니다 (실제 데이터 순서는 그대로 두고, 화면에 보여줄
  // 순서만 종류별로 정렬합니다 — 그래야 마커가 가리키는 caseIdx가 안 어긋납니다).
  const typeOrder = SELECTABLE_TYPES;
  const order = cases.map((c, i) => i).sort((a, b) => {
    const ia = typeOrder.indexOf(cases[a].caseType);
    const ib = typeOrder.indexOf(cases[b].caseType);
    if (ia !== ib) return ia - ib;
    return a - b; // 같은 종류 안에서는 원래 순서 유지
  });

  let rows = '';
  order.forEach((ci, idx) => {
    const c = cases[ci];
    const nextCi = order[idx + 1];
    // 다음 줄이 다른 케이스 "종류"로 넘어가는 경계일 때만 굵은 선을 긋습니다.
    // (같은 종류의 케이스가 여러 개 있으면 그 사이는 얇은 선으로만 구분됩니다)
    const isTypeBoundary = (nextCi === undefined) || (cases[nextCi].caseType !== c.caseType);
    const items = c.items||[{name:'',qty:1}];
    items.forEach((it, ii) => {
      const isLastRowOfThisCase = ii === items.length - 1;
      rows += `<tr class="${(isLastRowOfThisCase && isTypeBoundary) ? 'case-end' : ''}">`;
      if (ii === 0){
        rows += `<td rowspan="${items.length}">
          ${editable
            ? `<select onchange="updateCaseType(${ci}, this.value)">${SELECTABLE_TYPES.map(t=>`<option value="${t}" ${t===c.caseType?'selected':''}>${typeLabel_(t)}</option>`).join('')}</select>`
            : `<span class="case-badge case-${c.caseType}">${typeLabel_(c.caseType)}</span>`}
        </td>`;
      }
      rows += `<td>${editable ? `<input value="${escHtml_(it.name||'')}" onchange="updateItem(${ci},${ii},'name',this.value)">` : escHtml_(it.name||'')}</td>`;
      rows += `<td style="width:80px;">${editable ? `<input type="number" value="${it.qty||0}" onchange="updateItem(${ci},${ii},'qty',this.value)">` : (it.qty||0)}</td>`;
      if (ii === 0){
        rows += `<td rowspan="${items.length}">
          ${editable
            ? `<textarea rows="2" style="width:100%; box-sizing:border-box; font-family:var(--sans); resize:vertical; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px;" placeholder="비고" onchange="updateCaseNote(${ci}, this.value)">${escHtml_(c.note||'')}</textarea>`
            : `<span style="white-space:pre-wrap;">${escHtml_(c.note||'')}</span>`}
        </td>`;
      }
      if (editable) rows += `<td style="width:40px;"><button class="btn btn-ghost2" style="padding:4px 8px; width:auto;" onclick="deleteItem(${ci},${ii})">✕</button></td>`;
      rows += `</tr>`;
    });
  });

  body.innerHTML = `
    <table class="case-table">
      <thead><tr><th>케이스</th><th>구성품</th><th>수량</th><th>비고</th>${editable?'<th></th>':''}</tr></thead>
      <tbody>${rows || `<tr><td colspan="5" style="color:var(--ink-soft);">등록된 케이스가 없습니다.</td></tr>`}</tbody>
    </table>
    ${editable ? `
      <div style="margin-top:14px;">
        <button class="btn btn-ghost2" style="width:auto;" onclick="addCase()">+ 케이스 추가</button>
      </div>
    ` : ''}
  `;
}

function addCase(){
  const g = games.find(x=>x.id===currentGameId);
  g.cases = g.cases || [];
  g.cases.push({ caseType:'A', items:[{name:'새 구성품', qty:1}] });
  renderTableTab();
}
function updateCaseType(ci, val){
  const g = games.find(x=>x.id===currentGameId);
  g.cases[ci].caseType = val;
}
function updateCaseNote(ci, val){
  const g = games.find(x=>x.id===currentGameId);
  g.cases[ci].note = val;
}
function updateItem(ci, ii, field, val){
  const g = games.find(x=>x.id===currentGameId);
  g.cases[ci].items[ii][field] = field === 'qty' ? Number(val) : val;
}
function deleteItem(ci, ii){
  const g = games.find(x=>x.id===currentGameId);
  g.cases[ci].items.splice(ii, 1);
  if (g.cases[ci].items.length === 0) removeCaseAndFixMarkers_(g, ci);
  renderTableTab();
}

/**
 * ============================================================
 * 반납대 가이드 (QR 스캔 후 바로 보이는, 반납 시 정리 안내 화면)
 * ============================================================
 */
const RETURN_GUIDE_COMMON_NOTICE = [
  '박스 안팎의 손상 확인',
  '구성품을 박스 안에 정돈',
  '누락·오염·파손 발견 시 게임을 분리하여 관리자에게 전달',
];
// Firestore에 저장된 값이 아직 없을 때 쓰는 기본값입니다 (loadReturnGuideCommonNotice_가 불러오면 덮어씁니다).
returnGuideCommonNotice_ = RETURN_GUIDE_COMMON_NOTICE.join('\n');

function ensureReturnGuide_(g){
  if (!g.returnGuide) g.returnGuide = {};
  const rg = g.returnGuide;
  if (rg.published === undefined) rg.published = false;
  if (!rg.requiredItems) rg.requiredItems = [];
  if (!rg.sortingSteps) rg.sortingSteps = [];
  if (!rg.noCountItems) rg.noCountItems = [];
  if (!rg.otherNotes) rg.otherNotes = [];
  if (rg.protectorInfo === undefined) rg.protectorInfo = '';
  if (rg.estMinutes === undefined) rg.estMinutes = null;
  return rg;
}

function renderReturnGuideTab(){
  const g = games.find(x=>x.id===currentGameId);
  const editable = currentRole === 'editor' && !rvMode_;
  const rg = ensureReturnGuide_(g);
  const body = document.getElementById('tabBody');
  // 항목 추가·삭제로 다시 그려도 보고 있던 스크롤 위치가 맨 위로 튀지 않게 기억해둡니다.
  const prevScroll = [...body.querySelectorAll('.rg-pane-body')].map(el=>el.scrollTop);
  const prevPageY = window.scrollY;

  if (editable){
    body.innerHTML = renderReturnGuideEditor_(g, rg);
  } else if (!rg.published){
    body.innerHTML = `<div class="empty">이 게임은 아직 반납대 가이드가 준비되지 않았습니다.</div>`;
    return;
  } else {
    body.innerHTML = renderReturnGuideViewer_(g, rg);
  }

  body.querySelectorAll('.case-photo-wrap[data-photo]').forEach(wrap=>{
    const path = wrap.dataset.photo;
    resolvePhotoUrl_(path).then(url=>{
      const imgEl = wrap.querySelector('.case-photo-thumb');
      if (imgEl) imgEl.src = url;
    }).catch(()=>{});
  });
  if (document.getElementById('rgPhotoCell0')) populateReturnGuidePhotoGrid_(g);
  fitReturnSplit_();
  body.querySelectorAll('.rg-pane-body').forEach((el, i)=>{ if (prevScroll[i]) el.scrollTop = prevScroll[i]; });
  if (prevScroll.length) window.scrollTo(0, prevPageY);
}

function rgPhotoControl_(section, idx, photo){
  return photo ? `
    <div class="case-photo-wrap mini checkerboard-bg" data-photo="${photo}">
      <img class="case-photo-thumb" alt="" onclick="event.stopPropagation(); openPhotoLightbox_(this.src)">
      <button class="case-photo-remove" title="사진 삭제" onclick="removeReturnPhoto_('${section}',${idx})">✕</button>
    </div>
  ` : `<button class="anno-item-photo-btn" onclick="triggerReturnPhotoUpload_('${section}',${idx})">📷 사진</button>`;
}

/** 이 구성품에 어떤 상태(A/B/C) 판정 기준을 적용할지 고르는 태그 버튼들입니다.
 *  하나의 구성품에 여러 기준을 동시에 연결할 수 있습니다 (예: 카드 + 프로텍터 + 식별스티커). */
function rgStandardsControl_(section, idx, standardIds){
  if (!conditionStandards.length) return '';
  const selected = new Set(standardIds || []);
  return `
    <div style="flex-basis:100%; display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-top:2px;">
      <span style="font-size:11px; color:var(--ink-soft);">적용 기준:</span>
      ${conditionStandards.map(cs=>`
        <button type="button" class="rg-tag ${selected.has(cs.id)?'active':''}" onclick="toggleGuideItemStandard_('${section}',${idx},'${cs.id}')">${cs.name}</button>
      `).join('')}
    </div>
  `;
}
function toggleGuideItemStandard_(section, idx, standardId){
  const g = games.find(x=>x.id===currentGameId);
  const rg = ensureReturnGuide_(g);
  const item = rg[section][idx];
  if (!item) return;
  if (!item.standardIds) item.standardIds = [];
  const pos = item.standardIds.indexOf(standardId);
  if (pos === -1) item.standardIds.push(standardId); else item.standardIds.splice(pos, 1);
  renderReturnGuideTab();
}

/** 뷰어 화면에서, 구성품에 연결된 상태 기준이 있으면 이름을 클릭 가능하게 만들고
 *  "📋 상태기준" 표시를 붙입니다. 없으면 그냥 평범한 이름만 보여줍니다. */
function rgClickableName_(name, standardIds){
  const ids = (standardIds || []).filter(id => conditionStandards.some(cs => cs.id === id));
  if (!ids.length) return `<div style="font-weight:700;">${name||''}</div>`;
  const idsLiteral = `[${ids.map(id=>`'${id}'`).join(',')}]`;
  const safeName = String(name||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  return `
    <div class="rg-item-clickable" onclick="event.stopPropagation(); openConditionPopup_('${safeName}', ${idsLiteral})">
      <span class="rg-item-name" style="font-weight:700;">${name||''}</span><span class="rg-standard-badge">📋 상태기준</span>
    </div>
  `;
}

/** 구성품에 연결된 모든 상태 기준을, 관리요소별 요약표 + 등급(A/B/C)별 대표 사진과
 *  핵심 기준을 한 팝업 안에 함께 보여줍니다 (스크롤/터치를 최소화하기 위한 "요약형" 구성). */
function openConditionPopup_(itemName, standardIds){
  const standards = (standardIds||[]).map(id=>conditionStandards.find(cs=>cs.id===id)).filter(Boolean);
  if (!standards.length) return;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'conditionPopupBackdrop';
  backdrop.innerHTML = `
    <div class="modal" style="max-width:480px; max-height:85vh; overflow-y:auto;">
      <h3>${itemName} 상태 확인</h3>
      <table style="width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:16px;">
        <thead><tr style="text-align:left; border-bottom:1px solid var(--line);">
          <th style="padding:4px 6px;">관리 요소</th><th style="padding:4px 6px;">현재 확인할 기준</th>
        </tr></thead>
        <tbody>
          ${standards.map(cs=>`
            <tr style="border-bottom:1px solid var(--line);">
              <td style="padding:6px; font-weight:700; vertical-align:top; white-space:nowrap;">${cs.name}</td>
              <td style="padding:6px; color:var(--ink-soft);">${['A','B','C'].map(gr=>cs.grades?.[gr]?.criteria).filter(Boolean).join(' / ') || '-'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${standards.map(cs=>`
        <div style="margin-bottom:18px;">
          <div style="font-weight:700; font-size:13px; margin-bottom:8px;">${cs.name}</div>
          <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px;">
            ${['A','B','C'].map(grade=>{
              const gd = cs.grades?.[grade] || {};
              return `
                <div style="text-align:center;">
                  <div style="font-weight:800; font-family:var(--mono); color:${CONDITION_GRADE_COLORS[grade]}; margin-bottom:4px;">${grade}</div>
                  ${gd.photo
                    ? `<div class="case-photo-wrap checkerboard-bg" data-photo="${gd.photo}" style="width:100%; height:5.5em;"><img class="case-photo-thumb" alt="" onclick="event.stopPropagation(); openPhotoLightbox_(this.src)"></div>`
                    : `<div style="width:100%; aspect-ratio:1; background:var(--bg); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-soft);">사진 없음</div>`}
                  <div style="font-size:10.5px; color:var(--ink-soft); margin-top:4px; line-height:1.4;">${gd.criteria||'-'}</div>
                </div>
              `;
            }).join('')}
          </div>
          ${cs.detail ? `
            <details style="margin-top:8px;">
              <summary style="font-size:11.5px; color:var(--ink-soft); cursor:pointer;">상세 기준 보기</summary>
              <p style="font-size:11.5px; color:var(--ink-soft); white-space:pre-wrap; margin-top:6px;">${cs.detail}</p>
            </details>
          ` : ''}
        </div>
      `).join('')}
      <div class="modal-actions">
        <button class="btn-cancel" onclick="document.getElementById('conditionPopupBackdrop').remove()">닫기</button>
      </div>
    </div>
  `;
  // 어두운 바깥 영역을 누르면 팝업이 닫힙니다.
  backdrop.addEventListener('click', (e)=>{ if (e.target === backdrop) backdrop.remove(); });
  document.body.appendChild(backdrop);
  backdrop.querySelectorAll('.case-photo-wrap[data-photo]').forEach(wrap=>{
    const path = wrap.dataset.photo;
    resolvePhotoUrl_(path).then(url=>{
      const imgEl = wrap.querySelector('.case-photo-thumb');
      if (imgEl) imgEl.src = url;
    }).catch(()=>{});
  });
}

/** "사진" 탭과 정확히 같은 비율로 보이도록, 지금 화면(탭바디)의 실제 폭을 기준 삼습니다.
 *  반납대 가이드 탭에서는 실제 .photo-stage가 화면에 없으므로, 같은 자리(#tabBody)의 폭을
 *  그대로 기준 폭으로 사용합니다 (사진 탭이든 반납대 가이드 탭이든 #tabBody 폭은 동일합니다). */
function getPhotoStageRefWidth_(){
  const el = document.getElementById('photoStage') || document.getElementById('tabBody');
  const w = el ? el.getBoundingClientRect().width : 0;
  return w || GUIDE_EXPORT_DEFAULT_REF_WIDTH;
}

/** 사진 탭의 이미지 다운로드 기능과 동일한 방식(캔버스에 마커·텍스트박스·라벨을 함께 그려서), 그리고
 *  동일한 기준 폭으로 각 사진의 축소 미리보기를 만들어 격자 칸에 채워 넣습니다. 실제 사진과 완전히
 *  같은 비율로 보이고, 텍스트박스 위치에는 클릭 가능한 투명 영역을 겹쳐서 그 구성품 사진을 크게
 *  볼 수 있는 팝업을 띄웁니다. */
const rgPhotoCache_ = new Map(); // (게임·사진 내용·기준 폭) → 만들어 둔 미리보기 (편집 중 다시 그릴 때 재사용)
async function populateReturnGuidePhotoGrid_(g){
  if (!g.photos) return;
  const refWidth = getPhotoStageRefWidth_();
  for (let i=0; i<g.photos.length; i++){
    if (!document.getElementById(`rgPhotoCell${i}`)) continue; // 그 사이 다른 탭으로 이동했으면 중단
    try{
      // 라벨만 얹은 원본 비율 사진 (텍스트박스·연결선·마커 없음, 축소 여백 없음)
      const key = `${g.id}|${Math.round(refWidth)}|${JSON.stringify(g.photos[i])}`;
      let url = rgPhotoCache_.get(key);
      if (!url){
        const { canvas } = await renderPhotoToCanvas_(g, g.photos[i], refWidth, { labelOnly: true });
        url = canvas.toDataURL('image/jpeg', 0.92);
        if (rgPhotoCache_.size > 60) rgPhotoCache_.clear();
        rgPhotoCache_.set(key, url);
      }
      const cell = document.getElementById(`rgPhotoCell${i}`);
      if (!cell) continue;
      cell.innerHTML = '';
      const imgEl = document.createElement('img');
      imgEl.alt = '';
      imgEl.src = url;
      imgEl.addEventListener('click', ()=> openPhotoLightbox_(url));
      cell.appendChild(imgEl);
    }catch(e){
      const cell = document.getElementById(`rgPhotoCell${i}`);
      if (cell) cell.innerHTML = '<span class="rg-photo-loading">불러오지 못했습니다</span>';
    }
  }
}

/** 반납대 가이드의 사진 격자에서 텍스트박스(구성품) 영역을 탭했을 때, 그 케이스에 속한
 *  구성품들의 사진을 크게 보여주는 팝업입니다. */
function openReturnGuideCasePopup_(gameId, caseIdx){
  const g = games.find(x=>String(x.id)===String(gameId));
  const c = g && g.cases && g.cases[caseIdx];
  if (!c) return;
  const items = c.items || [];
  const old = document.getElementById('rgCasePopupBackdrop');
  if (old) old.remove();
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'rgCasePopupBackdrop';
  backdrop.innerHTML = `
    <div class="modal" style="max-width:420px; max-height:85vh; overflow-y:auto;">
      <h3 style="display:flex; align-items:center; gap:6px;">
        <span style="display:inline-block; width:0.7em; height:0.7em; border-radius:50%; background:${caseColor_(c.caseType)};"></span>
        ${typeLabel_(c.caseType)} 구성품
      </h3>
      <div style="display:flex; flex-direction:column; gap:14px;">
        ${items.length ? items.map(it=>`
          <div style="display:flex; gap:12px; align-items:center;">
            ${it.photo
              ? `<div class="case-photo-wrap checkerboard-bg" data-photo="${it.photo}" style="width:5.5em; height:5.5em; flex-shrink:0;"><img class="case-photo-thumb" alt="" onclick="event.stopPropagation(); openPhotoLightbox_(this.src)"></div>`
              : ''}
            <div style="font-weight:700; font-size:13.5px;">${it.name||''}${it.qty ? ` <span style="color:var(--ink-soft); font-weight:600;">${it.qty}개</span>` : ''}</div>
          </div>
        `).join('') : '<p style="font-size:12.5px; color:var(--ink-soft);">등록된 구성품이 없습니다.</p>'}
      </div>
      ${c.note ? `<p style="font-size:11.5px; color:var(--ink-soft); font-style:italic; margin-top:14px; white-space:pre-wrap;">${c.note}</p>` : ''}
      <div class="modal-actions">
        <button class="btn-cancel" onclick="document.getElementById('rgCasePopupBackdrop').remove()">닫기</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.querySelectorAll('.case-photo-wrap[data-photo]').forEach(wrap=>{
    const path = wrap.dataset.photo;
    resolvePhotoUrl_(path).then(url=>{
      const imgEl = wrap.querySelector('.case-photo-thumb');
      if (imgEl) imgEl.src = url;
    }).catch(()=>{});
  });
}
